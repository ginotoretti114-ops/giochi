<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Piccante: ventaglio di carte numerate che scaldano dal verde al rosso, con il jolly al centro">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.6" fill="#f5aa3e" fill-opacity=".12"/>
      <circle cx="0" cy="0" r="1" fill="#ffffff" fill-opacity=".05"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="52%" r="58%">
      <stop offset="0" stop-color="#5a2c4e" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#2a2d62" stop-opacity=".6"/>
      <stop offset="1" stop-color="#131833" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <linearGradient id="cream" x1=".4" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#f4e6cb"/></linearGradient>
    <radialGradient id="night" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="#3d438f"/><stop offset="1" stop-color="#1f2352"/></radialGradient>
    <clipPath id="card"><rect x="-62" y="-87" width="124" height="174" rx="15"/></clipPath>
    <symbol id="chili1" viewBox="0 0 20 20">
      <path d="M5.6 7.6c3.2-1.6 7-.4 8.9 2.7 1.6 2.6 1.3 5.9-.7 8.1-.5.5-1.3.2-1.2-.5.2-2.2-.8-4.3-2.6-5.6-1.3-1-2.9-1.5-4.4-1.4-1 .1-1.5-1.2-.6-1.8z" fill="#fffaf0"/>
      <path d="M8 7.2c.2-1.9 1.5-3.4 3.4-3.9" fill="none" stroke="#fffaf0" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="chili" viewBox="0 0 20 20">
      <path d="M5.6 7.6c3.2-1.6 7-.4 8.9 2.7 1.6 2.6 1.3 5.9-.7 8.1-.5.5-1.3.2-1.2-.5.2-2.2-.8-4.3-2.6-5.6-1.3-1-2.9-1.5-4.4-1.4-1 .1-1.5-1.2-.6-1.8z" fill="#e8462f"/>
      <path d="M8 7.2c.2-1.9 1.5-3.4 3.4-3.9M5.2 8.3c1-1.6 3.4-2.1 5-1" fill="none" stroke="#7cc04f" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <g id="face"><rect x="-62" y="-87" width="124" height="174" rx="15" fill="url(#cream)"/></g>
    <g id="edge"><rect x="-62" y="-87" width="124" height="174" rx="15" fill="none" stroke="#5a370a" stroke-opacity=".25" stroke-width="2"/></g>
  </defs>

  <rect width="600" height="360" fill="#131833"/>
  <rect width="600" height="360" fill="url(#dots)"/>
  <rect width="600" height="360" fill="url(#glow)"/>

  <use href="#chili" x="26" y="18" width="88" height="88" transform="rotate(-24 70 62)" opacity=".9"/>
  <use href="#chili" x="494" y="4" width="80" height="80" transform="rotate(38 534 44)" opacity=".9"/>

  <g filter="url(#shadow)" font-family="'Rozha One', Georgia, 'Times New Roman', serif">
    <!-- 6: mite -->
    <g transform="rotate(-16 132 330) translate(132 200)">
      <use href="#face"/>
      <g clip-path="url(#card)"><rect x="-62" y="-87" width="124" height="33" fill="#6fae46"/><rect x="-62" y="78" width="124" height="9" fill="#6fae46"/></g>
      <use href="#chili1" x="-9" y="-83" width="18" height="18"/>
      <text x="0" y="40" text-anchor="middle" font-size="84" fill="#3d7420">6</text>
      <use href="#edge"/>
    </g>
    <!-- 55: il più piccante -->
    <g transform="rotate(16 468 330) translate(468 200)">
      <use href="#face"/>
      <g clip-path="url(#card)"><rect x="-62" y="-87" width="124" height="33" fill="#a8213b"/><rect x="-62" y="78" width="124" height="9" fill="#a8213b"/></g>
      <use href="#chili1" x="-47" y="-83" width="18" height="18"/><use href="#chili1" x="-28" y="-83" width="18" height="18"/><use href="#chili1" x="-9" y="-83" width="18" height="18"/><use href="#chili1" x="10" y="-83" width="18" height="18"/><use href="#chili1" x="29" y="-83" width="18" height="18"/>
      <text x="0" y="40" text-anchor="middle" font-size="76" fill="#8c142d">55</text>
      <use href="#edge"/>
    </g>
    <!-- 23 -->
    <g transform="rotate(-8 216 330) translate(216 186)">
      <use href="#face"/>
      <g clip-path="url(#card)"><rect x="-62" y="-87" width="124" height="33" fill="#ee8a32"/><rect x="-62" y="78" width="124" height="9" fill="#ee8a32"/></g>
      <use href="#chili1" x="-28" y="-83" width="18" height="18"/><use href="#chili1" x="-9" y="-83" width="18" height="18"/><use href="#chili1" x="10" y="-83" width="18" height="18"/>
      <text x="0" y="40" text-anchor="middle" font-size="76" fill="#a9500d">23</text>
      <use href="#edge"/>
    </g>
    <!-- 41 -->
    <g transform="rotate(8 384 330) translate(384 186)">
      <use href="#face"/>
      <g clip-path="url(#card)"><rect x="-62" y="-87" width="124" height="33" fill="#df4a33"/><rect x="-62" y="78" width="124" height="9" fill="#df4a33"/></g>
      <use href="#chili1" x="-38" y="-83" width="18" height="18"/><use href="#chili1" x="-19" y="-83" width="18" height="18"/><use href="#chili1" x="0" y="-83" width="18" height="18"/><use href="#chili1" x="19" y="-83" width="18" height="18"/>
      <text x="0" y="40" text-anchor="middle" font-size="76" fill="#ad2c18">41</text>
      <use href="#edge"/>
    </g>
    <!-- il jolly -->
    <g transform="translate(300 178)">
      <rect x="-62" y="-87" width="124" height="174" rx="15" fill="url(#night)"/>
      <rect x="-62" y="-87" width="124" height="174" rx="15" fill="none" stroke="#f5aa3e" stroke-opacity=".7" stroke-width="2.6"/>
      <text x="0" y="-58" text-anchor="middle" font-family="'Atkinson Hyperlegible', Arial, sans-serif" font-weight="700" font-size="16" fill="#f5aa3e" fill-opacity=".9">0–56</text>
      <g transform="translate(-30 -42) scale(1.5)">
        <path d="M20.5 3c1.6 6.4 9.5 9.6 9.5 19a10 10 0 0 1-20 0c0-4.6 2.2-7.8 4.6-9.9-.1 3.2 1 5.6 3.2 6.8-1.3-6.6.4-11.9 2.7-15.9z" fill="#f5aa3e"/>
        <path d="M20 24c1.6 2.2 4 3.4 4 6.2a4 4 0 0 1-8 0c0-2.5 2.2-3.5 4-6.2z" fill="#1f2352"/>
      </g>
      <text x="0" y="68" text-anchor="middle" font-family="'Atkinson Hyperlegible', Arial, sans-serif" font-weight="700" font-size="19" letter-spacing="2" fill="#f5aa3e">JOLLY</text>
    </g>
  </g>
</svg>
