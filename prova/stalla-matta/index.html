<!DOCTYPE html>
<html lang="it">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stalla Matta</title>
<meta name="description" content="Gioco di carte da 2 a 8 giocatori: riempi la tua stalla di unicorni e rovina quella degli altri. Vince chi ne ha 7.">
<meta name="theme-color" content="#131833">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M15 2l-3.2 7.4' stroke='%23f5aa3e' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M6 21c0-6 2.5-10 7-11.5 2.5-.8 5 .8 5.5 3l-2.4 1.4-1.6-1.2c-1.4 2-1.5 4.8.5 8.3z' fill='%23f6eedd'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Rozha+One&display=swap">
<style>
:root {
  /* Stalla Matta: la notte indaco della sala giochi con carte color confetto: lilla gli unicorni magici,
     verdi le Magie, arancio i Bonus, gialli i Malus, rosse le istantanee. */
  /* Layout: una colonna (max 560px): le stalle degli altri, il tavolo con la cronaca, la tua stalla e la tua mano, le mosse in basso. */
  --table: #131833;
  --panel: #1b2246;
  --raise: #283161;
  --line: #3b4784;
  --text: #f6eedd;
  --muted: #b3b5d4;
  --saffron: #f5aa3e;
  --on-saffron: #2a1903;
  --bad: #ff9f8a;
  --good: #7ad7a2;
  --pink: #ff8fc7;
  --font-display: "Rozha One", Georgia, "Times New Roman", serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background-color: var(--table);
  background-image: radial-gradient(circle, rgba(255, 143, 199, .08) 1.5px, transparent 2.1px), linear-gradient(180deg, rgba(120, 60, 140, .12), transparent 40%);
  background-size: 28px 28px, 100% 100%;
  color: var(--text); font: 16px/1.4 var(--font-body); -webkit-text-size-adjust: 100%;
}
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }
#app { max-width: 560px; margin: 0 auto; padding: 0 16px; min-height: 100%; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.err { color: var(--bad); }

/* ---------- carte ---------- */
.uc { --w: 58px; --bg: #fff; --edge: #8a8fb8; position: relative; flex: none; width: var(--w); aspect-ratio: 5 / 7; border-radius: calc(var(--w) * .13); padding: 0; border: 0;
  background: var(--bg); color: #1d1a33; display: grid; place-items: center; overflow: hidden; isolation: isolate;
  box-shadow: inset 0 0 0 calc(var(--w) * .045) var(--edge), 0 2px 0 rgba(0, 0, 0, .3), 0 5px 12px rgba(0, 0, 0, .28); font-family: var(--font-body); transition: transform .15s ease; }
.uc .ty { position: absolute; top: calc(var(--w) * .05); left: calc(var(--w) * .09); font: 700 calc(var(--w) * .18)/1 var(--font-body); color: var(--edge); }
.uc .ic { font: calc(var(--w) * .42)/1 var(--emoji); margin-top: calc(var(--w) * -.16); }
.uc .nm { position: absolute; bottom: calc(var(--w) * .07); left: 3px; right: 3px; text-align: center; font: 700 calc(var(--w) * .145)/1.02 var(--font-body); overflow-wrap: anywhere; }
.uc.t-cucciolo, .uc.t-semplice { --bg: #fff; }
.uc.t-cucciolo::before, .uc.t-semplice::before { content: ""; position: absolute; inset: 0; background: var(--col, #ccc); opacity: .42; z-index: -1; }
.uc.t-cucciolo { --edge: #d0679f; }
.uc.t-semplice { --edge: #5b5f8f; }
.uc.t-magico { --bg: linear-gradient(170deg, #f3ecff, #c7b1fb); --edge: #7a55d6; }
.uc.t-magia { --bg: linear-gradient(170deg, #eafcef, #a6e2b6); --edge: #2f9a59; }
.uc.t-bonus { --bg: linear-gradient(170deg, #fff2df, #fbc57c); --edge: #d9822b; }
.uc.t-malus { --bg: linear-gradient(170deg, #fffbe2, #eed96c); --edge: #a1820e; }
.uc.t-istante { --bg: linear-gradient(170deg, #ffeaea, #f4a0a0); --edge: #cc3b3b; }
.uc.back { --bg: repeating-linear-gradient(45deg, #2b2f6b 0 6px, #343a7d 6px 12px); box-shadow: inset 0 0 0 calc(var(--w) * .045) var(--pink), 0 2px 0 rgba(0, 0, 0, .3); }
.uc.back::after { content: "✦"; color: var(--pink); font-size: calc(var(--w) * .42); }
.uc.ghost { opacity: .18; }
button.uc { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button.uc:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
button.uc[aria-pressed="true"] { transform: translateY(-8px); box-shadow: 0 0 0 3px var(--saffron), 0 10px 18px rgba(0, 0, 0, .45); }
.uc.new { animation: pop .45s both; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.9); } to { opacity: 1; transform: none; } }
/* le carte nelle stalle: etichette compatte */
.ch { display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px 4px 6px; border-radius: 999px; font: 700 13px/1.15 var(--font-body); border: 0; color: #1d1a33; background: #e9e9f7; max-width: 100%; text-align: left; }
.ch i { font: normal 15px/1 var(--emoji); flex: none; }
.ch.t-cucciolo { background: #ffd6ec; }
.ch.t-semplice { background: #eef0ff; box-shadow: inset 4px 0 0 var(--colc, #9aa); }
.ch.t-magico { background: #dccbff; }
.ch.t-bonus { background: #ffd9a3; }
.ch.t-malus { background: #f6e58a; }
.ch.off { opacity: .55; text-decoration: line-through; }
button.ch { cursor: pointer; touch-action: manipulation; }
button.ch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--saffron); transform: translateY(-2px); }
button.ch:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.fan { display: flex; justify-content: center; align-items: flex-start; height: 104px; margin-bottom: 6px; }
.fan .uc { --w: 62px; margin: 0 -7px; transform: translateY(var(--y)) rotate(var(--r)); transform-origin: 50% 140%; }

/* ---------- lobby ---------- */
.hubnav { padding-top: 6px; display: flex; justify-content: space-between; align-items: center; }
.hubnav a { text-decoration: none; display: inline-block; }
.brand { text-align: center; padding: 14px 0 8px; }
.brand h1 { font: 46px/1 var(--font-display); margin: 4px 0 0; }
.brand h1 span { color: var(--pink); }
.brand .tag { color: var(--muted); margin: 8px auto 0; max-width: 38ch; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 14px 0 0; display: grid; gap: 10px; }
.h2 { font: 22px/1.15 var(--font-display); margin: 0; }
.lab { font-size: 14px; color: var(--muted); }
.field { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--table); color: var(--text); font: 17px/1.2 var(--font-body); }
.field:focus-visible { outline: 3px solid var(--saffron); outline-offset: 1px; }
.field.share { font-size: 14px; color: var(--muted); }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.net { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.net i, .netdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.net.up i, .netdot.up { background: var(--good); box-shadow: 0 0 0 3px rgba(122, 215, 162, .18); }
.net.down i, .netdot.down, .net.off i, .netdot.off { background: var(--bad); }
.netdot { margin-left: 8px; vertical-align: 3px; }
.games { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.gitem { display: flex; align-items: stretch; gap: 6px; }
.gopen { flex: 1; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; text-align: left; padding: 11px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--raise); cursor: pointer; }
.gnames { font-weight: 700; }
.gstate { grid-column: 1; font-size: 14px; color: var(--muted); }
.gcta { grid-column: 2; grid-row: 1 / span 2; font-weight: 700; font-size: 14px; padding: 7px 11px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
.gitem.hot .gopen { border-color: var(--saffron); }
.gitem.hot .gstate { color: var(--saffron); }
.gitem.hot .gcta { background: var(--saffron); color: var(--on-saffron); border-color: var(--saffron); }
.icon-btn { width: 44px; flex: none; display: grid; place-items: center; border-radius: 12px; border: 1.5px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.icon-btn svg { width: 20px; height: 20px; }
.howto ol { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.howto li::marker { color: var(--saffron); font-weight: 700; }
.note { text-align: center; font-size: 13px; color: var(--muted); max-width: 44ch; margin: 18px auto 0; line-height: 1.45; }
.foot { text-align: center; margin: 14px 0 28px; }
.seated { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.seated li { display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 12px; border-radius: 12px; background: var(--raise); min-height: 44px; }
.seated .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--table); font-weight: 700; font-size: 13px; flex: none; }
.seated .tag { margin-left: auto; font-size: 13px; color: var(--muted); }
.seated .icon-btn { width: 36px; height: 36px; }
.names { display: grid; gap: 8px; }
.names .row { display: flex; gap: 6px; }
.names .row .field { flex: 1; }
.exps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.exps li { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: var(--raise); min-height: 44px; }
.exps input { width: 20px; height: 20px; accent-color: var(--saffron); flex: none; }
.exps .t { flex: 1; min-width: 0; }
.exps .t small { display: block; color: var(--muted); font-size: 13px; }
.exps .soon { font-size: 12px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.exps li.off { opacity: .6; }

/* ---------- pulsanti ---------- */
.btn { appearance: none; border: 1.5px solid var(--line); background: var(--raise); color: var(--text); border-radius: 12px; padding: 12px 14px; font: 700 15px/1.15 var(--font-body); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; touch-action: manipulation; }
.btn.primary { background: var(--saffron); border-color: var(--saffron); color: var(--on-saffron); }
.btn.neigh { background: #c4344a; border-color: #ff7d8f; color: #fff; }
.btn.wide { width: 100%; }
.btn.sm { min-height: 38px; padding: 7px 12px; font-size: 14px; }
.btn:disabled { opacity: .42; cursor: default; }
.btn small { font-weight: 400; opacity: .85; }
.btn:focus-visible, .linkbtn:focus-visible, .gopen:focus-visible, .icon-btn:focus-visible, .who-btn:focus-visible, .tgt:focus-visible, .pile:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.linkbtn { background: none; border: 0; padding: 8px 4px; color: var(--muted); font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: none; }
.linkbtn.accent { color: var(--saffron); }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btnrow .btn { flex: 1; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 8px 11px; font-weight: 700; font-size: 15px; color: var(--muted); cursor: pointer; min-width: 40px; }
.seg button[aria-pressed="true"] { background: var(--saffron); color: var(--on-saffron); }
.seg button:focus-visible { outline: 3px solid #fff; outline-offset: -3px; }
.botb { font: 13px/1 var(--emoji); }
.thinking { display: inline-block; animation: think 1s ease-in-out infinite; }
@keyframes think { 50% { opacity: .35; } }

/* ---------- tavolo ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 4px; padding: 6px 0 2px; }
.topbar .round { font: 17px/1 var(--font-display); white-space: nowrap; }
.topbar .right { display: flex; align-items: center; gap: 0; }
.banner { margin: 8px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--raise); border: 1px solid var(--line); font-size: 14px; display: grid; gap: 8px; }
.status { font: 25px/1.1 var(--font-display); text-align: center; margin: 10px 0 2px; }
.status.is-turn { color: var(--saffron); }
.status.is-ask { color: var(--pink); }
.opps { display: grid; gap: 8px; margin-top: 8px; }
.opp { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 6px 9px 9px; min-width: 0; display: grid; gap: 6px; align-content: start; }
.opp.turn { border-color: var(--saffron); box-shadow: 0 0 0 1px var(--saffron); }
.opp.ask { border-color: var(--pink); box-shadow: 0 0 0 1px var(--pink); }
.opp.near { background: linear-gradient(180deg, rgba(255, 143, 199, .16), var(--panel) 60%); }
.who-btn { display: flex; align-items: center; gap: 8px; width: 100%; min-width: 0; padding: 4px 0; border: 0; background: none; cursor: pointer; text-align: left; }
.who-btn .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.cnt { margin-left: auto; display: inline-flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); flex: none; }
.cnt b { color: var(--text); }
.cnt .uni b { color: var(--pink); }
.bar { height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, #ff8fc7, #b388ff); border-radius: 3px; }
.empty { font-size: 13px; color: var(--muted); }
.tavolo { margin-top: 10px; padding: 10px 12px; border-radius: 16px; background: radial-gradient(ellipse at 50% 0%, #3b2a55, #1b2246 70%); border: 1px solid var(--line); display: grid; gap: 10px; }
.piles { display: flex; gap: 12px; align-items: flex-end; }
.pile { display: grid; justify-items: center; gap: 3px; font-size: 12px; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; }
.pile .uc { --w: 44px; }
.pile .nido { font: 26px/1 var(--emoji); width: 44px; aspect-ratio: 5 / 7; display: grid; place-items: center; border-radius: 7px; border: 1.5px dashed var(--line); }
.chain { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px; border-radius: 12px; background: rgba(255, 255, 255, .06); }
.chain .uc { --w: 50px; }
.chain .arrow { color: var(--pink); font-weight: 700; }
.chain .lbl { font-size: 13px; color: var(--muted); display: grid; }
.chain .lbl b { color: var(--text); }
.cron { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; min-width: 0; }
.cron li { padding: 3px 8px; border-radius: 9px; background: rgba(255, 255, 255, .05); }
.cron li.new { animation: pop .35s both; }
.cron li.bad { color: #ffb4a8; }
.mine { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px 12px; margin-top: 12px; display: grid; gap: 10px; }
.mine.turn { border-color: var(--saffron); }
.mine .hd { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mine .hd b { font: 19px/1.1 var(--font-display); }
.zone h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.hand { display: flex; flex-wrap: wrap; gap: 7px; }
.hand .uc { --w: 62px; }
.pass { text-align: center; display: grid; gap: 10px; padding: 8px 0; }
.pass b { font: 22px/1.1 var(--font-display); color: var(--saffron); }
.actions { position: sticky; bottom: 0; z-index: 2; margin: 14px -16px 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(19, 24, 51, .96); border-top: 1px solid var(--line); display: grid; gap: 8px; margin-top: auto; max-height: 62vh; overflow: auto; }
.spacer { flex: 1; min-height: 14px; }
.hint { margin: 0; font-size: 15px; color: var(--muted); }
.hint b { color: var(--text); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opts .uc { --w: 58px; }
.grp { display: grid; gap: 5px; }
.grp .lab { font-size: 13px; }

/* ---------- fogli ---------- */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(8, 10, 24, .72); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 90%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 20px 20px 0 0; padding: 20px 18px calc(22px + env(safe-area-inset-bottom)); display: grid; gap: 12px; }
.sheet h2 { font: 28px/1.1 var(--font-display); margin: 0; }
.sheet h3 { font-size: 15px; margin: 6px 0 0; color: var(--saffron); text-transform: uppercase; letter-spacing: .07em; }
.sheet h3.exp-t { font: 24px/1.15 var(--font-display); color: var(--text); text-transform: none; letter-spacing: 0; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.sheet p, .sheet ul { margin: 0; }
.sheet ul { padding-left: 20px; display: grid; gap: 6px; }
.eyebrow { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.detail { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.detail .uc { --w: 108px; }
.detail .txt { font-size: 16px; }
.tgts { display: grid; gap: 6px; }
.tgt { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--raise); cursor: pointer; min-height: 48px; }
.tgt:disabled { opacity: .45; cursor: default; }
.tgt .av { font: 22px/1 var(--emoji); }
.tgt .t { flex: 1; min-width: 0; }
.tgt .t small { display: block; color: var(--muted); font-size: 13px; }
.tgt.go { border-color: var(--saffron); }
.log { list-style: none; padding: 0; margin: 0; }
.log li { padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.log li.sep { color: var(--saffron); font-weight: 700; }
.catalog { display: grid; gap: 10px; }
.catalog .row { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.catalog .uc { --w: 46px; }
.catalog .t { font-size: 14px; }
.catalog .t b { display: block; }
.kw { font-weight: 700; letter-spacing: .02em; }
table.score { width: 100%; border-collapse: collapse; }
table.score th, table.score td { padding: 7px 6px; text-align: left; border-bottom: 1px solid var(--line); }
table.score td:last-child { white-space: nowrap; text-align: right; }
table.score thead th { color: var(--muted); font-size: 13px; }
table.score tr.win td { color: var(--saffron); font-weight: 700; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
.confetti i { position: absolute; top: -40px; font: 26px/1 var(--emoji); animation: fall var(--t) linear var(--d) both; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

@media (prefers-reduced-motion: reduce) { .uc.new, .cron li.new, .confetti i, .thinking { animation: none !important; } }
@media (max-width: 400px) { .topbar .bk { display: none; } .hand .uc { --w: 56px; } .ch { font-size: 12px; } }

/* ---------- computer e schermi larghi: lobby e tavolo su due colonne, fogli al centro ---------- */
@media (min-width: 1000px) {
  #app.wide { max-width: 1240px; padding: 0 28px; }
  #app.wide > .hubnav { width: 100%; max-width: 1040px; margin: 0 auto; }
  .desk { display: grid; grid-template-columns: minmax(0, 1fr) minmax(380px, 460px); gap: 0 28px; align-items: start; }
  .desk > div { min-width: 0; }
  .desk .col-r { position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow: auto; padding: 0 4px 12px; margin: 0 -4px; scrollbar-width: thin; }
  .desk .col-r > :first-child { margin-top: 8px; }
  .desk .actions { position: static; margin: 12px 0 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); max-height: none; overflow: visible; }
  .desk.lobby { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); width: 100%; max-width: 1040px; margin: 0 auto 28px; gap: 0 24px; }
  .desk.lobby .col-r { position: static; max-height: none; overflow: visible; padding: 0; margin: 0; }
  .desk.lobby .col-r > .panel:first-child { margin-top: 14px; }
  .desk.lobby .note { margin-top: 16px; }
  .desk .opps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .desk .hand .uc { --w: 68px; }
  .desk .opts .uc { --w: 62px; }
  .desk .pile .uc, .desk .pile .nido { --w: 54px; width: 54px; }
}
@media (min-width: 700px) and (min-height: 520px) {

    }, wait);
  }
  // Online: se non hai Nitriti lasci passare da solo, dopo una pausa a caso (così nessuno capisce chi li ha).
  function autoPass() {
    if (ui.route !== 'game' || !ui.game) return;
    var s = ui.game, me = K.seatOf(s, ui.myKey), pr = s.prompt;
    if (s.status !== 'playing' || !pr || pr.kind !== 'nitrito' || me < 0 || pr.wait.indexOf(me) < 0 || puoNitrire(s, me) || ui.online !== 'up') return;
    var key = ui.gameId + ':' + s.createdAt + ':' + pr.id;
    if (ui.autoKey === key) return;
    ui.autoKey = key;
    setTimeout(function () {
      var c = net.carica(ui.gameId) || ui.game;
      if (!c || c.status !== 'playing' || !c.prompt || c.prompt.id !== pr.id || c.prompt.wait.indexOf(me) < 0 || ui.route !== 'game') return;
      together({ type: 'answer', pass: true, pid: pr.id }, true);
    }, 700 + Math.floor(Math.random() * 1700));
  }
  function together(move, quiet) {
    var s = ui.game, seat = K.seatOf(s, ui.myKey);
    var ok = writeGame(function (c) { return K.act(c, seat, move); }, { quiet: !!quiet });
    if (ok) ui.pending = { id: ui.gameId, seat: seat, move: move };
    return ok;
  }

  /* ---------- azioni ---------- */
  function play(move) {
    var s = cur(); if (!s) return false;
    var P = persp(s), seat = P.me;
    if (seat < 0) return false;
    if (s.prompt && move.type === 'answer' && move.pid == null) move.pid = s.prompt.id;
    if (P.bot || P.local) {
      var r = K.act(s, seat, move);
      if (!r.ok) { ui.error = r.error; S.effetto('errore'); render(); return false; }
      if (P.bot) { ui.bot = r.state; saveBot(); }
      else {
        ui.local = r.state; saveLocal();
        if (K.waitingFor(ui.local).indexOf(seat) < 0 || (ui.local.prompt && ui.local.prompt.kind === 'nitrito')) { ui.handOpen = -1; ui.neighBy = -1; }
      }
      ui.error = ''; ui.sel = [];
      render();
      return true;
    }
    var multi = !!(s.prompt && s.prompt.wait);
    var ok = multi ? together(move) : writeGame(function (c) { return K.act(c, seat, move); }, { expectV: s.v });
    if (ok) ui.sel = [];
    return ok;
  }
  function readNames() {
    ui.localNames = ui.localNames.map(function (nm, i) { var el = document.getElementById('ln-' + i); return el ? el.value : nm; });
    LS.set('sm-lnames', JSON.stringify(ui.localNames));
  }
  var actions = {
    lobby: function () { go(''); },
    'go-local': function () { go('#locale'); },
    open: function (el) { go('#partita-' + el.dataset.id); },
    'new': createGame,
    'ask-del': function (el) { ui.sheet = 'del'; ui.sheetId = el.dataset.id; render(); },
    del: function () { var id = ui.sheetId; ui.sheet = null; if (net && id) net.togli(id); render(); },
    close: function () { ui.sheet = null; ui.error = ''; render(); },
    rules: function () { ui.sheet = 'rules'; render(); },
    log: function () { ui.sheet = 'log'; render(); },
    who: function (el) { ui.who = +el.dataset.seat; ui.sheet = 'who'; render(); },
    pile: function (el) { ui.pile = el.dataset.p; ui.sheet = 'pile'; render(); },
    card: function (el) { ui.card = el.dataset.c; ui.sheet = 'card'; ui.error = ''; S.effetto('click'); render(); },
    'hide-result': function () { ui.hideResultKey = resultKey(cur()); ui.error = ''; render(); },
    'show-result': function () { ui.hideResultKey = null; render(); },
    share: function () {
      var s = ui.game, text = (s ? nameOf(s, s.host) : 'Un amico') + ' ti invita a Stalla Matta: apri il link e siediti al tavolo.';
      if (navigator.share) navigator.share({ title: 'Stalla Matta', text: text, url: shareUrl(ui.gameId) }).catch(function () { /* annullato */ });
      else actions.copy();
    },
    copy: function () {
      var done = function () { ui.copied = true; render(); setTimeout(function () { ui.copied = false; render(); }, 2200); };
      var fallback = function () { var el = document.getElementById('share-url'); if (el) { el.focus(); el.select(); } };
      try { navigator.clipboard.writeText(shareUrl(ui.gameId)).then(done, fallback); } catch (e) { fallback(); }
    },
    join: function () {
      var name = (ui.name || '').trim() || 'Giocatore';
      LS.set('sm-name', name);
      var key = ui.myKey;
      if (writeGame(function (c) { return K.join(c, key, name); })) ui.pendingJoin = { id: ui.gameId, name: name };
    },
    start: function () { var s = ui.game; if (s && writeGame(function (c) { return K.startGame(c); }, { expectV: s.v })) S.effetto('mescola'); },
    'bot-add': function () { var s = ui.game; if (s) writeGame(function (c) { return K.addBot(c, ui.botLv, freeBotName(c)); }, { expectV: s.v }); },
    'bot-del': function (el) { var s = ui.game, i = +el.dataset.seat; if (s) writeGame(function (c) { return K.removeBot(c, i); }, { expectV: s.v }); },
    exp: function (el) {
      var id = el.dataset.v, i = ui.exp.indexOf(id);
      if (el.checked && i < 0) ui.exp.push(id); else if (!el.checked && i >= 0) ui.exp.splice(i, 1);
      LS.set('sm-exp', JSON.stringify(ui.exp)); render();
    },
    'room-exp': function (el) {
      var s = ui.game; if (!s) return;
      var list = (s.exp || ['base']).slice(), id = el.dataset.v, i = list.indexOf(id);
      if (el.checked && i < 0) list.push(id); else if (!el.checked && i >= 0) list.splice(i, 1);
      writeGame(function (c) { return K.setExp(c, list); }, { expectV: s.v });
    },
    play: function (el) {
      var m = { type: 'play', card: el.dataset.c };
      if (el.dataset.t != null) m.to = +el.dataset.t;
      if (play(m)) { ui.sheet = null; render(); }
    },
    draw: function () { play({ type: 'draw' }); },
    end: function () { play({ type: 'end' }); },
    pick: function (el) {
      var c = el.dataset.c, i = ui.sel.indexOf(c), s = cur(), pr = s && s.prompt;
      var max = pr ? (pr.n || 1) : 1;
      if (i >= 0) ui.sel.splice(i, 1); else { ui.sel.push(c); if (ui.sel.length > max) ui.sel.shift(); }
      S.effetto('click'); render();
    },
    'pick-go': function () { play({ type: 'answer', cards: ui.sel.slice() }); },
    skip: function () { play({ type: 'answer', skip: true }); },
    use: function (el) { play({ type: 'answer', cards: [el.dataset.c] }); },
    target: function (el) { play({ type: 'answer', target: +el.dataset.seat }); },
    save: function (el) { play({ type: 'answer', pick: el.dataset.v }); },
    yes: function (el) { play({ type: 'answer', yes: el.dataset.v === '1' }); },
    neigh: function (el) { play({ type: 'answer', cards: [el.dataset.c] }); },
    'neigh-pass': function () { play({ type: 'answer', pass: true }); },
    // sullo stesso telefono: chi vuole rispondere prende il telefono; «nessuno» lascia passare per tutti
    'neigh-who': function (el) { ui.neighBy = +el.dataset.seat; ui.handOpen = -1; render(); },
    'neigh-none': function () {
      var s = ui.local; if (!s || !s.prompt || s.prompt.kind !== 'nitrito') return;
      var pid = s.prompt.id, wait = s.prompt.wait.slice();
      for (var i = 0; i < wait.length; i++) {
        if (!s.prompt || s.prompt.id !== pid) break;
        var r = K.act(s, wait[i], { type: 'answer', pass: true, pid: pid });
        if (r.ok) s = r.state;
      }
      ui.local = s; ui.neighBy = -1; ui.handOpen = -1; saveLocal(); render();
    },
    'hand-open': function () { var s = cur(); if (s) { ui.handOpen = persp(s).me; render(); } },
    rematch: function () {
      if (ui.route === 'bot') { var rb = K.rematch(ui.bot); if (rb.ok) { ui.bot = rb.state; ui.hideResultKey = null; saveBot(); S.effetto('mescola'); render(); } return; }
      if (ui.route === 'local') { var r = K.rematch(ui.local); if (r.ok) { ui.local = r.state; ui.hideResultKey = null; ui.handOpen = -1; ui.neighBy = -1; saveLocal(); S.effetto('mescola'); render(); } return; }
      var s = ui.game; if (s && writeGame(function (c) { return K.rematch(c); }, { expectV: s.v })) S.effetto('mescola');
    },
    'ln-add': function () { readNames(); if (ui.localNames.length < K.MAX_PLAYERS) ui.localNames.push(''); LS.set('sm-lnames', JSON.stringify(ui.localNames)); render(); },
    'ln-del': function (el) { readNames(); ui.localNames.splice(+el.dataset.i, 1); LS.set('sm-lnames', JSON.stringify(ui.localNames)); render(); },
    'bot-n': function (el) { ui.botN = +el.dataset.v; LS.set('sm-botn', String(ui.botN)); render(); },
    'bot-lv': function (el) { ui.botLv = el.dataset.v; LS.set('sm-botlv', ui.botLv); render(); },
    'bot-fast': function (el) { ui.botFast = el.dataset.v === '1'; LS.set('sm-botfast', ui.botFast ? '1' : '0'); render(); },
    'bot-start': function () {
      var me = (ui.name || '').trim() || 'Tu';
      ui.bot = K.startBots([me].concat(BOT_NAMES.slice(0, ui.botN)), ui.botLv, ui.exp);
      ui.hideResultKey = null; saveBot(); S.effetto('mescola');
      go('#computer');
    },
    'bot-resume': function () { go('#computer'); },
    'local-start': function () {
      readNames();
      var names = ui.localNames.map(function (nm, i) { return (nm || '').trim() || 'Giocatore ' + (i + 1); });
      ui.local = K.startLocal(names, ui.exp); ui.hideResultKey = null; ui.handOpen = -1; ui.neighBy = -1; saveLocal(); S.effetto('mescola'); render();
    },
    'local-reset': function () { ui.local = null; ui.handOpen = -1; ui.neighBy = -1; saveLocal(); ui.hideResultKey = null; if (ui.route === 'local') render(); else go('#locale'); }
  };

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    if (el.dataset.self && ev.target !== el) return;
    var fn = actions[el.dataset.act];
    if (!fn) return;
    if (el.type !== 'checkbox') ev.preventDefault();
    fn(el, ev);
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'nm') { ui.name = t.value; LS.set('sm-name', t.value); }
    else if (/^ln-\d+$/.test(t.id)) { ui.localNames[+t.id.slice(3)] = t.value; LS.set('sm-lnames', JSON.stringify(ui.localNames)); }
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && ui.sheet) { ui.sheet = null; render(); } });

  /* ---------- avvio ---------- */
  ui.local = loadLocal();
  ui.bot = loadBot();
  if (WIDE_MQ) {
    var onWide = function () { render(); };
    if (WIDE_MQ.addEventListener) WIDE_MQ.addEventListener('change', onWide); else if (WIDE_MQ.addListener) WIDE_MQ.addListener(onWide);
  }
  route();
  if (net) net.avvia(); else { ui.online = 'off'; render(); }
})();
</script>
</body>
</html>
