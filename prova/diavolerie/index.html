<!DOCTYPE html>
<html lang="it">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diavolerie</title>
<meta name="description" content="Gioco di carte e dadi da 2 a 5 giocatori: raccogli anime, compra amici nel Quartiere e spegnili per evocare tre demoni.">
<meta name="theme-color" content="#131833">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 3.2c-4 0-7 3.1-7 7.2v9.4l2.3-1.6 2.4 1.6 2.3-1.6 2.3 1.6 2.4-1.6 2.3 1.6v-9.4c0-4.1-3-7.2-7-7.2z' fill='%23f6eedd'/%3E%3Ccircle cx='9.4' cy='10.4' r='1.4' fill='%23131833'/%3E%3Ccircle cx='14.6' cy='10.4' r='1.4' fill='%23131833'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Rozha+One&display=swap">
<script src="../lib/ambiente.js"></script>
<script src="../lib/temi.js"></script>
<link rel="stylesheet" href="../lib/temi.css">
<style>
:root {
  /* Diavolerie: la notte indaco della sala giochi con carte da caramella: rosa per i dolci, verde acido per le pesti,
     azzurro per gli altri bambini, ambra per gli animali, brace per i demoni. */
  /* Layout: una colonna (max 560px): avversari, dadi e cronaca, il Quartiere da comprare, la tua zona e le mosse in basso. */
  --table: #131833;
  --panel: #1b2246;
  --raise: #283161;
  --line: #3b4784;
  --text: #f6eedd;
  --muted: #b3b5d4;
  --saffron: #f5aa3e;
  --on-saffron: #2a1903;
  --crimson: #e2414f;
  --bad: #ff9f8a;
  --good: #7ad7a2;
  --font-display: "Rozha One", Georgia, "Times New Roman", serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--table);
  background-image:
    radial-gradient(circle, rgba(245, 170, 62, .09) 1.6px, transparent 2.2px),
    radial-gradient(circle, rgba(255, 255, 255, .045) 1px, transparent 1.6px);
  background-size: 24px 24px, 24px 24px;
  background-position: 0 0, 12px 12px;
  color: var(--text);
  font: 16px/1.4 var(--font-body);
  -webkit-text-size-adjust: 100%;
}
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#app { max-width: 560px; margin: 0 auto; padding: 0 16px; min-height: 100%; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.center { text-align: center; }
.err { color: var(--bad); }

/* ---------- carte ---------- */
.dc {
  --w: 64px;
  --ring: #fff;
  position: relative; flex: none; width: var(--w); aspect-ratio: 1; margin: 0; padding: 0; border: 0; overflow: hidden;
  border-radius: 50%; display: grid; place-items: center; color: #2a1903;
  box-shadow: inset 0 0 0 calc(var(--w) * .06) var(--ring), inset 0 0 0 calc(var(--w) * .075) rgba(255, 255, 255, .55), 0 2px 0 rgba(0, 0, 0, .35), 0 6px 14px rgba(0, 0, 0, .3);
  font-family: var(--font-display); -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  transition: transform .15s ease, box-shadow .15s ease;
}
.dc::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(155deg, rgba(255, 255, 255, .5) 0%, rgba(255, 255, 255, 0) 34%); pointer-events: none; }
.dc::before { content: ""; position: absolute; inset: calc(var(--w) * .13); border-radius: 50%; border: max(1px, calc(var(--w) * .014)) dashed rgba(27, 34, 70, .28); pointer-events: none; }
.dc.demon::before, .dc.candle::before, .dc.back::before { border-color: rgba(255, 233, 168, .4); }
.dc.sweet { --ring: #ff5fa2; background: radial-gradient(circle at 50% 46%, rgba(255, 255, 255, .8), transparent 42%), linear-gradient(165deg, #ffe2f0 0%, #ff8fc0 100%); }
.dc.rotten { --ring: #49a52a; background: radial-gradient(circle at 50% 46%, rgba(255, 255, 230, .7), transparent 42%), linear-gradient(165deg, #ecffa8 0%, #55b134 100%); }
.dc.kid { --ring: #3d8fd6; background: radial-gradient(circle at 50% 46%, rgba(255, 255, 255, .8), transparent 42%), linear-gradient(165deg, #dcf3ff 0%, #5fb0ec 100%); }
.dc.animal { --ring: #df7a1e; background: radial-gradient(circle at 50% 46%, rgba(255, 255, 240, .8), transparent 42%), linear-gradient(165deg, #fff1c8 0%, #f0952f 100%); }
.dc.demon { --ring: #ffcf6e; color: #fff; background: radial-gradient(circle at 50% 46%, #ffb15c 0%, #ff5a3a 18%, #c4173a 42%, #4a0a1c 72%, #1e0510 100%);
  box-shadow: inset 0 0 0 calc(var(--w) * .06) var(--ring), 0 2px 0 rgba(0, 0, 0, .35), 0 0 calc(var(--w) * .2) rgba(255, 90, 58, .45); }
.dc.candle { --ring: #b98aff; color: #fff; background: radial-gradient(circle at 50% 30%, #fff6cf 0%, #f5aa3e 14%, #8a46c4 46%, #2b1747 88%); }
.dc.back { --ring: #ffcf6e; background: radial-gradient(circle at 50% 50%, #ffcf6e 0 9%, #c4173a 10% 17%, transparent 18%), repeating-conic-gradient(from 0deg, #3a1030 0 15deg, #241035 15deg 30deg);
  box-shadow: inset 0 0 0 calc(var(--w) * .06) var(--ring), 0 2px 0 rgba(0, 0, 0, .35), 0 6px 14px rgba(0, 0, 0, .3); }
.dc .nb { position: absolute; z-index: 1; right: calc(var(--w) * .08); bottom: calc(var(--w) * .08); min-width: calc(var(--w) * .3); height: calc(var(--w) * .3);
  padding: 0 calc(var(--w) * .05); border-radius: 999px; background: #fff; color: #1b2246; display: grid; place-items: center;
  font: calc(var(--w) * .2)/1 var(--font-display); box-shadow: 0 0 0 calc(var(--w) * .025) #1b2246; white-space: nowrap; }
.dc .nb.inf { font: 700 calc(var(--w) * .22)/1 var(--font-body); }
.dc.demon .nb { background: #1e0510; color: #ffcf6e; box-shadow: 0 0 0 calc(var(--w) * .025) #ffcf6e; }
.dc.candle .nb { background: #2b1747; color: #ffe9a8; box-shadow: 0 0 0 calc(var(--w) * .025) #ffe9a8; font-size: calc(var(--w) * .17); right: 50%; transform: translateX(50%); bottom: calc(var(--w) * .07); }
.dc .ty { position: absolute; z-index: 1; left: calc(var(--w) * .12); bottom: calc(var(--w) * .14); width: calc(var(--w) * .2); height: calc(var(--w) * .2); color: rgba(27, 34, 70, .7); }
.dc.demon .ty, .dc.candle .ty { color: rgba(255, 233, 168, .85); }
.dc .art { position: relative; font: calc(var(--w) * .46)/1 var(--emoji); margin-top: calc(var(--w) * -.04); filter: drop-shadow(0 calc(var(--w) * .03) 0 rgba(0, 0, 0, .28)); }
.dc .pr { position: absolute; right: -.42em; bottom: -.12em; font-size: .46em; }
.dc .arc { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; overflow: visible; }
.dc .arc text { font-family: var(--font-display); fill: #fff6cf; stroke: #1b2246; stroke-width: 2.6px; paint-order: stroke; letter-spacing: .3px; }
.dc.big .art { margin-top: calc(var(--w) * .1); }
.dc.tiny .ty, .dc.tiny .pr { display: none; }
.dc.tiny .art { margin-top: calc(var(--w) * -.12); font-size: calc(var(--w) * .5); }
.dc.tiny::before { display: none; }
.dc.tiny .nb { right: calc(var(--w) * .02); bottom: calc(var(--w) * .02); min-width: calc(var(--w) * .44); height: calc(var(--w) * .44); font-size: calc(var(--w) * .3); padding: 0 calc(var(--w) * .06); }
.dc.tiny.candle .art { display: none; }
.dc.tiny.candle .nb { right: 50%; bottom: 50%; transform: translate(50%, 50%); min-width: 0; height: auto; padding: 0; background: none; box-shadow: none;
  color: #ffe9a8; font-size: calc(var(--w) * .3); letter-spacing: -.5px; text-shadow: 0 1px 0 #2b1747; }
.dc.tiny.candle .nb.long { font-size: calc(var(--w) * .23); }
button.dc { cursor: pointer; }
button.dc:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
button.dc[aria-pressed="true"] { transform: translateY(-6px); box-shadow: 0 0 0 3px var(--saffron), 0 10px 18px rgba(0, 0, 0, .45); }
button.dc:disabled { cursor: default; filter: saturate(.5) brightness(.65); }
.dc.lit { animation: lit 1s ease-in-out 3; }
@keyframes lit { 50% { transform: translateY(-4px) scale(1.06); box-shadow: 0 0 0 3px var(--saffron), 0 0 22px rgba(245, 170, 62, .9); } }
@keyframes ember { from { box-shadow: inset 0 0 0 calc(var(--w) * .035) rgba(255, 207, 110, .75), 0 2px 0 rgba(0, 0, 0, .35), 0 0 calc(var(--w) * .12) rgba(255, 90, 58, .35); }
  to { box-shadow: inset 0 0 0 calc(var(--w) * .035) rgba(255, 207, 110, .9), 0 2px 0 rgba(0, 0, 0, .35), 0 0 calc(var(--w) * .3) rgba(255, 120, 58, .7); } }
.dc.demon:not(.tiny) { animation: ember 1.8s ease-in-out infinite alternate; }
.stack { position: relative; display: inline-flex; }
.stack .cnt { position: absolute; z-index: 2; right: -5px; bottom: -5px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--saffron); color: var(--on-saffron); font: 700 12px/20px var(--font-body); text-align: center; box-shadow: 0 0 0 2px var(--panel); }
.cards { display: flex; flex-wrap: wrap; gap: 8px 7px; }

/* ---------- lobby ---------- */
.hubnav { padding-top: 6px; display: flex; justify-content: space-between; align-items: center; }
.hubnav a { text-decoration: none; display: inline-block; }
.brand { text-align: center; padding: 14px 0 8px; }
.fan { display: flex; justify-content: center; align-items: flex-start; height: 96px; margin-bottom: 4px; }
.fan .dc { --w: 70px; margin: 0 -9px; transform: translateY(var(--y)) rotate(var(--r)); transform-origin: 50% 150%; }
.brand h1 { font: 50px/1 var(--font-display); margin: 4px 0 0; }
.brand h1 span { color: var(--crimson); }
.brand .tag { color: var(--muted); margin: 8px auto 0; max-width: 38ch; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 14px 0 0; display: grid; gap: 10px; }
.h2 { font: 22px/1.15 var(--font-display); margin: 0; }
.lab { font-size: 14px; color: var(--muted); }
.field { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--table); color: var(--text); font: 17px/1.2 var(--font-body); }
.field:focus-visible { outline: 3px solid var(--saffron); outline-offset: 1px; }
.field.share { font-size: 14px; color: var(--muted); }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.net { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.net i, .netdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.net.up i, .netdot.up { background: var(--good); box-shadow: 0 0 0 3px rgba(122, 215, 162, .18); }
.net.down i, .netdot.down, .net.off i, .netdot.off { background: var(--bad); }
.netdot { margin-left: 8px; vertical-align: 3px; }
.games { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.gitem { display: flex; align-items: stretch; gap: 6px; }
.gopen { flex: 1; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; text-align: left; padding: 11px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--raise); cursor: pointer; }
.gnames { font-weight: 700; }
.gstate { grid-column: 1; font-size: 14px; color: var(--muted); }
.gcta { grid-column: 2; grid-row: 1 / span 2; font-weight: 700; font-size: 14px; padding: 7px 11px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
.gitem.hot .gopen { border-color: var(--saffron); }
.gitem.hot .gstate { color: var(--saffron); }
.gitem.hot .gcta { background: var(--saffron); color: var(--on-saffron); border-color: var(--saffron); }
.icon-btn { width: 44px; flex: none; display: grid; place-items: center; border-radius: 12px; border: 1.5px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.icon-btn svg { width: 20px; height: 20px; }
.howto ol { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.howto li::marker { color: var(--saffron); font-weight: 700; }
.note { text-align: center; font-size: 13px; color: var(--muted); max-width: 44ch; margin: 18px auto 0; line-height: 1.45; }
.foot { text-align: center; margin: 14px 0 28px; }
.seated { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.seated li { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; background: var(--raise); }
.seated .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--table); font-weight: 700; font-size: 13px; }
.seated .tag { margin-left: auto; font-size: 13px; color: var(--muted); }
.names { display: grid; gap: 8px; }
.names .row { display: flex; gap: 6px; }
.names .row .field { flex: 1; }

/* ---------- pulsanti ---------- */
.btn { appearance: none; border: 1.5px solid var(--line); background: var(--raise); color: var(--text); border-radius: 12px; padding: 12px 14px; font: 700 15px/1.15 var(--font-body); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; touch-action: manipulation; }
.btn.primary { background: var(--saffron); border-color: var(--saffron); color: var(--on-saffron); }
.btn.hell { background: linear-gradient(160deg, #ff5a3a, #c4173a); border-color: #ff7a5a; color: #fff; }
.btn.wide { width: 100%; }
.btn.sm { min-height: 38px; padding: 7px 12px; font-size: 14px; }
.btn:disabled { opacity: .42; cursor: default; }
.btn:focus-visible, .linkbtn:focus-visible, .gopen:focus-visible, .icon-btn:focus-visible, .opt:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.linkbtn { background: none; border: 0; padding: 8px 4px; color: var(--muted); font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: none; }
.linkbtn.accent { color: var(--saffron); }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 8px 12px; font-weight: 700; font-size: 15px; color: var(--muted); cursor: pointer; min-width: 44px; }
.seg button[aria-pressed="true"] { background: var(--saffron); color: var(--on-saffron); }
.seg button:focus-visible { outline: 3px solid #fff; outline-offset: -3px; }
.botb { font: 14px/1 var(--emoji); }
.thinking { display: inline-block; animation: think 1s ease-in-out infinite; }
@keyframes think { 50% { opacity: .35; } }
.btnrow .btn { flex: 1; }
.dicon { font: 20px/1 var(--emoji); }

/* ---------- tavolo ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 4px; padding: 6px 0 2px; }
.topbar .round { font: 17px/1 var(--font-display); white-space: nowrap; }
.topbar .right { display: flex; align-items: center; gap: 0; }
.banner { margin: 8px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--raise); border: 1px solid var(--line); font-size: 14px; display: grid; gap: 8px; }
.opps { display: grid; gap: 8px; margin-top: 8px; grid-template-columns: 1fr 1fr; }
.opps.one { grid-template-columns: 1fr; }
.opp { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px 10px; min-width: 0; display: grid; gap: 7px; align-content: start; }
.opp.turn { border-color: var(--saffron); box-shadow: 0 0 0 1px var(--saffron); }
.opp.ask { border-color: var(--crimson); box-shadow: 0 0 0 1px var(--crimson); }
.opp .hd { display: flex; align-items: center; gap: 6px; min-width: 0; }
.opp .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opp .hd .souls { margin-left: auto; }
.stats { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.stats b { color: var(--text); }
.souls { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); white-space: nowrap; }
.souls svg { width: 18px; height: 18px; color: #e9f3ff; filter: drop-shadow(0 0 4px rgba(245, 170, 62, .7)); }
.souls.bump { animation: bump .5s ease; }
@keyframes bump { 40% { transform: scale(1.35); color: var(--saffron); } }
.dm { display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
.dm .e { font: 15px/1 var(--emoji); }
.status { font: 26px/1.1 var(--font-display); text-align: center; margin: 12px 0 2px; }
.status.is-turn { color: var(--saffron); }
.status.is-ask { color: #ff8a8a; }
.altar { margin: 10px 0 0; padding: 12px 12px 10px; border-radius: 18px; background: radial-gradient(ellipse at 50% 20%, #3a2350, #1b2246 70%); border: 1px solid var(--line); display: grid; gap: 8px; justify-items: center; }
.dicerow { display: flex; align-items: center; gap: 12px; }
.die { width: 50px; height: 50px; border-radius: 12px; background: linear-gradient(160deg, #fff, #efe2c8); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .15), 0 4px 10px rgba(0, 0, 0, .35);
  display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 7px; }
.die i { width: 9px; height: 9px; border-radius: 50%; background: #c4173a; place-self: center; visibility: hidden; }
.die i.on { visibility: visible; }
.die.ghost { background: rgba(255, 255, 255, .08); box-shadow: inset 0 0 0 1.5px var(--line); }
.die.roll { animation: tumble .7s cubic-bezier(.2, .8, .2, 1) both; }
.die.roll + .die.roll { animation-delay: .08s; }
@keyframes tumble { 0% { transform: translate(-46px, -34px) rotate(-260deg) scale(.5); opacity: 0; } 65% { transform: translate(3px, 3px) rotate(14deg) scale(1.04); opacity: 1; } 100% { transform: none; } }
.sum { font: 38px/1 var(--font-display); color: var(--saffron); min-width: 44px; text-align: center; }
.sum.roll { animation: pop .4s .55s both; }
.cron { list-style: none; margin: 0; padding: 0; width: 100%; display: grid; gap: 4px; font-size: 14px; }
.cron li { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 10px; background: rgba(255, 255, 255, .05); }
.cron li.new { animation: pop .35s both; animation-delay: var(--d, 0s); }
.cron .e { font: 17px/1 var(--emoji); flex: none; width: 22px; text-align: center; }
.cron .plus { margin-left: auto; font-weight: 700; color: var(--good); white-space: nowrap; }
.cron .minus { margin-left: auto; font-weight: 700; color: var(--bad); white-space: nowrap; }
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.96); } to { opacity: 1; transform: none; } }
.altar .meta { font-size: 13px; color: var(--muted); margin: 0; }
.sec { margin-top: 14px; }
.sechd { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.sechd h2 { font: 20px/1.1 var(--font-display); margin: 0; white-space: nowrap; }
.sechd .muted { font-size: 13px; }
.block { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.slot { display: grid; justify-items: center; gap: 4px; min-width: 0; }

.slot .lb { font-size: 11.5px; line-height: 1.2; text-align: center; font-weight: 700; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.slot .fx { font-size: 11px; line-height: 1.2; color: var(--muted); text-align: center; }
.slot .empty { width: 100%; max-width: 70px; aspect-ratio: 1; border-radius: 50%; border: 1.5px dashed var(--line); }
.mine { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px 12px; margin-top: 14px; display: grid; gap: 10px; }
.mine.turn { border-color: var(--saffron); }
.mine .hd { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.mine .nm { font: 20px/1 var(--font-display); }
.mine .souls { font-size: 22px; margin-left: auto; }
.mine .souls svg { width: 26px; height: 26px; }
.zone { display: grid; gap: 6px; }
.zone h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.zone .cards .dc { --w: 46px; }
.zone .cards.demons .dc { --w: 58px; }
.hidehand { display: flex; gap: 8px; align-items: center; }
.actions { position: sticky; bottom: 0; z-index: 2; margin: 14px -16px 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(19, 24, 51, .96); border-top: 1px solid var(--line); display: grid; gap: 8px; margin-top: auto; max-height: 62vh; overflow: auto; }
.spacer { flex: 1; min-height: 14px; }
.hint { margin: 0; font-size: 15px; color: var(--muted); }
.hint b { color: var(--text); }
.opts { display: flex; flex-wrap: wrap; gap: 10px 8px; }
.opt { display: grid; justify-items: center; gap: 3px; background: none; border: 0; padding: 0; cursor: pointer; max-width: 76px; }
.opt .dc { --w: 54px; }
.opt .ow { font-size: 11.5px; color: var(--muted); text-align: center; line-height: 1.15; }
.opt[aria-pressed="true"] .dc { transform: translateY(-5px); box-shadow: 0 0 0 3px var(--saffron), 0 10px 18px rgba(0, 0, 0, .45); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { border: 1.5px solid var(--line); background: var(--raise); border-radius: 999px; padding: 8px 14px; min-height: 42px; font-weight: 700; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip-btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

/* ---------- fogli ---------- */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(8, 10, 24, .72); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 90%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 20px 20px 0 0; padding: 20px 18px calc(22px + env(safe-area-inset-bottom)); display: grid; gap: 12px; }
.sheet h2 { font: 28px/1.1 var(--font-display); margin: 0; }
.sheet h3 { font-size: 15px; margin: 6px 0 0; color: var(--saffron); text-transform: uppercase; letter-spacing: .07em; }
.sheet p, .sheet ul { margin: 0; }
.sheet ul { padding-left: 20px; display: grid; gap: 6px; }
.eyebrow { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.detail { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.detail .dc { --w: 124px; }
.detail .kind { font-size: 13px; color: var(--muted); }
.detail .txt { font-size: 17px; margin-top: 6px; }
.log { list-style: none; padding: 0; margin: 0; }
.log li { padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.log li.sep { color: var(--saffron); font-weight: 700; }
.catalog { display: grid; gap: 10px; }
.catalog .row { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
.catalog .dc { --w: 44px; }
.catalog .t { font-size: 14px; }
.catalog .t b { display: block; }
.catalog .t span { color: var(--muted); }
table.score { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.score th, table.score td { padding: 7px 6px; text-align: right; border-bottom: 1px solid var(--line); }
table.score th:first-child, table.score td:first-child { text-align: left; }
table.score thead th { color: var(--muted); font-size: 13px; }
table.score tr.win td { color: var(--saffron); font-weight: 700; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
.confetti i { position: absolute; top: -40px; font: 26px/1 var(--emoji); animation: fall var(--t) linear var(--d) both; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

@media (prefers-reduced-motion: reduce) { .dc, .dc.lit, .dc.demon, .die.roll, .sum.roll, .cron li.new, .souls.bump, .confetti i { animation: none !important; transition: none; } }
@media (max-width: 400px) { .topbar .bk { display: none; } }
@media (max-width: 370px) { .opp { padding: 7px 8px 9px; } .stats { font-size: 12px; gap: 8px; } }

/* ---------- computer e schermi larghi: lobby e tavolo su due colonne, fogli al centro ---------- */
@media (min-width: 1000px) {
  #app.wide { max-width: 1240px; padding: 0 28px; }
  #app.wide > .hubnav { width: 100%; max-width: 1040px; margin: 0 auto; }
  .desk { display: grid; grid-template-columns: minmax(0, 1fr) minmax(380px, 440px); gap: 0 28px; align-items: start; }
  .desk > div { min-width: 0; }
  .desk .col-r { position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow: auto; padding: 0 4px 12px; margin: 0 -4px; scrollbar-width: thin; }
  .desk .col-r > :first-child { margin-top: 8px; }
  .desk .actions { position: static; margin: 12px 0 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); max-height: none; overflow: visible; }
  .desk.lobby { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); width: 100%; max-width: 1040px; margin: 0 auto 28px; gap: 0 24px; }
  .desk.lobby .col-r { position: static; max-height: none; overflow: visible; padding: 0; margin: 0; }
  .desk.lobby .col-r > .panel:first-child { margin-top: 14px; }
  .desk.lobby .note { margin-top: 16px; }
}
@media (min-width: 700px) and (min-height: 520px) {
  .overlay { align-items: center; padding: 24px; }
  .sheet { border-radius: 20px; border-bottom: 1px solid var(--line); max-height: 86vh; padding-bottom: 22px; }
}
@media (hover: hover) and (pointer: fine) {
  .btn:not(:disabled):hover, .chip-btn:hover, .gopen:hover { filter: brightness(1.12); }
  .seg button:not([aria-pressed="true"]):hover { color: var(--text); }
  .linkbtn:hover { color: var(--text); }
}
@media (min-width: 1000px) {
  .desk .opps { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .desk .zone .cards .dc { --w: 54px; }
  .desk .zone .cards.demons .dc { --w: 66px; }
  .desk .slot .lb { font-size: 13px; }
  .desk .slot .fx { font-size: 12px; }
}

<svg class="defs" aria-hidden="true" focusable="false">
  <symbol id="i-soul" viewBox="0 0 24 24"><path d="M12 3.2c-4 0-7 3.1-7 7.2v9.4l2.3-1.6 2.4 1.6 2.3-1.6 2.3 1.6 2.4-1.6 2.3 1.6v-9.4c0-4.1-3-7.2-7-7.2z" fill="currentColor"/><circle cx="9.4" cy="10.4" r="1.4" style="fill: var(--soul-eyes, #131833)"/><circle cx="14.6" cy="10.4" r="1.4" style="fill: var(--soul-eyes, #131833)"/></symbol>
  <symbol id="i-girl" viewBox="0 0 24 24"><circle cx="12" cy="6.5" r="3.6" fill="currentColor"/><path d="M12 10.5 6.5 20.5h11z" fill="currentColor"/></symbol>
  <symbol id="i-boy" viewBox="0 0 24 24"><circle cx="12" cy="6.5" r="3.6" fill="currentColor"/><rect x="7.6" y="11" width="8.8" height="9.5" rx="2.2" fill="currentColor"/></symbol>
  <symbol id="i-paw" viewBox="0 0 24 24"><ellipse cx="12" cy="16" rx="5" ry="4.2" fill="currentColor"/><circle cx="6" cy="10.5" r="2.2" fill="currentColor"/><circle cx="9.8" cy="6.6" r="2.3" fill="currentColor"/><circle cx="14.2" cy="6.6" r="2.3" fill="currentColor"/><circle cx="18" cy="10.5" r="2.2" fill="currentColor"/></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12.3 2c1 3.8 5.7 5.7 5.7 11.4a6 6 0 0 1-12 0c0-2.8 1.3-4.7 2.8-5.9 0 1.9.6 3.4 1.9 4.1-.8-4 .2-7.2 1.6-9.6z" fill="currentColor"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 11v5.5M14 11v5.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>
<div id="app"></div>
<div id="layer"></div>
<script src="../lib/profilo.js"></script>
<script src="../lib/conti.js"></script>
<script src="motore.js"></script>
<script src="bot.js"></script>
<script src="temi.js"></script>
<script src="../lib/mqtt.min.js"></script>
<script src="../lib/stanze.js"></script>
<script src="../lib/suoni.js"></script>
<script>
(function () {
  'use strict';
  var K = window.Diavolerie;
  var S = window.Suoni || { tema: function () {}, effetto: function () {}, sequenza: function () {}, bottone: function () { return ''; } };
  var $app = document.getElementById('app');
  var $layer = document.getElementById('layer');

  // Su schermi larghi (computer, tablet in orizzontale) lobby e tavolo si dividono in due colonne.
  var WIDE_MQ = window.matchMedia ? window.matchMedia('(min-width: 1000px)') : null;
  function isWide() { return !!(WIDE_MQ && WIDE_MQ.matches); }
  var LS = {
    get: function (k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* niente memoria */ } },
    del: function (k) { try { window.localStorage.removeItem(k); } catch (e) { /* idem */ } }
  };
  function loadJSON(k, d) { try { var v = JSON.parse(LS.get(k) || 'null'); return v == null ? d : v; } catch (e) { return d; } }
  function rnd36(n) { var o = '', a = 'abcdefghijklmnopqrstuvwxyz0123456789'; for (var i = 0; i < n; i++) o += a[K.randInt(36)]; return o; }
  function range(n) { var a = []; for (var i = 0; i < n; i++) a.push(i); return a; }

  var ui = {
    route: 'lobby', gameId: null, online: 'connecting',
    game: null, gameMissing: false, missTimer: null,
    local: null, sheet: null, sheetId: null, detail: null, hideResultKey: null,
    name: LS.get('dv-name') || '',
    localNames: (function () { var a = loadJSON('dv-lnames', null); return Array.isArray(a) && a.length >= 2 ? a.slice(0, 5) : ['', '', '']; })(),
    sel: [], selKey: null, summonD: null, handOpen: -1,
    bot: null, botTimer: null,
    botN: Math.max(1, Math.min(4, +LS.get('dv-botn') || 2)),
    botLv: (function () { var v = LS.get('dv-botlv'); return v === 'facile' || v === 'difficile' ? v : 'medio'; })(),
    botFast: LS.get('dv-botfast') === '1',
    error: '', copied: false, seenKey: null, seenLog: 0, pendingJoin: null
  };
  ui.device = LS.get('dv-device');
  if (!ui.device) { ui.device = 'd' + rnd36(14); LS.set('dv-device', ui.device); }
  ui.myKey = 'd:' + ui.device;
  S.tema('diavolerie');

  /* ---------- temi ---------- */
  // Il tema lo sceglie lib/temi.js, uguale per tutti i giochi (pulsantino Temi.bottone()). Qui, nei temi coi disegni,
  // le carte le disegna temi.js al posto delle emoji; cambiato il tema, si ridisegna.
  var T = window.DiavolerieTemi || { arte: function () { return ''; }, disegni: function () { return false; } };
  var TM = window.Temi || { attuale: function () { return 'notte'; }, bottone: function () { return ''; } };
  // il filtro del gesso e i retini del fumetto: una volta sola, in un <svg> nascosto
  if (T.defs && !document.getElementById('dv-defs')) {
    var defsBox = document.createElement('div');
    defsBox.innerHTML = '<svg id="dv-defs" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>' + T.defs() + '</defs></svg>';
    document.body.appendChild(defsBox.firstChild);
  }
  function tema() { return TM.attuale(); }
  function disegnate() { return T.disegni(tema()); }
  // Il disegno piccolo di una carta dentro il testo (cronaca, risultati): l'emoji, o il disegno del tema.
  function emo(I) {
    if (!I) return '';
    if (disegnate()) return '<span class="mini">' + T.arte(I, tema()) + '</span>';
    return I.cat === 'candle' ? '🕯️' : I.art;
  }
  function temaBtn() { return TM.bottone(); }
  // nel foglio dei temi la figurina è il diavoletto Cucù, disegnato nello stile di ogni tema
  TM.anteprima = function (id) { return T.disegni(id) ? T.arte(K.info('cucu'), id) : ''; };
  document.addEventListener('temi:cambio', function () { render(); });

  function validState(s) {
    return !!(s && s.app === 'diavolerie' && typeof s.v === 'number' && Array.isArray(s.seats) && s.seats.length >= 1 &&
      s.seats.length <= 5 && Array.isArray(s.souls) && Array.isArray(s.block) && s.cards && typeof s.cards === 'object');
  }
  var net = window.Stanze ? window.Stanze({
    topic: 'diavolerie/v1', memoria: 'dv-', valida: validState,
    quandoArriva: function (id, prev, data) { onRoom(id, prev, data); },
    quandoCambiaRete: function (x) { ui.online = x; render(); }
  }) : null;

  /* ---------- testo ---------- */
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function nameOf(s, p) { return (s.seats[p] && s.seats[p].name) || ('Giocatore ' + (p + 1)); }
  function hn(s, p) { return esc(nameOf(s, p)); }
  function plural(n, a, b) { return n === 1 ? a : b; }
  function andList(a) { return a.length > 1 ? a.slice(0, -1).join(', ') + ' e ' + a[a.length - 1] : (a[0] || ''); }
  function soulsTxt(n) { return n + ' ' + plural(n, 'anima', 'anime'); }
  function cname(uid) { var I = K.info(uid); return I ? esc(I.name) : ''; }
  function cemo(uid) { return emo(K.info(uid)); }
  var KIND = { G: 'Bambina', B: 'Bambino', A: 'Animale' };
  function kindLine(I) {
    if (I.cat === 'demon') return I.n ? 'Demone · si attiva col ' + I.n + ', solo quando tiri tu' : 'Demone · potere sempre attivo';
    if (I.cat === 'candle') return 'Candela · si accende col ' + I.nums.join(', ') + ', chiunque tiri';
    var t = I.k === 'A' ? 'Animale' : KIND[I.k] + (I.t === 'S' ? ' dolce' : I.t === 'R' ? ' peste' : '');
    return t + ' · si attiva col ' + I.n + ', chiunque tiri · ' + I.x + ' ' + plural(I.x, 'copia', 'copie') + ' nel mazzo';
  }
  // Effetto in poche parole, sotto le carte del Quartiere.
  var REQ_SHORT = { kid: ' con un bimbo', noKid: ' senza bimbi', animals3: ' con 3 animali', pair: ' con 2 bimbi', rotten3: ' con 3 pesti' };
  function shortFx(I) {
    var r = I.req ? REQ_SHORT[I.req] || ' se…' : '';
    switch (I.fx) {
      case 'collect': return '+' + I.v + r;
      case 'perAnimal': return '+' + I.v + ' per animale';
      case 'perSweet': return '+1 per dolce';
      case 'perRotten': return '+1 per peste';
      case 'bat': return '+1 +1/demone';
      case 'pietro': return '+1 o +3';
      case 'corvo': return '+1 o +2';
      case 'share': return '+2, agli altri +1';
      case 'steal': return 'ruba ' + I.v + r;
      case 'gainBoy': return 'bimbo gratis';
      case 'purgeSweet': return 'via i dolci!';
      case 'cat': return 'pesca animale';
      case 'alice': return 'pesca dolci';
      case 'tommy': return 'pesca bambina';
      case 'skunk': return 'tutti scartano!';
      case 'irwin': return 'attiva animali';
      case 'leo': return 'attiva dolci';
      case 'destiny': return 'attiva un dolce';
      case 'gainBlock': return 'carta gratis';
      case 'annie': return 'ruba bambino';
      case 'stealKid': return 'ruba bambino';
      case 'stealAnimal': return 'ruba animale';
      case 'discardKid': return 'fa scartare';
      case 'sam': return 'animale → +6';
      case 'goat': return 'evoca gratis';
      case 'alligator': return 'fa scartare 2';
      case 'hawk': return 'pesca animali';
      case 'damian': return 'evoca gratis';
      case 'goldfish': return '+5 se lo scarti';
      case 'owl': return 'cambia carte';
    }
    return '';
  }

  /* ---------- carte ---------- */
  function catClass(I) {
    if (I.cat === 'demon') return 'demon';
    if (I.cat === 'candle') return 'candle';
    if (I.k === 'A') return 'animal';
    return I.t === 'S' ? 'sweet' : I.t === 'R' ? 'rotten' : 'kid';
  }
  function kindIcon(I) {
    if (I.cat !== 'block') return I.cat === 'demon' ? '<svg class="ty" aria-hidden="true"><use href="#i-flame"/></svg>' : '';
    var id = I.k === 'A' ? 'i-paw' : I.k === 'G' ? 'i-girl' : 'i-boy';
    return '<svg class="ty" aria-hidden="true"><use href="#' + id + '"/></svg>';
  }
  function badge(I) {
    if (I.cat === 'candle') { var t = I.nums.join('·'); return '<span class="nb' + (t.length > 4 ? ' long' : '') + '">' + t + '</span>'; }
    if (I.cat === 'demon' && !I.n) return '<span class="nb inf">∞</span>';
    return '<span class="nb">' + I.n + '</span>';
  }
  function cardLabel(I) { return I.name + ', ' + kindLine(I).split(' · ').slice(0, 2).join(', '); }
  // opts: {tag, attrs, cls, size ('tiny'|'big'), style}
  function cardHTML(uid, opts) {
    opts = opts || {};
    var I = K.info(uid);
    var art = I.cat === 'candle' ? '🕯️' : I.art, svg = disegnate() ? T.arte(I, tema()) : '';
    var cls = 'dc ' + catClass(I) + (opts.size ? ' ' + opts.size : '') + (opts.cls ? ' ' + opts.cls : '');
    var tag = opts.tag || 'span';
    var a11y = /aria-label=/.test(opts.attrs || '') ? '' : ' aria-label="' + esc(cardLabel(I)) + '"';
    if (tag !== 'button') a11y += ' role="img"';
    return '<' + tag + ' class="' + cls + '"' + (opts.style ? ' style="' + opts.style + '"' : '') + ' ' + (opts.attrs || '') + a11y + '>' +
      badge(I) + kindIcon(I) + (svg ? '<span class="art v" aria-hidden="true">' + svg + '</span>'
        : '<span class="art" aria-hidden="true">' + art + (I.prop ? '<span class="pr">' + I.prop + '</span>' : '') + '</span>') +
      (opts.size === 'big' ? arcName(I.name) : '') + '</' + tag + '>';
  }
  // Il nome scritto ad arco in alto, come sui sottobicchieri.
  function arcName(name) {
    var fs = Math.min(10.5, 118 / Math.max(6, name.length) / 0.62).toFixed(1);
    return '<svg class="arc" viewBox="0 0 100 100" aria-hidden="true"><defs><path id="arc-big" d="M 16 54 A 34 34 0 0 1 84 54"/></defs>' +
      '<text style="font-size:' + fs + 'px"><textPath href="#arc-big" startOffset="50%" text-anchor="middle">' + esc(name.toUpperCase()) + '</textPath></text></svg>';
  }
  function backHTML(w) { return '<span class="dc back" style="--w:' + w + 'px" role="img" aria-label="Demone coperto"></span>'; }
  // Carte di un giocatore raggruppate per tipo, toccabili per leggerle.
  function groupHTML(list, size, lit, style) {
    var groups = [], idx = {};
    list.forEach(function (u) { var t = K.typeOf(u); if (idx[t] == null) { idx[t] = groups.length; groups.push([]); } groups[idx[t]].push(u); });
    return groups.map(function (g) {
      var on = g.some(function (u) { return lit && lit[u]; });
      return '<span class="stack">' + cardHTML(g[0], { tag: 'button', size: size, cls: on ? 'lit' : '', style: style, attrs: 'type="button" data-act="detail" data-uid="' + g[0] + '"' }) +
        (g.length > 1 ? '<span class="cnt" aria-label="' + g.length + ' copie">×' + g.length + '</span>' : '') + '</span>';
    }).join('');
  }
  function soulsHTML(n, bump) {
    return '<span class="souls' + (bump ? ' bump' : '') + '" title="Anime"><svg aria-hidden="true"><use href="#i-soul"/></svg>' + n + '<span class="sr"> ' + plural(n, 'anima', 'anime') + '</span></span>';
  }
  function demonsHTML(s, p) { return '<span class="dm" title="Demoni evocati"><span class="e" aria-hidden="true">😈</span><b>' + s.demons[p].length + '</b>/' + K.WIN_DEMONS + '<span class="sr"> demoni</span></span>'; }

  /* ---------- prospettiva ---------- */
  function cur() { return ui.route === 'local' ? ui.local : ui.route === 'bot' ? ui.bot : ui.game; }
  function persp(s) {
    if (s.mode === 'local') { var a = K.nextActor(s); return { me: a >= 0 ? a : s.turn, seated: true, local: true }; }
    if (s.mode === 'bot') return { me: 0, seated: true, local: false, bot: true };
    var seat = K.seatOf(s, ui.myKey);
    return { me: seat >= 0 ? seat : 0, seated: seat >= 0, local: false };
  }
  function isMe(P, p) { return !P.local && P.seated && p === P.me; }
  function who(s, P, p) { return isMe(P, p) ? 'tu' : hn(s, p); }
  function isMine(s, P) { return P.seated && s.status === 'playing' && K.nextActor(s) === P.me; }
  function canAct(s, P) { return isMine(s, P) && (P.local || P.bot || ui.online === 'up'); }
  function isBot(s, p) { return !!(s.bots && s.bots[p]); }
  function botTag(s, p) { return isBot(s, p) ? ' <span class="botb" title="Computer, livello ' + s.bots[p] + '">🤖</span>' : ''; }
  function handVisible(s, P) { return P.local ? ui.handOpen === P.me : P.seated; }

  /* ---------- cronaca ---------- */
  function lastRollIndex(s) {
    for (var i = s.log.length - 1; i >= 0; i--) if (s.log[i].t === 'roll' || s.log[i].t === 'turn') return i;
    return 0;
  }
  // Una riga di cronaca: {e: emoji, t: testo, d: '+2'/'−1'}. Le carte sono «nome · padrone».
  function line(e, s, P) {
    var src = e.c && K.info(e.c) ? K.info(e.c) : null;
    var by = function (p) { return ' <span class="muted">· ' + (isMe(P, p) ? 'tu' : hn(s, p)) + '</span>'; };
    var card = src ? (src.cat === 'candle' ? 'Candela' : esc(src.name)) : '';
    var ico = src ? emo(src) : '';
    switch (e.t) {
      case 'turn': return { e: '⏳', t: isMe(P, e.s) ? (e.extra ? 'Turno extra: tocca ancora a te' : 'Tocca a te') : (e.extra ? 'Turno extra di ' : 'Turno di ') + hn(s, e.s) };
      case 'roll': return { e: '🎲', t: (isMe(P, e.s) ? 'Hai tirato ' : hn(s, e.s) + ' tira ') + e.a + ' + ' + e.b + ' = <b>' + (e.a + e.b) + '</b>' };
      case 'reroll': return { e: '🔁', t: 'Ritiracifero, nuovo tiro: ' + e.a + ' + ' + e.b + ' = <b>' + (e.a + e.b) + '</b>' };
      case 'souls': {
        var nm = e.c === 'belzedado' ? 'Belzedado (doppio)' : e.c === 'asinodeo' ? 'Asinodeo' : e.c === 'burlone' ? 'Diavolo Burlone' : card;
        return { e: ico || '👻', t: nm + by(e.s), d: '+' + e.n, plus: true };
      }
      case 'steal': return { e: ico || '🫳', t: card + by(e.s) + ' ← ' + (e.from >= 0 ? (isMe(P, e.from) ? 'da te' : 'da ' + hn(s, e.from)) + (e.got < e.n ? ' (+' + (e.n - e.got) + ' riserva)' : '') : 'dalla riserva'), d: '+' + e.n, plus: true };
      case 'gain':
        if (e.how === 'buy') return { e: '🛒', t: (isMe(P, e.s) ? 'Hai comprato ' : hn(s, e.s) + ' compra ') + cname(e.g) + ' ' + cemo(e.g) };
        if (e.how === 'steal') return { e: ico, t: card + by(e.s) + ' → ' + cemo(e.g) + ' ' + cname(e.g) + ' rubata ' + (isMe(P, e.from) ? 'a te' : 'a ' + hn(s, e.from)) };
        return { e: ico, t: card + by(e.s) + ' → ' + cemo(e.g) + ' ' + cname(e.g) + (e.how === 'deck' ? ' dal mazzo' : ' dal Quartiere') };
      case 'discard':
        if (e.c === 'snuff') return { e: '🕯️', t: (isMe(P, e.s) ? 'Hai spento ' : hn(s, e.s) + ' spegne ') + cname(e.g) };
        if (e.by !== e.s) return { e: ico || '🗑️', t: card + by(e.by) + ' ✗ ' + cname(e.g) + ' ' + (isMe(P, e.s) ? 'tua' : 'di ' + hn(s, e.s)), minus: true };
        return { e: ico || '🗑️', t: card + by(e.s) + ' ✗ ' + cname(e.g), minus: true };
      case 'reveal': return { e: ico, t: card + by(e.s) + ': scopre ' + cname(e.g) + ', scartata' };
      case 'skunk': return { e: '🦨', t: 'Puzzola' + by(e.s) + ': tutti scartano le carte del Quartiere (' + e.n + ')', minus: true };
      case 'purge': return { e: '🧪', t: 'Dora' + by(e.s) + ': via i bambini dolci (' + e.n + ')', minus: true };
      case 'idle': return { e: ico || '·', t: card + by(e.s) + ': niente' };
      case 'pass': return { e: ico || '·', t: card + by(e.s) + ': no, grazie' };
      case 'extra': return { e: '🕰️', t: 'Satana a Cucù' + by(e.s) + ': turno extra in arrivo' };
      case 'hawk': return { e: '🦅', t: 'Falco' + by(e.s) + ': ' + e.n + ' ' + plural(e.n, 'animale preso', 'animali presi') };
      case 'replace': return { e: '🦉', t: 'Gufo' + by(e.s) + ': ' + e.n + ' ' + plural(e.n, 'carta cambiata', 'carte cambiate') + ' nel Quartiere' };
      case 'summon': {
        var how = e.how === 'goat' ? ' col Caprone' : e.how === 'egg' ? ': l\'Uovo si è schiuso' : e.how === 'damian' ? ' con Damiano' : '';
        return { e: emo(K.info(e.d)), t: (isMe(P, e.s) ? 'Hai evocato ' : hn(s, e.s) + ' evoca ') + '<b>' + esc(K.info(e.d).name) + '</b>' + how + '!' };
      }
      case 'reshuffle': return { e: '🔄', t: 'Gli scarti tornano nel mazzo' };
      case 'redraw': return { e: '🃏', t: (isMe(P, e.s) ? 'Peschi' : hn(s, e.s) + ' pesca') + ' un nuovo demone in mano' };
      case 'win': return { e: e.c === 'serpente' ? '🐍' : '🏆', t: (e.c === 'serpente' ? 'Il Serpente: ' : '') + (isMe(P, e.s) ? 'hai vinto!' : hn(s, e.s) + ' vince!') };
    }
    return null;
  }
  function lineHTML(l, cls, delay) {
    return '<li class="' + (cls || '') + '"' + (delay != null ? ' style="--d:' + delay.toFixed(2) + 's"' : '') + '><span class="e" aria-hidden="true">' + l.e + '</span><span>' + l.t + '</span>' +
      (l.d ? '<span class="' + (l.plus ? 'plus' : 'minus') + '">' + l.d + '</span>' : '') + '</li>';
  }

  /* ---------- tavolo ---------- */
  function topbarHTML(s, P) {
    var off = P.local || P.bot;
    return '<header class="topbar"><button class="linkbtn" data-act="lobby" aria-label="' + (off ? 'Esci' : 'Torna alle partite') + '">‹<span class="bk"> ' + (off ? 'Esci' : 'Partite') + '</span></button>' +
      '<span class="round">Turno ' + s.turnNo + (off ? '' : netDot()) + '</span>' +
      '<span class="right">' + temaBtn() + S.bottone() + '<button class="linkbtn" data-act="log">Storico</button><button class="linkbtn" data-act="rules">Regole</button></span></header>';
  }
  function bannersHTML(s, P) {
    var h = '';
    if (!P.local && !P.seated && s.status !== 'waiting') {
      h += '<div class="banner"><span>Stai guardando. Sei uno dei giocatori? Riprendi il tuo posto:</span><span class="btnrow">' +
        s.seats.map(function (x, i) { return '<button class="btn sm" data-act="claim" data-seat="' + i + '">' + hn(s, i) + '</button>'; }).join('') + '</span></div>';
    }
    if (!P.local && !P.bot && (ui.online === 'down' || ui.online === 'off')) h += '<div class="banner">Connessione persa: riprovo da solo. Le mosse ripartono appena torna la rete.</div>';
    return h;
  }
  function litMap(s) {
    var m = {};
    if (!s.roll) return m;

    var minePrev = !!prev && seat >= 0 && prev.status === 'playing' && K.nextActor(prev) === seat;
    if (mineNow && !minePrev && prev) { try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) { /* ok */ } }
    if (ui.route === 'game' && ui.gameId === id) {
      var old = ui.game;
      ui.game = data; ui.gameMissing = false;
      if (old && (old.v !== data.v || old.nonce !== data.nonce)) ui.error = '';
      if (ui.sheet === 'summon' && (data.status !== 'playing' || K.nextActor(data) !== seat)) ui.sheet = null;
      render();
    } else if (ui.route === 'lobby') render();
    else updateTitle();
    checkJoin(id, data);
  }
  function checkJoin(id, s) {
    var j = ui.pendingJoin;
    if (!j || j.id !== id) return;
    if (s.status !== 'waiting' || K.seatOf(s, ui.myKey) >= 0 || s.seats.length >= K.MAX_PLAYERS) { ui.pendingJoin = null; return; }
    setTimeout(function () {
      var c = net.carica(id);
      if (ui.pendingJoin !== j || !c || c.status !== 'waiting' || K.seatOf(c, ui.myKey) >= 0) return;
      var r = K.join(c, ui.myKey, j.name);
      if (!r.ok) { ui.pendingJoin = null; return; }
      r.state.nonce = net.nonce();
      if (!net.pubblica(id, r.state)) return;
      net.salva(id, r.state); net.aggiungi(id);
      if (ui.route === 'game' && ui.gameId === id) { ui.game = r.state; render(); }
    }, 250 + Math.floor(Math.random() * 650));
  }
  function writeGame(make, opts) {
    opts = opts || {};
    var id = ui.gameId;
    var curS = id && net ? (net.carica(id) || ui.game) : null;
    if (!curS) return false;
    if (opts.expectV != null && curS.v !== opts.expectV) {
      ui.error = 'Il tavolo era cambiato: ecco la situazione aggiornata.';
      ui.game = curS; render(); return false;
    }
    var r = make(K.clone(curS));
    if (!r.ok) { ui.error = r.error; ui.game = curS; S.effetto('errore'); render(); return false; }
    var next = r.state;
    next.nonce = net.nonce();
    if (!net.pubblica(id, next)) { ui.error = 'Sei offline: la mossa non è partita. Riprova appena torna la connessione.'; render(); return false; }
    net.salva(id, next); net.aggiungi(id);
    ui.game = next; ui.error = ''; ui.sel = [];
    render();
    return true;
  }
  function createGame() {
    if (!net || ui.online !== 'up') return;
    var name = (ui.name || '').trim() || 'Giocatore 1';
    LS.set('dv-name', name);
    var id = rnd36(10);
    var s = K.newGame({ key: ui.myKey, name: name });
    s.nonce = net.nonce();
    net.aggiungi(id); net.salva(id, s); net.guarda(id); net.pubblica(id, s);
    go('#partita-' + id);
  }

  /* ---------- sullo stesso telefono ---------- */
  function loadLocal() { try { var s = JSON.parse(LS.get('dv-local') || 'null'); return s && s.app === 'diavolerie' && s.mode === 'local' && validState(s) ? s : null; } catch (e) { return null; } }
  function saveLocal() { if (ui.local) LS.set('dv-local', JSON.stringify(ui.local)); else LS.del('dv-local'); }

  /* ---------- contro il computer ---------- */
  var BOT_NAMES = ['Belfagor', 'Lilith', 'Astarotte', 'Abaddon'];
  function loadBot() { try { var s = JSON.parse(LS.get('dv-bot') || 'null'); return s && s.mode === 'bot' && validState(s) ? s : null; } catch (e) { return null; } }
  function saveBot() { if (ui.bot) LS.set('dv-bot', JSON.stringify(ui.bot)); else LS.del('dv-bot'); }
  // I bot giocano da soli, con una pausa per far vedere ogni mossa.
  function botLoop() {
    clearTimeout(ui.botTimer);
    var s = ui.bot;
    if (ui.route !== 'bot' || !s || s.status !== 'playing') return;
    var a = K.nextActor(s);
    if (!isBot(s, a) || !window.DiavolerieBot) return;
    var last = s.log[s.log.length - 1], wait;
    if (last && (last.t === 'roll' || last.t === 'reroll' || last.t === 'souls' || last.t === 'steal')) wait = 1400;
    else if (!s.prompt && !s.did.roll) wait = 750;
    else wait = 650;
    if (ui.botFast) wait = Math.round(wait * 0.4);
    ui.botTimer = setTimeout(function () {
      if (ui.route !== 'bot' || ui.bot !== s) return;
      var mv = window.DiavolerieBot.mossa(s, a, s.bots[a]);
      var r = mv ? K.act(s, a, mv) : { ok: false };
      if (!r.ok) { var ms = K.legalMoves(s, a); r = ms.length ? K.act(s, a, ms[ms.length - 1]) : r; }
      if (!r.ok) return;
      ui.bot = r.state; saveBot(); render();
      botLoop();
    }, wait);
  }

  /* ---------- azioni ---------- */
  function play(move) {
    var s = cur(); if (!s) return false;
    var P = persp(s), seat = P.me;
    if (P.bot) {
      var rb = K.act(s, seat, move);
      if (!rb.ok) { ui.error = rb.error; S.effetto('errore'); render(); return false; }
      ui.bot = rb.state; ui.error = ''; ui.sel = [];
      saveBot(); render(); botLoop();
      return true;
    }
    if (P.local) {
      var r = K.act(s, seat, move);
      if (!r.ok) { ui.error = r.error; S.effetto('errore'); render(); return false; }
      var before = K.nextActor(s);
      ui.local = r.state; ui.error = ''; ui.sel = [];
      if (K.nextActor(ui.local) !== before) ui.handOpen = -1;
      saveLocal(); render();
      return true;
    }
    return writeGame(function (c) { return K.act(c, seat, move); }, { expectV: s.v });
  }
  function readNames() {
    ui.localNames = ui.localNames.map(function (n, i) { var el = document.getElementById('ln-' + i); return el ? el.value : n; });
    LS.set('dv-lnames', JSON.stringify(ui.localNames));
  }
  var actions = {
    lobby: function () { go(''); },
    'go-local': function () { go('#locale'); },
    open: function (el) { go('#partita-' + el.dataset.id); },
    'new': createGame,
    'ask-del': function (el) { ui.sheet = 'del'; ui.sheetId = el.dataset.id; render(); },
    del: function () { var id = ui.sheetId; ui.sheet = null; if (net && id) net.togli(id); render(); },
    close: function () { ui.sheet = null; ui.error = ''; render(); },
    rules: function () { ui.sheet = 'rules'; render(); },
    log: function () { ui.sheet = 'log'; render(); },
    detail: function (el) { ui.detail = el.dataset.uid; ui.sheet = 'detail'; S.effetto('click'); render(); },
    'hide-result': function () { ui.hideResultKey = resultKey(cur()); ui.error = ''; render(); },
    'show-result': function () { ui.hideResultKey = null; render(); },
    share: function () {
      var s = ui.game, text = (s ? nameOf(s, s.host) : 'Un amico') + ' ti invita a Diavolerie: apri il link e siediti al tavolo.';
      if (navigator.share) navigator.share({ title: 'Diavolerie', text: text, url: shareUrl(ui.gameId) }).catch(function () { /* annullato */ });
      else actions.copy();
    },
    copy: function () {
      var done = function () { ui.copied = true; render(); setTimeout(function () { ui.copied = false; render(); }, 2200); };
      var fallback = function () { var el = document.getElementById('share-url'); if (el) { el.focus(); el.select(); } };
      try { navigator.clipboard.writeText(shareUrl(ui.gameId)).then(done, fallback); } catch (e) { fallback(); }
    },
    join: function () {
      var name = (ui.name || '').trim() || 'Giocatore';
      LS.set('dv-name', name);
      var key = ui.myKey;
      if (writeGame(function (c) { return K.join(c, key, name); })) ui.pendingJoin = { id: ui.gameId, name: name };
    },
    start: function () { var s = ui.game; if (s && writeGame(function (c) { return K.startGame(c); }, { expectV: s.v })) S.effetto('mescola'); },
    claim: function (el) { var seat = +el.dataset.seat, key = ui.myKey; writeGame(function (c) { return K.addSeatKey(c, seat, key); }); },
    roll: function () { play({ type: 'roll' }); },
    end: function () { play({ type: 'end' }); },
    buy: function (el) { if (play({ type: 'buy', i: +el.dataset.slot })) { ui.sheet = null; render(); } },
    'summon-open': function () { ui.sheet = 'summon'; ui.summonD = null; ui.sel = []; ui.error = ''; render(); },
    'pick-demon': function (el) { ui.summonD = el.dataset.uid; render(); },
    snuff: function (el) {
      var s = cur(), k = K.summonCost(s, persp(s).me), u = el.dataset.uid, i = ui.sel.indexOf(u);
      if (i >= 0) ui.sel.splice(i, 1); else { ui.sel.push(u); if (ui.sel.length > k) ui.sel.shift(); }
      render();
    },
    'summon-go': function () {
      var cards = ui.sel.slice(), d = ui.summonD;
      if (play({ type: 'summon', d: d, cards: cards })) { ui.sheet = null; ui.summonD = null; render(); }
    },
    'hand-open': function () { var s = cur(); if (s) { ui.handOpen = persp(s).me; render(); } },
    'hand-close': function () { ui.handOpen = -1; render(); },
    opt: function (el) {
      var s = cur(); if (!s || !s.prompt) return;
      var u = el.dataset.uid, i = ui.sel.indexOf(u), pr = s.prompt;
      if (pr.kind === 'pick') ui.sel = i >= 0 ? [] : [u];
      else if (i >= 0) ui.sel.splice(i, 1);
      else { ui.sel.push(u); if (ui.sel.length > pr.max) ui.sel.shift(); }
      render();
    },
    answer: function () { play({ type: 'answer', pick: ui.sel.slice() }); },
    decline: function () { play({ type: 'answer', pick: [] }); },
    yes: function (el) { play({ type: 'answer', yes: el.dataset.v === '1' }); },
    target: function (el) { play({ type: 'answer', target: +el.dataset.seat }); },
    rematch: function () {
      if (ui.route === 'bot') { var rb = K.rematch(ui.bot); if (rb.ok) { ui.bot = rb.state; ui.hideResultKey = null; saveBot(); S.effetto('mescola'); render(); botLoop(); } return; }
      if (ui.route === 'local') { var r = K.rematch(ui.local); if (r.ok) { ui.local = r.state; ui.hideResultKey = null; ui.handOpen = -1; saveLocal(); S.effetto('mescola'); render(); } return; }
      var s = ui.game; if (s && writeGame(function (c) { return K.rematch(c); }, { expectV: s.v })) S.effetto('mescola');
    },
    'ln-add': function () { readNames(); if (ui.localNames.length < 5) ui.localNames.push(''); LS.set('dv-lnames', JSON.stringify(ui.localNames)); render(); },
    'ln-del': function (el) { readNames(); ui.localNames.splice(+el.dataset.i, 1); LS.set('dv-lnames', JSON.stringify(ui.localNames)); render(); },
    'bot-n': function (el) { ui.botN = +el.dataset.v; LS.set('dv-botn', String(ui.botN)); render(); },
    'bot-lv': function (el) { ui.botLv = el.dataset.v; LS.set('dv-botlv', ui.botLv); render(); },
    'bot-fast': function (el) { ui.botFast = el.dataset.v === '1'; LS.set('dv-botfast', ui.botFast ? '1' : '0'); render(); },
    'bot-start': function () {
      var me = (ui.name || '').trim() || 'Tu';
      ui.bot = K.startBots([me].concat(BOT_NAMES.slice(0, ui.botN)), ui.botLv);
      ui.hideResultKey = null; saveBot(); S.effetto('mescola');
      go('#computer');
    },
    'bot-resume': function () { go('#computer'); },
    'local-start': function () {
      readNames();
      var names = ui.localNames.map(function (n, i) { return (n || '').trim() || 'Giocatore ' + (i + 1); });
      ui.local = K.startLocal(names); ui.handOpen = -1; ui.hideResultKey = null; saveLocal(); S.effetto('mescola'); render();
    },
    'local-reset': function () { ui.local = null; ui.handOpen = -1; saveLocal(); ui.hideResultKey = null; if (ui.route === 'local') render(); else go('#locale'); }
  };

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    if (el.dataset.self && ev.target !== el) return;
    var fn = actions[el.dataset.act];
    if (fn) { ev.preventDefault(); fn(el, ev); }
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'nm') { ui.name = t.value; LS.set('dv-name', t.value); }
    else if (/^ln-\d+$/.test(t.id)) { ui.localNames[+t.id.slice(3)] = t.value; LS.set('dv-lnames', JSON.stringify(ui.localNames)); }
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && ui.sheet) { ui.sheet = null; render(); } });

  /* ---------- avvio ---------- */
  ui.local = loadLocal();
  ui.bot = loadBot();
  if (WIDE_MQ) {
    var onWide = function () { render(); };
    if (WIDE_MQ.addEventListener) WIDE_MQ.addEventListener('change', onWide); else if (WIDE_MQ.addListener) WIDE_MQ.addListener(onWide);
  }
  route();
  if (net) net.avvia(); else { ui.online = 'off'; render(); }
})();
</script>
</body>
