<!DOCTYPE html>
<html lang="it" data-stili="no">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valanga</title>
<meta name="description" content="Gioco di carte a colori senza pietà, da 2 a 8 giocatori: le penalità si sommano, le mani si scambiano e chi arriva a 25 carte è fuori. Vince chi resta senza carte.">
<meta name="theme-color" content="#131833">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M2 20 9 7l4 6 3-4 6 11z' fill='%23f5aa3e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Rozha+One&display=swap">
<script src="../lib/ambiente.js"></script>
<script src="../lib/temi.js"></script>
<script src="mondi.js"></script>
<link rel="stylesheet" href="../lib/temi.css">
<style>
:root {
  /* Valanga: la notte indaco della sala giochi; carte piene di colore con un simbolo per chi non distingue i colori. */
  /* Layout: una colonna (max 560px): il tavolo con mazzo e scarti, i giocatori, poi la tua mano e le mosse in basso. */
  --table: #131833;
  --panel: #1b2246;
  --raise: #283161;
  --line: #3b4784;
  --text: #f6eedd;
  --muted: #b3b5d4;
  --saffron: #f5aa3e;
  --on-saffron: #2a1903;
  --bad: #ff9f8a;
  --good: #7ad7a2;
  --cr: #e5484d; --cg: #f2b33d; --cv: #3fae6a; --cb: #3d7fe0;
  --font-display: "Rozha One", Georgia, "Times New Roman", serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background-color: var(--table);
  background-image: linear-gradient(135deg, rgba(255, 255, 255, .035) 25%, transparent 25%), linear-gradient(225deg, rgba(255, 255, 255, .035) 25%, transparent 25%);
  background-size: 44px 44px; color: var(--text); font: 16px/1.4 var(--font-body); -webkit-text-size-adjust: 100%;
}
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }
#app { max-width: 560px; margin: 0 auto; padding: 0 16px; min-height: 100%; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.err { color: var(--bad); }

/* ---------- carte ---------- */
.vc {
  --w: 52px; --c: #555; --c1: #777; --c2: #333;
  position: relative; flex: none; width: var(--w); aspect-ratio: 5 / 7.4; border-radius: calc(var(--w) * .14);
  display: grid; place-items: center; overflow: hidden; color: #fff; padding: 0;
  background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .22) 0 30%, transparent 31%), linear-gradient(160deg, var(--c1) 0%, var(--c) 55%, var(--c2) 100%);
  box-shadow: inset 0 0 0 calc(var(--w) * .05) rgba(255, 255, 255, .9), 0 2px 0 rgba(0, 0, 0, .3), 0 5px 12px rgba(0, 0, 0, .28);
  font-family: var(--font-display); border: 0;
}
.vc.r { --c: var(--cr); --c1: #f2797d; --c2: #b3333a; } .vc.g { --c: var(--cg); --c1: #f8d27c; --c2: #c98a17; color: #3a2500; }
.vc.v { --c: var(--cv); --c1: #6fcb93; --c2: #2a8550; } .vc.b { --c: var(--cb); --c1: #77a6ee; --c2: #2a5fb3; }
.vc .v { position: relative; font-size: calc(var(--w) * .5); line-height: 1; text-shadow: 0 2px 0 rgba(0, 0, 0, .22); letter-spacing: -.02em; }
.vc .v.sym { font-family: var(--font-body); font-weight: 700; font-size: calc(var(--w) * .46); }
.vc .v.lg { font-size: calc(var(--w) * .36); }
.vc .k { position: absolute; top: calc(var(--w) * .07); left: calc(var(--w) * .1); font: 700 calc(var(--w) * .19)/1 var(--font-body); }
.vc .s { position: absolute; bottom: calc(var(--w) * .07); right: calc(var(--w) * .1); font: calc(var(--w) * .19)/1 var(--font-body); opacity: .9; }
.vc.j { --c: #232a5c; color: #fff; background: radial-gradient(circle at 50% 50%, #232a5c 0 25%, transparent 26%), conic-gradient(from 45deg, var(--cr) 0 25%, var(--cg) 0 50%, var(--cv) 0 75%, var(--cb) 0); }
.vc.j::after { content: ""; position: absolute; inset: calc(var(--w) * .1); border-radius: calc(var(--w) * .1); box-shadow: inset 0 0 0 calc(var(--w) * .03) rgba(255, 255, 255, .55); }
.vc.j .v { z-index: 1; }
.vc.back { background: linear-gradient(160deg, #2b3474, #171c45); box-shadow: inset 0 0 0 calc(var(--w) * .05) var(--saffron), 0 2px 0 rgba(0, 0, 0, .3), 0 5px 12px rgba(0, 0, 0, .28); color: var(--saffron); }
.vc.back .v { font-size: calc(var(--w) * .44); }
.vc.ring { box-shadow: inset 0 0 0 calc(var(--w) * .05) rgba(255, 255, 255, .9), 0 0 0 4px var(--ring), 0 5px 14px rgba(0, 0, 0, .35); }
.vc.new { animation: pop .4s both; }
@keyframes pop { from { opacity: 0; transform: translateY(-10px) scale(.88) rotate(-6deg); } to { opacity: 1; transform: none; } }
button.vc { cursor: pointer; touch-action: manipulation; }
button.vc.ok { transform: translateY(-5px); box-shadow: inset 0 0 0 calc(var(--w) * .05) rgba(255, 255, 255, .95), 0 0 0 3px var(--saffron), 0 8px 14px rgba(0, 0, 0, .35); }
button.vc.sel { transform: translateY(-10px); box-shadow: inset 0 0 0 calc(var(--w) * .05) #fff, 0 0 0 4px #fff, 0 10px 18px rgba(0, 0, 0, .4); }
button.vc:disabled { cursor: default; filter: saturate(.55) brightness(.72); }
button.vc:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.fan { display: flex; justify-content: center; align-items: flex-start; height: 108px; margin-bottom: 6px; }
.fan .vc { --w: 62px; margin: 0 -8px; transform: translateY(var(--y)) rotate(var(--r)); transform-origin: 50% 140%; }

/* ---------- lobby ---------- */
.hubnav { padding-top: 6px; display: flex; justify-content: space-between; align-items: center; }
.hubnav a { text-decoration: none; display: inline-block; }
.brand { text-align: center; padding: 14px 0 8px; }
.brand h1 { font: 52px/1 var(--font-display); margin: 4px 0 0; }
.brand h1 span { color: var(--saffron); }
.brand .tag { color: var(--muted); margin: 8px auto 0; max-width: 40ch; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 14px 0 0; display: grid; gap: 10px; }
.h2 { font: 22px/1.15 var(--font-display); margin: 0; }
.lab { font-size: 14px; color: var(--muted); }
.field { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--table); color: var(--text); font: 17px/1.2 var(--font-body); }
.field:focus-visible { outline: 3px solid var(--saffron); outline-offset: 1px; }
.field.share { font-size: 14px; color: var(--muted); }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.net { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.net i, .netdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.net.up i, .netdot.up { background: var(--good); box-shadow: 0 0 0 3px rgba(122, 215, 162, .18); }
.net.down i, .netdot.down, .net.off i, .netdot.off { background: var(--bad); }
.netdot { margin-left: 8px; vertical-align: 3px; }
.games { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.gitem { display: flex; align-items: stretch; gap: 6px; }
.gopen { flex: 1; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; text-align: left; padding: 11px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--raise); cursor: pointer; }
.gnames { font-weight: 700; }
.gstate { grid-column: 1; font-size: 14px; color: var(--muted); }
.gcta { grid-column: 2; grid-row: 1 / span 2; font-weight: 700; font-size: 14px; padding: 7px 11px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
.gitem.hot .gopen { border-color: var(--saffron); }
.gitem.hot .gstate { color: var(--saffron); }
.gitem.hot .gcta { background: var(--saffron); color: var(--on-saffron); border-color: var(--saffron); }
.icon-btn { width: 44px; flex: none; display: grid; place-items: center; border-radius: 12px; border: 1.5px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.icon-btn svg { width: 20px; height: 20px; }
.howto ol { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.howto li::marker { color: var(--saffron); font-weight: 700; }
.note { text-align: center; font-size: 13px; color: var(--muted); max-width: 44ch; margin: 18px auto 0; line-height: 1.45; }
.foot { text-align: center; margin: 14px 0 28px; }
.seated { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.seated li { display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 12px; border-radius: 12px; background: var(--raise); min-height: 44px; }
.seated .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--table); font-weight: 700; font-size: 13px; flex: none; }
.seated .tag { margin-left: auto; font-size: 13px; color: var(--muted); }
.seated .icon-btn { width: 36px; height: 36px; }
.names { display: grid; gap: 8px; }
.names .row { display: flex; gap: 6px; }
.names .row .field { flex: 1; }

/* ---------- pulsanti ---------- */
.btn { appearance: none; border: 1.5px solid var(--line); background: var(--raise); color: var(--text); border-radius: 12px; padding: 12px 14px; font: 700 15px/1.15 var(--font-body); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; touch-action: manipulation; }
.btn.primary { background: var(--saffron); border-color: var(--saffron); color: var(--on-saffron); }
.btn.hot { background: #ff6b5b; border-color: #ff6b5b; color: #2a0805; }
.btn.big { min-height: 56px; font-size: 18px; }
.btn.wide { width: 100%; }
.btn.sm { min-height: 38px; padding: 7px 12px; font-size: 14px; }
.btn[aria-pressed="true"] { background: #ffd86b; border-color: #ffd86b; color: #3a2500; }
.btn:disabled { opacity: .42; cursor: default; }
.btn:focus-visible, .linkbtn:focus-visible, .gopen:focus-visible, .icon-btn:focus-visible, .chip-btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.linkbtn { background: none; border: 0; padding: 8px 4px; color: var(--muted); font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: none; }
.linkbtn.accent { color: var(--saffron); }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btnrow .btn { flex: 1; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 8px 11px; font-weight: 700; font-size: 15px; color: var(--muted); cursor: pointer; min-width: 40px; }
.seg button[aria-pressed="true"] { background: var(--saffron); color: var(--on-saffron); }
.seg button:focus-visible { outline: 3px solid #fff; outline-offset: -3px; }
.botb { font: 14px/1 var(--emoji); }
.thinking { display: inline-block; animation: think 1s ease-in-out infinite; }
@keyframes think { 50% { opacity: .35; } }
.colors { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.colbtn { min-height: 52px; border-radius: 12px; border: 0; font: 700 17px/1 var(--font-body); color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .2); }
.colbtn.r { background: var(--cr); } .colbtn.g { background: var(--cg); color: #3a2500; } .colbtn.v { background: var(--cv); } .colbtn.b { background: var(--cb); }
.colbtn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { border: 1.5px solid var(--line); background: var(--raise); border-radius: 999px; padding: 8px 14px; min-height: 44px; font-weight: 700; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip-btn small { font-weight: 400; color: var(--muted); }

/* ---------- tavolo ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 4px; padding: 6px 0 2px; }
.topbar .round { font: 17px/1 var(--font-display); white-space: nowrap; }
.topbar .right { display: flex; align-items: center; gap: 0; }
.banner { margin: 8px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--raise); border: 1px solid var(--line); font-size: 14px; }
.status { font: 26px/1.1 var(--font-display); text-align: center; margin: 10px 0 2px; }
.status.is-turn { color: var(--saffron); }
.status.is-bad { color: #ff8a7a; }
.centro { margin: 8px 0 0; padding: 12px; border-radius: 18px; background: radial-gradient(ellipse at 50% 0%, #2f3a7a, #1b2246 72%); border: 1px solid var(--line); display: grid; grid-template-columns: auto auto 1fr; gap: 14px; align-items: center; }
.pile { display: grid; justify-items: center; gap: 4px; }
.pile .vc { --w: 50px; }
.pile .cnt { font-size: 12px; color: var(--muted); white-space: nowrap; }
.scarti .vc { --w: 76px; }
.stato { display: grid; gap: 6px; min-width: 0; }
.colore { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
.colore i { width: 14px; height: 14px; border-radius: 50%; background: var(--dot); box-shadow: 0 0 0 2px rgba(255, 255, 255, .5); }
.giro { font-size: 14px; color: var(--muted); }
.pena { justify-self: start; font: 700 15px/1 var(--font-body); padding: 7px 11px; border-radius: 10px; background: #ff6b5b; color: #2a0805; }
.ultima { font-size: 14px; line-height: 1.3; }
.lanes { display: grid; gap: 6px; margin-top: 12px; }
.lane { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; min-width: 0; }
.lane.turn { border-color: var(--saffron); box-shadow: 0 0 0 1px var(--saffron); }
.lane.out { opacity: .6; }
.lane .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.lane.me .nm { color: var(--saffron); }
.lane .tags { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.lane .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: linear-gradient(90deg, #7ad7a2, #f5aa3e 60%, #ff5a4a); overflow: hidden; display: flex; justify-content: flex-end; }
.lane .bar i { display: block; height: 100%; background: #2c3357; }   /* copre la parte ancora vuota: più carte, più rosso */
.cnt-b { font: 700 15px/1 var(--font-body); font-variant-numeric: tabular-nums; }
.cnt-b small { font-weight: 400; color: var(--muted); font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: rgba(255, 255, 255, .08); color: var(--muted); white-space: nowrap; }
.chip.uno { color: #ffd86b; }
.chip.out { color: #ff8a7a; }
.chip.next { color: var(--text); }
.becca { min-height: 34px; padding: 5px 10px; font-size: 13px; }
.mine { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 10px 12px; }
.mine .hh { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 0 2px 8px; }
.mine .hh b { font: 18px/1 var(--font-display); }
.hand { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding-top: 10px; }
.hand .vc { --w: 50px; }
.hand.many .vc { --w: 42px; }
.pass { display: grid; gap: 10px; text-align: center; padding: 8px 4px; }
.pass b { font: 22px/1.2 var(--font-display); }
.actions { position: sticky; bottom: 0; z-index: 2; margin: 14px -16px 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(19, 24, 51, .96); border-top: 1px solid var(--line); display: grid; gap: 8px; margin-top: auto; max-height: 60vh; overflow: auto; }
.spacer { flex: 1; min-height: 14px; }
.hint { margin: 0; font-size: 15px; color: var(--muted); }
.hint b { color: var(--text); }

/* ---------- fogli ---------- */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(8, 10, 24, .72); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 90%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 20px 20px 0 0; padding: 20px 18px calc(22px + env(safe-area-inset-bottom)); display: grid; gap: 12px; }
.sheet h2 { font: 28px/1.1 var(--font-display); margin: 0; }
.sheet h3 { font-size: 15px; margin: 6px 0 0; color: var(--saffron); text-transform: uppercase; letter-spacing: .07em; }
.sheet p, .sheet ul { margin: 0; }
.sheet ul { padding-left: 20px; display: grid; gap: 6px; }
.eyebrow { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.log { list-style: none; padding: 0; margin: 0; }
.log li { padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.log li.sep { color: var(--saffron); font-weight: 700; }
.catalog { display: grid; gap: 10px; }
.catalog .row { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.catalog .vc { --w: 42px; }
.catalog .t { font-size: 14px; }
.catalog .t b { display: block; }
.strip { display: flex; flex-wrap: wrap; gap: 4px; }
.strip .vc { --w: 30px; }
table.score { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.score th, table.score td { padding: 7px 6px; text-align: right; border-bottom: 1px solid var(--line); }
table.score th:first-child, table.score td:first-child { text-align: left; }
table.score thead th { color: var(--muted); font-size: 13px; }
table.score tr.win td { color: var(--saffron); font-weight: 700; }
table.score td.z { color: var(--bad); }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
.confetti i { position: absolute; top: -40px; font: 26px/1 var(--emoji); animation: fall var(--t) linear var(--d) both; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

@media (prefers-reduced-motion: reduce) { .vc.new, .confetti i, .thinking { animation: none !important; } button.vc.ok, button.vc.sel { transform: none; } }
@media (max-width: 400px) { .topbar .bk { display: none; } .hand .vc { --w: 46px; } .hand.many .vc { --w: 39px; } .scarti .vc { --w: 68px; } }

/* ---------- computer e schermi larghi: lobby e tavolo su due colonne, fogli al centro ---------- */
@media (min-width: 1000px) {
  #app.wide { max-width: 1240px; padding: 0 28px; }
  #app.wide > .hubnav { width: 100%; max-width: 1040px; margin: 0 auto; }
  .desk { display: grid; grid-template-columns: minmax(0, 1fr) minmax(380px, 460px); gap: 0 28px; align-items: start; }
  .desk > div { min-width: 0; }
  .desk .col-r { position: sticky; top: 10px; max-height: calc(100vh - 20px); overflow: auto; padding: 0 4px 12px; margin: 0 -4px; scrollbar-width: thin; }
  .desk .col-r > :first-child { margin-top: 8px; }
  .desk .actions { position: static; margin: 12px 0 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); max-height: none; overflow: visible; }
  .desk.lobby { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); width: 100%; max-width: 1040px; margin: 0 auto 28px; gap: 0 24px; }
  .desk.lobby .col-r { position: static; max-height: none; overflow: visible; padding: 0; margin: 0; }
  .desk.lobby .col-r > .panel:first-child { margin-top: 14px; }
  .desk.lobby .note { margin-top: 16px; }
  .desk .centro { padding: 18px; gap: 22px; }
  .desk .scarti .vc { --w: 104px; }
  .desk .pile .vc { --w: 64px; }
  .desk .lanes.two { grid-template-columns: 1fr 1fr; }
  .desk .hand .vc { --w: 56px; }
  .desk .hand.many .vc { --w: 48px; }
}
@media (min-width: 700px) and (min-height: 520px) {
  .overlay { align-items: center; padding: 24px; }
  .sheet { border-radius: 20px; border-bottom: 1px solid var(--line); max-height: 86vh; padding-bottom: 22px; }
}
@media (hover: hover) and (pointer: fine) {
  .btn:not(:disabled):hover, .chip-btn:hover, .gopen:hover, .colbtn:hover { filter: brightness(1.12); }
  button.vc.ok:hover { transform: translateY(-9px); }
  .seg button:not([aria-pressed="true"]):hover { color: var(--text); }
  .linkbtn:hover { color: var(--text); }
}
/* ---------- temi (lib/temi.css): le carte di Valanga coi gettoni --t-* ---------- */
html[data-tema] .vc {
  --cc: var(--c); --t-c: color-mix(in srgb, var(--cc) var(--t-col-mix, 100%), var(--t-col-mixcon, #fff));
  background: var(--t-col-fondo, var(--t-c)); color: var(--t-col-testo, var(--t-c)); border-radius: var(--t-raggio);

<script>
(function () {
  'use strict';
  var K = window.Valanga;
  var BOT = window.ValangaBot;
  var S = window.Suoni || { tema: function () {}, effetto: function () {}, sequenza: function () {}, bottone: function () { return ''; } };
  // Temi comuni (lib/temi.js): pulsantino accanto all'audio; cambiato il tema, si ridisegna.
  var TM = window.Temi || { bottone: function () { return ''; }, attuale: function () { return 'notte'; } };
  document.addEventListener('temi:cambio', function () { render(); });
  var $app = document.getElementById('app');
  var $layer = document.getElementById('layer');

  // Su schermi larghi (computer, tablet in orizzontale) lobby e tavolo si dividono in due colonne.
  var WIDE_MQ = window.matchMedia ? window.matchMedia('(min-width: 1000px)') : null;
  function isWide() { return !!(WIDE_MQ && WIDE_MQ.matches); }
  var LS = {
    get: function (k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* niente memoria */ } },
    del: function (k) { try { window.localStorage.removeItem(k); } catch (e) { /* idem */ } }
  };
  function loadJSON(k, d) { try { var v = JSON.parse(LS.get(k) || 'null'); return v == null ? d : v; } catch (e) { return d; } }
  function rnd36(n) { var o = '', a = 'abcdefghijklmnopqrstuvwxyz0123456789'; for (var i = 0; i < n; i++) o += a[K.randInt(36)]; return o; }
  function range(n) { var a = []; for (var i = 0; i < n; i++) a.push(i); return a; }
  var LEVEL_OK = { facile: 1, medio: 1, difficile: 1 };

  var ui = {
    route: 'lobby', gameId: null, online: 'connecting',
    game: null, gameMissing: false, missTimer: null,
    local: null, bot: null, sheet: null, sheetId: null, hideResultKey: null,
    name: LS.get('va-name') || '',
    localNames: (function () { var a = loadJSON('va-lnames', null); return Array.isArray(a) && a.length >= 2 ? a.slice(0, K.MAX_PLAYERS) : ['', '', '']; })(),
    botN: Math.max(1, Math.min(5, +LS.get('va-botn') || 3)),
    botLv: (function () { var v = LS.get('va-botlv'); return LEVEL_OK[v] ? v : 'medio'; })(),
    botFast: LS.get('va-botfast') === '1',
    botTimer: null, botKey: null, beccaTimer: null, beccaKey: null,
    sel: null, selKey: null, unoArm: false, handOpen: -1,
    error: '', copied: false, seenKey: null, seenI: 0, seenTop: null, lastMine: false, pendingJoin: null
  };
  ui.device = LS.get('va-device');
  if (!ui.device) { ui.device = 'd' + rnd36(14); LS.set('va-device', ui.device); }
  ui.myKey = 'd:' + ui.device;
  S.tema('valanga');

  function validState(s) {
    return !!(s && s.app === 'valanga' && typeof s.v === 'number' && Array.isArray(s.seats) && s.seats.length >= 1 &&
      s.seats.length <= K.MAX_PLAYERS && s.hand && typeof s.hand === 'object' && Array.isArray(s.deck) && Array.isArray(s.discard));
  }
  var net = window.Stanze ? window.Stanze({
    topic: 'valanga/v1', memoria: 'va-', valida: validState,
    quandoArriva: function (id, prev, data) { onRoom(id, prev, data); },
    quandoCambiaRete: function (x) { ui.online = x; render(); }
  }) : null;

  /* ---------- testo ---------- */
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function nameOf(s, p) { return (s.seats[p] && s.seats[p].name) || ('Giocatore ' + (p + 1)); }
  function hn(s, p) { return esc(nameOf(s, p)); }
  function plural(n, a, b) { return n === 1 ? a : b; }
  function carteTxt(n) { return n + ' ' + plural(n, 'carta', 'carte'); }
  var SIMBOLO = { r: '◆', g: '★', v: '▲', b: '●' };
  var COL_HEX = { r: '#e5484d', g: '#f2b33d', v: '#3fae6a', b: '#3d7fe0' };
  function colNome(c) { return K.NOMI_COLORE[c] || ''; }
  // Mondi (mondi.js): i gusti delle Caramelle al posto dei colori, sul testo già pronto.
  var VAM = window.ValangaMondi || { parole: function (h) { return h; } };
  // «un 7 rosso», «uno 0 blu», «uno Scarta tutto giallo», «un Jolly Pesca 6»
  function cardTxt(id) {
    var I = K.info(id);
    if (!I) return '';
    var nm = K.cardName(id);
    if (I.k === 'n') return (I.v === 0 ? 'uno ' : 'un ') + nm;
    return (I.k === 't' ? 'uno ' : 'un ') + nm;
  }
  function cb(id) { return '<b>' + esc(K.cardName(id)) + '</b>'; }
  var FACCIA = { s: ['⊘', 'sym'], i: ['⇄', 'sym'], p2: ['+2', ''], p4: ['+4', ''], t: ['⇊', 'sym'], x: ['⊘⊘', 'sym lg'], ji: ['⇄+4', 'lg'], j6: ['+6', ''], j10: ['+10', 'lg'], jr: ['?', ''] };
  function cardHTML(id, opts) {
    opts = opts || {};
    var I = K.info(id);
    if (!I) return '';
    var cls = 'vc ' + (I.jolly ? 'j' : I.col), f = I.k === 'n' ? [String(I.v), ''] : FACCIA[I.k];
    var corner = I.k === 'n' ? String(I.v) : f[0].replace('⊘⊘', '⊘');
    var inner = '<span class="k">' + esc(corner) + '</span><span class="v' + (f[1] ? ' ' + f[1] : '') + '">' + esc(f[0]) + '</span>' + (I.col ? '<span class="s">' + SIMBOLO[I.col] + '</span>' : '');
    if (opts.cls) cls += ' ' + opts.cls;
    var st = (opts.w ? '--w:' + opts.w + 'px;' : '') + (opts.ring ? '--ring:' + COL_HEX[opts.ring] + ';' : '') + (opts.style || '');
    var label = K.cardName(id) + (opts.ring && I.jolly ? ', colore ' + colNome(opts.ring) : '');
    if (opts.btn) {
      return '<button type="button" class="' + cls + '"' + (st ? ' style="' + st + '"' : '') + ' data-act="' + opts.btn + '" data-c="' + id + '"' +
        (opts.disabled ? ' disabled' : '') + ' aria-label="' + esc(label + (opts.disabled ? ' (adesso non si può giocare)' : '')) + '"' + (opts.pressed != null ? ' aria-pressed="' + opts.pressed + '"' : '') + '>' + inner + '</button>';
    }
    return '<span class="' + cls + '"' + (st ? ' style="' + st + '"' : '') + ' role="img" aria-label="' + esc(label) + '">' + inner + '</span>';
  }
  function backHTML(w) { return '<span class="vc back" style="--w:' + w + 'px" role="img" aria-label="Mazzo"><span class="v">▲</span></span>'; }
  // la mano in ordine: per colore, poi i jolly; dentro il colore i numeri e poi le azioni
  var ORD_K = { n: 0, s: 1, i: 2, x: 3, t: 4, p2: 5, p4: 6, jr: 7, ji: 8, j6: 9, j10: 10 };
  function sortHand(h) {
    return h.slice().sort(function (a, b) {
      var A = K.info(a), B = K.info(b), ca = A.col ? K.COLORI.indexOf(A.col) : 9, cbb = B.col ? K.COLORI.indexOf(B.col) : 9;
      if (ca !== cbb) return ca - cbb;
      if (ORD_K[A.k] !== ORD_K[B.k]) return ORD_K[A.k] - ORD_K[B.k];
      return (A.v || 0) - (B.v || 0) || (a < b ? -1 : 1);
    });
  }

  /* ---------- prospettiva ---------- */
  function cur() { return ui.route === 'local' ? ui.local : ui.route === 'bot' ? ui.bot : ui.game; }
  function persp(s) {
    if (s.mode === 'local') { var a = K.nextActor(s); return { me: a >= 0 ? a : s.turn, seated: true, local: true, open: a >= 0 && ui.handOpen === a }; }
    if (s.mode === 'bot') return { me: 0, seated: true, bot: true, open: true };
    var seat = K.seatOf(s, ui.myKey);
    return { me: seat, seated: seat >= 0, open: seat >= 0 };
  }
  function isMe(P, p) { return !P.local && P.seated && p === P.me; }
  function who(s, P, p) { return isMe(P, p) ? 'tu' : hn(s, p); }
  function Who(s, P, p) { return isMe(P, p) ? 'Tu' : hn(s, p); }
  function whom(s, P, p) { return isMe(P, p) ? 'te' : hn(s, p); }
  function isMine(s, P) { return P.seated && s.status === 'playing' && P.me >= 0 && K.nextActor(s) === P.me; }
  function canAct(s, P) { return isMine(s, P) && (P.local || P.bot || ui.online === 'up') && (!P.local || P.open); }
  function isBot(s, p) { return !!(s.bots && s.bots[p]); }
  function botTag(s, p) { return isBot(s, p) ? ' <span class="botb" title="Computer, livello ' + esc(s.bots[p]) + '">🤖</span>' : ''; }
  function gameKey(s) { return s.mode === 'local' ? 'L' + s.createdAt : s.mode === 'bot' ? 'B' + s.createdAt : ui.gameId; }
  // La situazione di gioco: cambia con le mosse del turno, non con «Valanga!» e «Becca!», che si fanno fuori turno.
  function ctxKey(s) { return gameKey(s) + ':' + s.createdAt + ':' + s.status + ':' + s.turn + ':' + s.discard.length + ':' + (s.prompt ? s.prompt.s : '-') + ':' + s.pen + ':' + (s.forzata || '') + ':' + s.dir; }
  function verb(P, p, tu, lui) { return isMe(P, p) ? tu : lui; }

  /* ---------- cronaca ---------- */
  function line(e, s, P) {
    var p = e.s;
    switch (e.t) {
      case 'inizio': return { e: '🏔️', t: 'Si parte: ' + (isMe(P, e.dealer) ? 'dai tu le carte' : 'dà le carte ' + hn(s, e.dealer)) + ', in cima ' + cardTxt(e.c) };
      case 'gioca': {
        var t = Who(s, P, p) + ' ' + verb(P, p, 'giochi', 'gioca') + ' ' + cb(e.c);
        if (K.info(e.c).jolly && K.info(e.c).k !== 'jr') t += ' e ' + verb(P, p, 'scegli', 'sceglie') + ' il ' + colNome(e.col);
        if (e.sotto) t += e.sotto.length === 1 ? ', con un\'altra carta ' + { r: 'rossa', g: 'gialla', v: 'verde', b: 'blu' }[K.info(e.c).col] : ', con altre ' + e.sotto.length + ' carte ' + { r: 'rosse', g: 'gialle', v: 'verdi', b: 'blu' }[K.info(e.c).col];
        if (e.pen) t += ': penalità a ' + e.pen;
        return { e: K.info(e.c).pen ? '💥' : '🃏', t: t };
      }
      case 'pescate': {
        var vede = (e.priv || []).indexOf(P.me) >= 0 && !P.local;
        return { e: '🫳', t: Who(s, P, p) + ' ' + verb(P, p, 'peschi', 'pesca') + ' ' + carteTxt(e.n) + (e.c ? (vede ? ' e ' + verb(P, p, 'trovi', 'trova') + ' ' + cb(e.c) : ', finché ne trova una da giocare') : ': il mazzo è finito') };
      }
      case 'penalita': return { e: '🌨️', t: Who(s, P, p) + ' ' + verb(P, p, 'peschi', 'pesca') + ' ' + carteTxt(e.n) + ' di penalità e ' + verb(P, p, 'salti', 'salta') + ' il turno', bad: true };
      case 'roulette': return { e: '🎯', t: Who(s, P, p) + ' ' + verb(P, p, 'scegli', 'sceglie') + ' il ' + colNome(e.col) + ' e ' + verb(P, p, 'scopri', 'scopre') + ' ' + carteTxt(e.cards.length) + ': ' + verb(P, p, 'le prendi', 'le prende') + ' tutte' };
      case 'passano': return { e: '🔁', t: 'Le mani passano ' + (e.dir > 0 ? 'avanti' : 'indietro') + ' di un posto (lo 0 di ' + whom(s, P, p) + ')' };
      case 'scambia': return { e: '🔀', t: Who(s, P, p) + ' ' + verb(P, p, 'scambi', 'scambia') + ' la mano con ' + whom(s, P, e.q) };
      case 'uno': return { e: '🔔', t: Who(s, P, p) + ' ' + verb(P, p, 'dici', 'dice') + ' «Valanga!»: ' + verb(P, p, 'ti resta', 'gli resta') + ' una carta' };
      case 'beccato': return { e: '🚨', t: Who(s, P, p) + ' ' + verb(P, p, 'becchi', 'becca') + ' ' + whom(s, P, e.q) + ' senza «Valanga!»: ' + carteTxt(e.n) + ' in più', bad: true };
      case 'sommerso': return { e: '🏔️', t: Who(s, P, p) + ' ' + verb(P, p, 'arrivi', 'arriva') + ' a ' + K.LIMITE + ' carte: ' + verb(P, p, 'sei', 'è') + ' fuori' + (e.da >= 0 ? ' (merito di ' + whom(s, P, e.da) + ')' : ''), bad: true };
      case 'rimescola': return { e: '🔄', t: 'Gli scarti tornano nel mazzo' };
      case 'vince': return { e: '🏆', t: (isMe(P, p) ? 'Hai vinto' : hn(s, p) + ' vince') + (e.why === 'superstite' ? ': ' + verb(P, p, 'sei', 'è') + ' l\'ultimo rimasto' : ': ' + verb(P, p, 'hai', 'ha') + ' finito le carte'), good: true };
    }
    return null;
  }

  /* ---------- tavolo ---------- */
  function topbarHTML(s, P) {
    var off = P.local || P.bot;
    return '<header class="topbar"><button class="linkbtn" data-act="lobby" aria-label="' + (off ? 'Esci' : 'Torna alle partite') + '">‹<span class="bk"> ' + (off ? 'Esci' : 'Partite') + '</span></button>' +
      '<span class="round">Valanga' + (off ? '' : netDot()) + '</span>' +
      '<span class="right">' + TM.bottone() + S.bottone() + '<button class="linkbtn" data-act="log">Storico</button><button class="linkbtn" data-act="rules">Regole</button></span></header>';
  }
  function bannersHTML(s, P) {
    var h = '';
    if (!P.local && !P.bot && (ui.online === 'down' || ui.online === 'off')) h += '<div class="banner">Connessione persa: le mosse ripartono appena torna la rete.</div>';
    if (!P.local && !P.bot && !P.seated) h += '<div class="banner">Stai guardando la partita: non sei seduto a questo tavolo.</div>';
    if (!P.local && P.seated && K.fuori(s, P.me) && s.status === 'playing') h += '<div class="banner">Sei arrivato a ' + K.LIMITE + ' carte: sei fuori. Guarda come va a finire.</div>';
    return h;
  }

  /* ---------- azioni ---------- */
  function play(move, as) {
    var s = cur(); if (!s) return false;
    var P = persp(s), seat = as != null ? as : P.me;
    if (P.bot || P.local) {
      var r = K.act(s, seat, move);
      if (!r.ok) { ui.error = r.error; S.effetto('errore'); render(); return false; }
      if (P.bot) { ui.bot = r.state; saveBot(); }
      else {
        ui.local = r.state; saveLocal();
        // la mano resta scoperta solo se il telefono resta a chi la stava guardando
        if (K.nextActor(ui.local) !== ui.handOpen) ui.handOpen = -1;
      }
      ui.error = ''; ui.sel = null;
      render();
      return true;
    }
    if (seat < 0) return false;
    // «Valanga!» e «Becca!» degli altri non annullano la tua mossa: la regola la controlla il motore
    var ctx = ctxKey(s), fuoriTurno = move.type === 'becca' || move.type === 'uno';
    var ok = writeGame(function (c) {
      if (!fuoriTurno && ctxKey(c) !== ctx) return { ok: false, error: 'Il tavolo era cambiato: ecco la situazione aggiornata.' };
      return K.act(c, seat, move);
    });
    if (ok) ui.sel = null;
    return ok;
  }
  function playCard(c, extra) {
    var m = { type: 'play', card: c };
    Object.keys(extra || {}).forEach(function (k) { m[k] = extra[k]; });
    if (ui.unoArm) m.uno = true;
    if (play(m)) ui.unoArm = false;
  }
  function readNames() {
    ui.localNames = ui.localNames.map(function (nm, i) { var el = document.getElementById('ln-' + i); return el ? el.value : nm; });
    LS.set('va-lnames', JSON.stringify(ui.localNames));
  }
  var actions = {
    lobby: function () { go(''); },
    'go-local': function () { go('#locale'); },
    open: function (el) { go('#partita-' + el.dataset.id); },
    'new': createGame,
    'ask-del': function (el) { ui.sheet = 'del'; ui.sheetId = el.dataset.id; render(); },
    del: function () { var id = ui.sheetId; ui.sheet = null; if (net && id) net.togli(id); render(); },
    close: function () { ui.sheet = null; ui.error = ''; render(); },
    rules: function () { ui.sheet = 'rules'; render(); },
    log: function () { ui.sheet = 'log'; render(); },
    'hide-result': function () { ui.hideResultKey = resultKey(cur()); ui.error = ''; render(); },
    'show-result': function () { ui.hideResultKey = null; render(); },
    share: function () {
      var s = ui.game, text = (s ? nameOf(s, s.host) : 'Un amico') + ' ti invita a Valanga: apri il link e siediti al tavolo.';
      if (navigator.share) navigator.share({ title: 'Valanga', text: text, url: shareUrl(ui.gameId) }).catch(function () { /* annullato */ });
      else actions.copy();
    },
    copy: function () {
      var done = function () { ui.copied = true; render(); setTimeout(function () { ui.copied = false; render(); }, 2200); };
      var fallback = function () { var el = document.getElementById('share-url'); if (el) { el.focus(); el.select(); } };
      try { navigator.clipboard.writeText(shareUrl(ui.gameId)).then(done, fallback); } catch (e) { fallback(); }
    },
    join: function () {
      var name = (ui.name || '').trim() || 'Giocatore';
      LS.set('va-name', name);
      var key = ui.myKey;
      if (writeGame(function (c) { return K.join(c, key, name); })) ui.pendingJoin = { id: ui.gameId, name: name };
    },
    start: function () { var s = ui.game; if (s && writeGame(function (c) { return K.startGame(c); }, { expectV: s.v })) S.effetto('mescola'); },
    'bot-add': function () { var s = ui.game; if (s) writeGame(function (c) { return K.addBot(c, ui.botLv, freeBotName(c)); }, { expectV: s.v }); },
    'bot-del': function (el) { var s = ui.game, i = +el.dataset.seat; if (s) writeGame(function (c) { return K.removeBot(c, i); }, { expectV: s.v }); },
    'hand-open': function () { var s = cur(); if (s) { ui.handOpen = persp(s).me; render(); } },
    card: function (el) {
      var s = cur(), c = el.dataset.c; if (!s) return;
      var P = persp(s), I = K.info(c), h = K.mano(s, P.me);
      if (!giocabileQui(s, P, c)) return;
      if ((I.jolly && I.k !== 'jr') || (I.k === 'n' && I.v === 7 && h.length > 1)) { ui.sel = ui.sel === c ? null : c; S.effetto('click'); render(); return; }
      playCard(c);
    },
    unsel: function () { ui.sel = null; render(); },
    color: function (el) { if (ui.sel) playCard(ui.sel, { color: el.dataset.v }); },
    target: function (el) { if (ui.sel) playCard(ui.sel, { target: +el.dataset.seat }); },
    roulette: function (el) { play({ type: 'answer', color: el.dataset.v }); },
    pesca: function () { play({ type: 'pesca' }); },
    'uno-arm': function () { ui.unoArm = !ui.unoArm; S.effetto('click'); render(); },
    uno: function () { play({ type: 'uno' }); },
    // sullo stesso telefono si può dire «Valanga!» per chi ha appena giocato
    'uno-for': function () { var s = cur(); if (s) play({ type: 'uno' }, K.beccabile(s)); },
    becca: function (el) {
      var s = cur(); if (!s) return;
      var P = persp(s), t = +el.dataset.seat, by = P.me;
      // sullo stesso telefono il telefono ce l'ha chi deve giocare: la beccata è sua
      if (P.local) by = s.turn !== t && !K.fuori(s, s.turn) ? s.turn : K.attivi(s).filter(function (q) { return q !== t; })[0];
      play({ type: 'becca', target: t }, by);
    },
    rematch: function () {
      if (ui.route === 'bot') { var rb = K.rematch(ui.bot); if (rb.ok) { ui.bot = rb.state; ui.hideResultKey = null; saveBot(); S.effetto('mescola'); render(); } return; }
      if (ui.route === 'local') { var r = K.rematch(ui.local); if (r.ok) { ui.local = r.state; ui.hideResultKey = null; ui.handOpen = -1; saveLocal(); S.effetto('mescola'); render(); } return; }
      var s = ui.game; if (s && writeGame(function (c) { return K.rematch(c); }, { expectV: s.v })) S.effetto('mescola');
    },
    'ln-add': function () { readNames(); if (ui.localNames.length < K.MAX_PLAYERS) ui.localNames.push(''); LS.set('va-lnames', JSON.stringify(ui.localNames)); render(); },
    'ln-del': function (el) { readNames(); ui.localNames.splice(+el.dataset.i, 1); LS.set('va-lnames', JSON.stringify(ui.localNames)); render(); },
    'bot-n': function (el) { ui.botN = +el.dataset.v; LS.set('va-botn', String(ui.botN)); render(); },
    'bot-lv': function (el) { ui.botLv = el.dataset.v; LS.set('va-botlv', ui.botLv); render(); },
    'bot-fast': function (el) { ui.botFast = el.dataset.v === '1'; LS.set('va-botfast', ui.botFast ? '1' : '0'); render(); },
    'bot-start': function () {
      var me = (ui.name || '').trim() || 'Tu';
      ui.bot = K.startBots([me].concat(BOT_NAMES.slice(0, ui.botN)), ui.botLv);
      ui.hideResultKey = null; saveBot(); S.effetto('mescola');
      go('#computer');
    },
    'bot-resume': function () { go('#computer'); },
    'local-start': function () {
      readNames();
      var names = ui.localNames.map(function (nm, i) { return (nm || '').trim() || 'Giocatore ' + (i + 1); });
      ui.local = K.startLocal(names); ui.hideResultKey = null; ui.handOpen = -1; saveLocal(); S.effetto('mescola'); render();
    },
    'local-reset': function () { ui.local = null; ui.handOpen = -1; saveLocal(); ui.hideResultKey = null; if (ui.route === 'local') render(); else go('#locale'); }
  };

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    if (el.dataset.self && ev.target !== el) return;
    var fn = actions[el.dataset.act];
    if (fn) { ev.preventDefault(); fn(el, ev); }
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'nm') { ui.name = t.value; LS.set('va-name', t.value); }
    else if (/^ln-\d+$/.test(t.id)) { ui.localNames[+t.id.slice(3)] = t.value; LS.set('va-lnames', JSON.stringify(ui.localNames)); }
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && ui.sheet) { ui.sheet = null; render(); } });

  /* ---------- avvio ---------- */
  ui.local = loadLocal();
  ui.bot = loadBot();
  if (WIDE_MQ) {
    var onWide = function () { render(); };
    if (WIDE_MQ.addEventListener) WIDE_MQ.addEventListener('change', onWide); else if (WIDE_MQ.addListener) WIDE_MQ.addListener(onWide);
  }
  route();
  if (net) net.avvia(); else { ui.online = 'off'; render(); }
})();
</script>
</body>
</html>
