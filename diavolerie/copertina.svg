<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Diavolerie: un diavoletto sorridente tra carte rotonde colorate, candele, dadi e anime a forma di fantasmino">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.6" fill="#f5aa3e" fill-opacity=".12"/>
      <circle cx="0" cy="0" r="1" fill="#ffffff" fill-opacity=".05"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="55%" r="55%">
      <stop offset="0" stop-color="#7a1838" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#3a2350" stop-opacity=".7"/>
      <stop offset="1" stop-color="#131833" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="skin" cx="45%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ff8a5c"/><stop offset=".55" stop-color="#e2343f"/><stop offset="1" stop-color="#8f0f2c"/>
    </radialGradient>
    <linearGradient id="horn" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f5aa3e"/><stop offset="1" stop-color="#fff1b8"/></linearGradient>
    <linearGradient id="sweet" x1=".3" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="#ffe2f0"/><stop offset="1" stop-color="#ff8fc0"/></linearGradient>
    <linearGradient id="rotten" x1=".3" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="#ecffa8"/><stop offset="1" stop-color="#55b134"/></linearGradient>
    <linearGradient id="kid" x1=".3" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="#dcf3ff"/><stop offset="1" stop-color="#5fb0ec"/></linearGradient>
    <linearGradient id="animal" x1=".3" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="#fff1c8"/><stop offset="1" stop-color="#f0952f"/></linearGradient>
    <linearGradient id="wax" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9dcc0"/><stop offset=".5" stop-color="#fffaf0"/><stop offset="1" stop-color="#d9c8a4"/></linearGradient>
    <radialGradient id="flame" cx="50%" cy="70%" r="60%"><stop offset="0" stop-color="#fff6cf"/><stop offset=".5" stop-color="#ffcf6e"/><stop offset="1" stop-color="#f5713e"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".4"/></filter>
    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
    <symbol id="soul" viewBox="0 0 24 24"><path d="M12 3.2c-4 0-7 3.1-7 7.2v9.4l2.3-1.6 2.4 1.6 2.3-1.6 2.3 1.6 2.4-1.6 2.3 1.6v-9.4c0-4.1-3-7.2-7-7.2z" fill="#f2f7ff"/><circle cx="9.4" cy="10.4" r="1.4" fill="#131833"/><circle cx="14.6" cy="10.4" r="1.4" fill="#131833"/></symbol>
  </defs>

  <rect width="600" height="360" fill="#131833"/>
  <rect width="600" height="360" fill="url(#dots)"/>
  <rect width="600" height="360" fill="url(#glow)"/>

  <!-- ventaglio di carte rotonde dietro al diavoletto -->
  <g filter="url(#shadow)" font-family="Georgia, 'Times New Roman', serif" font-size="26" text-anchor="middle">
    <g transform="rotate(-32 300 400) translate(300 178)"><circle r="60" fill="url(#sweet)" stroke="#ff5fa2" stroke-width="8"/><circle r="45" fill="none" stroke="#1b2246" stroke-opacity=".28" stroke-width="2" stroke-dasharray="5 5"/><circle cx="-30" cy="-36" r="16" fill="#fff" stroke="#1b2246" stroke-width="3"/><text x="-30" y="-27" fill="#1b2246">5</text></g>
    <g transform="rotate(-15 300 400) translate(300 148)"><circle r="60" fill="url(#rotten)" stroke="#49a52a" stroke-width="8"/><circle r="45" fill="none" stroke="#1b2246" stroke-opacity=".28" stroke-width="2" stroke-dasharray="5 5"/><circle cx="-30" cy="-36" r="16" fill="#fff" stroke="#1b2246" stroke-width="3"/><text x="-30" y="-27" fill="#1b2246">9</text></g>
    <g transform="rotate(15 300 400) translate(300 148)"><circle r="60" fill="url(#kid)" stroke="#3d8fd6" stroke-width="8"/><circle r="45" fill="none" stroke="#1b2246" stroke-opacity=".28" stroke-width="2" stroke-dasharray="5 5"/><circle cx="30" cy="-36" r="16" fill="#fff" stroke="#1b2246" stroke-width="3"/><text x="30" y="-27" fill="#1b2246">6</text></g>
    <g transform="rotate(32 300 400) translate(300 178)"><circle r="60" fill="url(#animal)" stroke="#df7a1e" stroke-width="8"/><circle r="45" fill="none" stroke="#1b2246" stroke-opacity=".28" stroke-width="2" stroke-dasharray="5 5"/><circle cx="30" cy="-36" r="16" fill="#fff" stroke="#1b2246" stroke-width="3"/><text x="30" y="-27" fill="#1b2246">7</text></g>
  </g>

  <!-- il diavoletto -->
  <g filter="url(#shadow)">
    <path d="M238 150c-22-18-30-46-22-74 18 18 40 28 58 40z" fill="url(#horn)"/>
    <path d="M362 150c22-18 30-46 22-74-18 18-40 28-58 40z" fill="url(#horn)"/>
    <circle cx="300" cy="200" r="84" fill="url(#skin)"/>
    <ellipse cx="300" cy="150" rx="52" ry="20" fill="#fff" opacity=".14"/>
    <path d="M246 172q22-16 40 0" fill="none" stroke="#4a0a1c" stroke-width="7" stroke-linecap="round"/>
    <path d="M314 172q22-16 40 0" fill="none" stroke="#4a0a1c" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="268" cy="194" rx="15" ry="17" fill="#fff"/><ellipse cx="332" cy="194" rx="15" ry="17" fill="#fff"/>
    <circle cx="272" cy="198" r="7" fill="#1e0510"/><circle cx="336" cy="198" r="7" fill="#1e0510"/>
    <circle cx="275" cy="195" r="2.4" fill="#fff"/><circle cx="339" cy="195" r="2.4" fill="#fff"/>
    <path d="M250 228q50 46 100 0q-50 20-100 0z" fill="#4a0a1c"/>
    <path d="M268 234l7 13 7-11zM318 236l7 11 7-13z" fill="#fff"/>
    <ellipse cx="240" cy="226" rx="12" ry="7" fill="#ff9aa5" opacity=".55"/><ellipse cx="360" cy="226" rx="12" ry="7" fill="#ff9aa5" opacity=".55"/>
  </g>

  <!-- candele -->
  <g filter="url(#shadow)">
    <rect x="66" y="210" width="40" height="98" rx="7" fill="url(#wax)"/>
    <path d="M86 210c-4 0-5 8 0 10s4-10 0-10z" fill="#d9c8a4"/>
    <ellipse cx="86" cy="186" rx="20" ry="26" fill="#ffcf6e" opacity=".55" filter="url(#halo)"/>
    <path d="M86 166c8 10 13 17 13 25a13 13 0 0 1-26 0c0-8 6-14 13-25z" fill="url(#flame)"/>
    <rect x="494" y="196" width="40" height="112" rx="7" fill="url(#wax)"/>
    <ellipse cx="514" cy="172" rx="20" ry="26" fill="#ffcf6e" opacity=".55" filter="url(#halo)"/>
    <path d="M514 152c8 10 13 17 13 25a13 13 0 0 1-26 0c0-8 6-14 13-25z" fill="url(#flame)"/>
  </g>

  <!-- anime che volano -->
  <g opacity=".95">
    <use href="#soul" x="150" y="62" width="46" height="46" transform="rotate(-12 173 85)"/>
    <use href="#soul" x="412" y="52" width="40" height="40" transform="rotate(10 432 72)"/>
    <use href="#soul" x="128" y="130" width="28" height="28" opacity=".8"/>
    <use href="#soul" x="452" y="124" width="30" height="30" opacity=".8"/>
  </g>

  <!-- dadi -->
  <g filter="url(#shadow)">
    <g transform="rotate(-14 190 300)"><rect x="160" y="270" width="60" height="60" rx="13" fill="#fffaf0"/><circle cx="175" cy="285" r="6" fill="#c4173a"/><circle cx="190" cy="300" r="6" fill="#c4173a"/><circle cx="205" cy="315" r="6" fill="#c4173a"/></g>
    <g transform="rotate(12 410 300)"><rect x="380" y="270" width="60" height="60" rx="13" fill="#fffaf0"/><circle cx="395" cy="285" r="6" fill="#c4173a"/><circle cx="425" cy="285" r="6" fill="#c4173a"/><circle cx="395" cy="315" r="6" fill="#c4173a"/><circle cx="425" cy="315" r="6" fill="#c4173a"/></g>
  </g>
</svg>
