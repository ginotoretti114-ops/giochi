<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piccante</title>
<meta name="description" content="Gioco di carte a prese da 2 a 8 giocatori: scommetti quante prese farai, ogni errore è un peperoncino.">
<meta name="theme-color" content="#131833">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath d='M5.6 7.6c3.2-1.6 7-.4 8.9 2.7 1.6 2.6 1.3 5.9-.7 8.1-.5.5-1.3.2-1.2-.5.2-2.2-.8-4.3-2.6-5.6-1.3-1-2.9-1.5-4.4-1.4-1 .1-1.5-1.2-.6-1.8z' fill='%23e2412e'/%3E%3Cpath d='M8 7.2c.2-1.9 1.5-3.4 3.4-3.9M5.2 8.3c1-1.6 3.4-2.1 5-1' fill='none' stroke='%237cbf4f' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Rozha+One&display=swap">
<style>
:root {
  /* Piccante: la notte indaco della sala giochi; carte color crema con una fascia che scalda dal verde al rosso. */
  /* Layout: una colonna (max 560px): missione e avversari in alto, il tavolo con la presa al centro, la tua mano e le mosse in basso. */
  --table: #131833;
  --panel: #1b2246;
  --raise: #283161;
  --line: #3b4784;
  --text: #f6eedd;
  --muted: #b3b5d4;
  --saffron: #f5aa3e;
  --on-saffron: #2a1903;
  --bad: #ff9f8a;
  --good: #7ad7a2;
  --expert: #e25563;
  --font-display: "Rozha One", Georgia, "Times New Roman", serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--table);
  background-image:
    radial-gradient(circle, rgba(245, 170, 62, .09) 1.6px, transparent 2.2px),
    radial-gradient(circle, rgba(255, 255, 255, .045) 1px, transparent 1.6px);
  background-size: 24px 24px, 24px 24px;
  background-position: 0 0, 12px 12px;
  color: var(--text);
  font: 16px/1.4 var(--font-body);
  -webkit-text-size-adjust: 100%;
}
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#app { max-width: 560px; margin: 0 auto; padding: 0 16px; min-height: 100%; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.center { text-align: center; }
.err { color: var(--bad); }

/* ---------- carte ---------- */
.pc {
  --w: 60px; --hb: #e0b52c; --hi: #87650a;
  position: relative; flex: none; width: var(--w); aspect-ratio: 5 / 7; margin: 0; padding: 0; border: 0; overflow: hidden;
  border-radius: calc(var(--w) * .12); display: grid; place-items: center;
  background: linear-gradient(172deg, #fffaf0 0%, #f4e6cb 100%);
  color: var(--hi);
  box-shadow: inset 0 0 0 1px rgba(90, 55, 10, .2), 0 2px 0 rgba(0, 0, 0, .35), 0 5px 12px rgba(0, 0, 0, .25);
  font-family: var(--font-display); user-select: none; -webkit-user-select: none;
  transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.pc::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 19%; background: var(--hb); }
.pc::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5%; background: var(--hb); }
.pc .num { font-size: calc(var(--w) * .5); line-height: 1; margin-top: calc(var(--w) * .2); letter-spacing: -.02em; }
.pc .hl { position: absolute; z-index: 1; top: calc(var(--w) * .035); left: 0; right: 0; display: flex; justify-content: center; gap: 1px; color: #fffaf0; }
.pc .hl svg { width: calc(var(--w) * .15); height: calc(var(--w) * .15); }
.pc.h1 { --hb: #6fae46; --hi: #3d7420; }
.pc.h2 { --hb: #e0b52c; --hi: #87650a; }
.pc.h3 { --hb: #ee8a32; --hi: #a9500d; }
.pc.h4 { --hb: #df4a33; --hi: #ad2c18; }
.pc.h5 { --hb: #a8213b; --hi: #8c142d; }
.pc.joker { background: radial-gradient(circle at 50% 38%, #3d438f 0%, #1f2352 72%); color: var(--saffron); box-shadow: inset 0 0 0 1.5px rgba(245, 170, 62, .6), 0 2px 0 rgba(0, 0, 0, .35), 0 5px 12px rgba(0, 0, 0, .25); }
.pc.joker::before, .pc.joker::after { display: none; }
.pc.joker .fl { width: 44%; height: auto; margin-top: calc(var(--w) * -.12); }
.pc.joker .num { margin: 0 0 calc(var(--w) * .12); }
.pc.joker .lb { position: absolute; left: 0; right: 0; bottom: calc(var(--w) * .1); text-align: center; font: 700 calc(var(--w) * .14)/1 var(--font-body); text-transform: uppercase; letter-spacing: .06em; }
.pc.joker .rg { position: absolute; left: 0; right: 0; top: calc(var(--w) * .09); text-align: center; font: 700 calc(var(--w) * .13)/1 var(--font-body); opacity: .85; }
.pc.back {
  background:
    radial-gradient(circle at 50% 50%, transparent 0 20%, rgba(245, 170, 62, .85) 21% 26%, transparent 27%),
    repeating-linear-gradient(45deg, #262f5e 0 5px, #1d2550 5px 10px);
  box-shadow: inset 0 0 0 1.5px rgba(245, 170, 62, .45), 0 2px 0 rgba(0, 0, 0, .35), 0 5px 12px rgba(0, 0, 0, .25);
}
.pc.back::before, .pc.back::after { display: none; }
.pc.mini { --w: 26px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(90, 55, 10, .3); }
.pc.mini::before { height: 15%; }
.pc.mini::after, .pc.mini .hl, .pc.mini .lb, .pc.mini .rg, .pc.mini .fl { display: none; }
.pc.mini .num { font-size: calc(var(--w) * .5); margin-top: calc(var(--w) * .14); }
.pc.mini.joker .num { margin: 0; }
.pc.mini.back { box-shadow: inset 0 0 0 1px rgba(245, 170, 62, .45); }
.pc.empty { background: none; box-shadow: none; border: 1.5px dashed var(--line); }
.pc.empty::before, .pc.empty::after { display: none; }
button.pc { cursor: pointer; }
button.pc:disabled { cursor: default; }
button.pc.pick { box-shadow: inset 0 0 0 1px rgba(90, 55, 10, .2), 0 0 0 2px rgba(245, 170, 62, .6), 0 6px 14px rgba(0, 0, 0, .3); }
button.pc[aria-pressed="true"] { transform: translateY(-10px); box-shadow: inset 0 0 0 1px rgba(90, 55, 10, .2), 0 0 0 3px var(--saffron), 0 12px 20px rgba(0, 0, 0, .45); }
button.pc.off { filter: saturate(.4) brightness(.62); }
button.pc:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
@keyframes land { 0% { transform: translateY(-26px) scale(1.08); opacity: 0; } 100% { transform: none; opacity: 1; } }
.pc.land { animation: land .35s cubic-bezier(.2, .8, .2, 1) both; }

/* ---------- lobby ---------- */
.hubnav { padding-top: 6px; }
.hubnav a { text-decoration: none; display: inline-block; }
.brand { text-align: center; padding: 18px 0 8px; }
.fan { display: flex; justify-content: center; align-items: flex-start; height: 108px; margin-bottom: 6px; }
.fan .pc { --w: 60px; margin: 0 -7px; transform: translateY(var(--y)) rotate(var(--r)); transform-origin: 50% 130%; }
.brand h1 { font: 52px/1 var(--font-display); margin: 4px 0 0; }
.brand h1 span { color: var(--saffron); }
.brand .tag { color: var(--muted); margin: 8px auto 0; max-width: 36ch; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 14px 0 0; display: grid; gap: 10px; }
.h2 { font: 22px/1.15 var(--font-display); margin: 0; }
.lab { font-size: 14px; color: var(--muted); }
.field { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--table); color: var(--text); font: 17px/1.2 var(--font-body); }
.field:focus-visible { outline: 3px solid var(--saffron); outline-offset: 1px; }
.field.share { font-size: 14px; color: var(--muted); }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 9px 13px; font-weight: 700; font-size: 15px; color: var(--muted); cursor: pointer; min-width: 48px; }
.seg button[aria-pressed="true"] { background: var(--saffron); color: var(--on-saffron); }
.seg button:focus-visible { outline: 3px solid #fff; outline-offset: -3px; }
.modehelp { margin: -2px 0 0; font-size: 13px; color: var(--muted); }
.net { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.net i, .netdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.net.up i, .netdot.up { background: var(--good); box-shadow: 0 0 0 3px rgba(122, 215, 162, .18); }
.net.down i, .netdot.down, .net.off i, .netdot.off { background: var(--bad); }
.netdot { margin-left: 8px; vertical-align: 3px; }
.games { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.gitem { display: flex; align-items: stretch; gap: 6px; }
.gopen { flex: 1; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; text-align: left; padding: 11px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--raise); cursor: pointer; }
.gnames { font-weight: 700; }
.gstate { grid-column: 1; font-size: 14px; color: var(--muted); }
.gcta { grid-column: 2; grid-row: 1 / span 2; font-weight: 700; font-size: 14px; padding: 7px 11px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
.gitem.hot .gopen { border-color: var(--saffron); }
.gitem.hot .gstate { color: var(--saffron); }
.gitem.hot .gcta { background: var(--saffron); color: var(--on-saffron); border-color: var(--saffron); }
.icon-btn { width: 44px; flex: none; display: grid; place-items: center; border-radius: 12px; border: 1.5px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.icon-btn svg { width: 20px; height: 20px; }
.howto ol { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.howto li::marker { color: var(--saffron); font-weight: 700; }
.note { text-align: center; font-size: 13px; color: var(--muted); max-width: 44ch; margin: 18px auto 0; line-height: 1.45; }
.foot { text-align: center; margin: 14px 0 28px; }
.seated { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.seated li { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; background: var(--raise); }
.seated .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--table); font-weight: 700; font-size: 13px; }
.seated .tag { margin-left: auto; font-size: 13px; color: var(--muted); }
.names { display: grid; gap: 8px; }
.names .row { display: flex; gap: 6px; }
.names .row .field { flex: 1; }

/* ---------- pulsanti ---------- */
.btn { appearance: none; border: 1.5px solid var(--line); background: var(--raise); color: var(--text); border-radius: 12px; padding: 12px 14px; font: 700 15px/1.15 var(--font-body); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; touch-action: manipulation; }
.btn.primary { background: var(--saffron); border-color: var(--saffron); color: var(--on-saffron); }
.btn.wide { width: 100%; }
.btn.sm { min-height: 38px; padding: 7px 12px; font-size: 14px; }
.btn:disabled { opacity: .42; cursor: default; }
.btn:focus-visible, .linkbtn:focus-visible, .gopen:focus-visible, .icon-btn:focus-visible, .chip-btn:focus-visible, .bidbtn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.linkbtn { background: none; border: 0; padding: 8px 4px; color: var(--muted); font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: none; }
.linkbtn.accent { color: var(--saffron); }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btnrow .btn { flex: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { border: 1.5px solid var(--line); background: var(--raise); border-radius: 999px; padding: 8px 14px; min-height: 40px; font-weight: 700; font-size: 14px; cursor: pointer; }
.chip-btn[aria-pressed="true"] { background: var(--saffron); color: var(--on-saffron); border-color: var(--saffron); }

/* ---------- tavolo ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0 2px; }
.topbar .round { font: 17px/1 var(--font-display); white-space: nowrap; }
.topbar .right { display: flex; gap: 2px; }
.banner { margin: 8px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--raise); border: 1px solid var(--line); font-size: 14px; display: grid; gap: 8px; }
.mission { margin-top: 8px; padding: 9px 12px 10px; border-radius: 14px; background: linear-gradient(135deg, #2b2457, #1b2246 70%); border: 1px solid var(--line); display: grid; gap: 3px; }
.mission.expert { border-color: var(--expert); }
.mission .mhd { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mission .mtag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 2px 7px; border-radius: 6px; background: var(--saffron); color: var(--on-saffron); }
.mission.expert .mtag { background: var(--expert); color: #2b0508; }
.mission .mname { font: 19px/1.15 var(--font-display); font-weight: 400; }
.mission .mcards { margin-left: auto; font-size: 13px; color: var(--muted); white-space: nowrap; }
.mission p { margin: 0; font-size: 14px; }
.opps { display: grid; gap: 8px; margin-top: 8px; grid-template-columns: 1fr 1fr; }
.opps.one { grid-template-columns: 1fr; }
.opp { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; min-width: 0; }
.opp.turn { border-color: var(--saffron); box-shadow: 0 0 0 1px var(--saffron); }
.opp .hd { display: flex; align-items: center; gap: 6px; min-width: 0; }
.opp .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opp .hd .pili { margin-left: auto; }
.opp .bt { display: flex; flex-wrap: wrap; gap: 0 10px; font-size: 13px; color: var(--muted); margin-top: 2px; }
.opp .bt b { color: var(--text); font-variant-numeric: tabular-nums; }
.opp .mg { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; }
.opp .nt { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
.opp .nt.ok { color: var(--good); }
.dl { display: inline-grid; place-items: center; flex: none; width: 19px; height: 19px; border-radius: 50%; background: var(--saffron); color: var(--on-saffron); font: 700 11px/1 var(--font-body); }
.pili { display: inline-flex; align-items: center; gap: 2px; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pili svg { width: 17px; height: 17px; flex: none; }
.pili b { color: var(--text); }
.pili.hot b { color: var(--bad); }
.status { font: 26px/1.1 var(--font-display); text-align: center; margin: 12px 0 2px; }
.status.is-turn { color: var(--saffron); }
.lastmove { text-align: center; font-size: 14px; color: var(--muted); margin: 0; min-height: 1.5em; }
.lastmove .pc.mini, .log .pc.mini { --w: 19px; display: inline-grid; vertical-align: -7px; margin: 0 1px; }
.table { margin: 10px 0 0; padding: 12px 10px 10px; border-radius: 18px; background: radial-gradient(ellipse at 50% 30%, #26326e, #1b2246 72%); border: 1px solid var(--line); display: grid; gap: 8px; justify-items: center; align-content: center; min-height: 112px; }
.slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.slot { display: grid; justify-items: center; gap: 4px; }
.slot .pc { --w: 52px; }
.slot .who { font-size: 12px; max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.slot.next .pc.empty { border-color: var(--saffron); }
.slot.win .pc { box-shadow: 0 0 0 3px var(--saffron), 0 6px 14px rgba(0, 0, 0, .35); }
.slot.win .who { color: var(--saffron); font-weight: 700; }
.slot.dim .pc { opacity: .5; }
.table .cap { margin: 0; font-size: 14px; text-align: center; }
.table .tally { margin: 0; font-size: 13px; color: var(--muted); text-align: center; }
.table .tally b { color: var(--text); }
.mine { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px 12px; margin-top: 12px; }
.mine.turn { border-color: var(--saffron); }
.mine .hd { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mine .nm { font-weight: 700; font-size: 17px; }
.mine .sc { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.mine .sc b { color: var(--text); font-variant-numeric: tabular-nums; }
.hand { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 14px 2px 2px; margin: 0 auto; }
.hand .pc { --w: var(--hw, 60px); }
.peek { margin: 8px 0 0; text-align: center; font-weight: 700; color: var(--saffron); }
.peek b { font: 28px/1 var(--font-display); vertical-align: -3px; }
.mine .tip { margin: 8px 0 0; text-align: center; }
.mine .btn { margin-top: 10px; }
.actions { position: sticky; bottom: 0; z-index: 2; margin: 14px -16px 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(19, 24, 51, .95); border-top: 1px solid var(--line); display: grid; gap: 8px; margin-top: auto; }
.spacer { flex: 1; min-height: 14px; }
.hint { margin: 0; font-size: 15px; color: var(--muted); }
.hint b { color: var(--text); }
.bids { display: flex; flex-wrap: wrap; gap: 6px; }
.bidbtn { flex: 1 0 46px; max-width: 72px; min-height: 48px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--raise); font: 24px/1 var(--font-display); cursor: pointer; padding: 6px 0 2px; touch-action: manipulation; }
.bidbtn:not(:disabled):hover { border-color: var(--saffron); }
.bidbtn:disabled { opacity: .35; text-decoration: line-through; cursor: default; }
.why { margin: 0; font-size: 13px; color: var(--muted); }
.jolly { display: flex; align-items: center; gap: 8px; }
.jolly input[type="range"] { flex: 1; min-width: 0; accent-color: var(--saffron); height: 36px; }
.jolly output { font: 28px/1 var(--font-display); min-width: 44px; text-align: center; color: var(--saffron); }

/* ---------- fogli ---------- */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(8, 10, 24, .7); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 88%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 20px 20px 0 0; padding: 20px 18px calc(22px + env(safe-area-inset-bottom)); display: grid; gap: 12px; }
.sheet h2 { font: 28px/1.1 var(--font-display); margin: 0; }
.sheet h3 { font-size: 15px; margin: 6px 0 0; color: var(--saffron); text-transform: uppercase; letter-spacing: .07em; }
.sheet p, .sheet ul { margin: 0; }
.sheet ul { padding-left: 20px; display: grid; gap: 6px; }
.eyebrow { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.tbl-wrap { overflow-x: auto; }
table.score { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.score th, table.score td { padding: 7px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: top; }
table.score th:first-child, table.score td:first-child { text-align: left; }
table.score thead th { color: var(--muted); font-size: 13px; font-weight: 700; }
table.score tr.win td { color: var(--saffron); font-weight: 700; }
table.score td.big { font: 22px/1 var(--font-display); }
table.score td.left { white-space: normal; }
table.score .det { display: block; font-size: 12px; font-weight: 400; color: var(--muted); white-space: normal; }
.log { list-style: none; padding: 0; margin: 0; }
.log li { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.log li.sep { color: var(--saffron); font-weight: 700; }
.cardrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.cardrow .pc { --w: 44px; }
dl.ms { margin: 0; display: grid; gap: 6px; }
dl.ms dt { font-weight: 700; }
dl.ms dd { margin: -4px 0 0; color: var(--muted); font-size: 15px; }

@media (prefers-reduced-motion: reduce) { .pc, .pc.land { animation: none; transition: none; } }
@media (max-width: 380px) { .opp { padding: 7px 9px; } .opp .bt { font-size: 12px; } }
</style>
</head>
<body>
<svg class="defs" aria-hidden="true" focusable="false">
  <symbol id="chili" viewBox="0 0 20 20">
    <path d="M5.6 7.6c3.2-1.6 7-.4 8.9 2.7 1.6 2.6 1.3 5.9-.7 8.1-.5.5-1.3.2-1.2-.5.2-2.2-.8-4.3-2.6-5.6-1.3-1-2.9-1.5-4.4-1.4-1 .1-1.5-1.2-.6-1.8z" fill="#e8462f"/>
    <path d="M8 7.2c.2-1.9 1.5-3.4 3.4-3.9M5.2 8.3c1-1.6 3.4-2.1 5-1" fill="none" stroke="#7cc04f" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  <symbol id="chili1" viewBox="0 0 20 20">
    <path d="M5.6 7.6c3.2-1.6 7-.4 8.9 2.7 1.6 2.6 1.3 5.9-.7 8.1-.5.5-1.3.2-1.2-.5.2-2.2-.8-4.3-2.6-5.6-1.3-1-2.9-1.5-4.4-1.4-1 .1-1.5-1.2-.6-1.8z" fill="currentColor"/>
    <path d="M8 7.2c.2-1.9 1.5-3.4 3.4-3.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  <symbol id="flame" viewBox="0 0 40 40"><path d="M20.5 3c1.6 6.4 9.5 9.6 9.5 19a10 10 0 0 1-20 0c0-4.6 2.2-7.8 4.6-9.9-.1 3.2 1 5.6 3.2 6.8-1.3-6.6.4-11.9 2.7-15.9z" fill="currentColor"/><path d="M20 24c1.6 2.2 4 3.4 4 6.2a4 4 0 0 1-8 0c0-2.5 2.2-3.5 4-6.2z" fill="#1f2352"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 11v5.5M14 11v5.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>
<div id="app"></div>
<div id="layer"></div>
<script src="motore.js"></script>
<script src="../lib/mqtt.min.js"></script>
<script src="../lib/stanze.js"></script>
<script>
(function () {
  'use strict';
  var K = window.Piccante, J = K.JOKER;
  var $app = document.getElementById('app');
  var $layer = document.getElementById('layer');
  var LS = {
    get: function (k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* niente memoria */ } },
    del: function (k) { try { window.localStorage.removeItem(k); } catch (e) { /* idem */ } }
  };
  function loadJSON(k, d) { try { var v = JSON.parse(LS.get(k) || 'null'); return v == null ? d : v; } catch (e) { return d; } }
  function rnd36(n) { var o = '', a = 'abcdefghijklmnopqrstuvwxyz0123456789'; for (var i = 0; i < n; i++) o += a[K.randInt(36)]; return o; }
  function range(n) { var a = []; for (var i = 0; i < n; i++) a.push(i); return a; }
  var MODES = [['nessuna', 'Nessuna'], ['base', 'Base'], ['tutte', 'Tutte']];
  var MODE_HELP = {
    nessuna: 'Regole di base, 5 carte a testa: ideale per imparare.',
    base: 'Ogni round una missione cambia le regole (26 missioni).',
    tutte: 'Anche le 14 missioni per esperti: 40 in tutto.'
  };

  var ui = {
    route: 'lobby', gameId: null, online: 'connecting',
    game: null, gameMissing: false, missTimer: null,
    local: null, sheet: null, sheetId: null, hideResultKey: null,
    name: LS.get('pc-name') || '',
    missions: (function () { var m = LS.get('pc-missions'); return m === 'nessuna' || m === 'tutte' ? m : 'base'; })(),
    localNames: (function () { var a = loadJSON('pc-lnames', null); return Array.isArray(a) && a.length >= 2 ? a.slice(0, 8) : ['', '', '']; })(),
    sel: [], selKey: null, target: -1, jv: 56, jvLock: false, viewer: -1,
    error: '', copied: false, animKey: null, pendingAnim: null,
    pending: null, pendingTimer: null, pendingJoin: null, peekTimer: null,
    peeks: loadJSON('pc-peeks', {})
  };
  if (!ui.peeks || typeof ui.peeks !== 'object' || Array.isArray(ui.peeks)) ui.peeks = {};
  ui.device = LS.get('pc-device');
  if (!ui.device) { ui.device = 'd' + rnd36(14); LS.set('pc-device', ui.device); }
  ui.myKey = 'd:' + ui.device;

  function validState(s) {
    return !!(s && s.app === 'piccante' && typeof s.v === 'number' && Array.isArray(s.seats) && s.seats.length >= 1 &&
      s.seats.length <= 8 && s.hands && typeof s.hands === 'object' && Array.isArray(s.deck) && Array.isArray(s.pilis) && typeof s.phase === 'string');
  }
  var net = window.Stanze ? window.Stanze({
    topic: 'piccante/v1', memoria: 'pc-', valida: validState,
    quandoArriva: function (id, prev, data) { onRoom(id, prev, data); },
    quandoCambiaRete: function (x) { ui.online = x; render(); }
  }) : null;

  /* ---------- testo ---------- */
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function nameOf(s, p) { return (s.seats[p] && s.seats[p].name) || ('Giocatore ' + (p + 1)); }
  function hn(s, p) { return esc(nameOf(s, p)); }
  function plural(n, a, b) { return n === 1 ? a : b; }
  function andList(a) { return a.length > 1 ? a.slice(0, -1).join(', ') + ' e ' + a[a.length - 1] : (a[0] || ''); }
  function orList(a) { return a.length > 1 ? a.slice(0, -1).join(', ') + ' o ' + a[a.length - 1] : String(a[0]); }
  function art(c) { return c === J ? 'il jolly' : ((c === 1 || c === 8 || c === 11) ? 'l\'' + c : 'il ' + c); }
  function dirName(d) { return d === 'L' ? 'sinistra' : 'destra'; }
  function sign(n) { return n > 0 ? '+' + n : (n < 0 ? '−' + (-n) : '0'); }
  function modeName(m) { for (var i = 0; i < MODES.length; i++) if (MODES[i][0] === m) return MODES[i][1].toLowerCase(); return m; }

  function missionInfo(m) {
    if (!m) return null;
    switch (m.type) {
      case 'pass': return { name: 'Passaparola', desc: 'Dopo le scommesse ognuno passa ' + (m.n === 1 ? 'una carta' : m.n + ' carte') + ' al vicino di ' + dirName(m.dir) + '.' };
      case 'passAll': return { name: 'Cambio di mano', desc: 'Dopo le scommesse ognuno passa tutta la mano al vicino di ' + dirName(m.dir) + '.' };
      case 'noBid': return { name: 'Numero vietato', desc: 'Nessuno può scommettere ' + m.v + '.' };
      case 'draw': return { name: 'Carta in più', desc: 'Dopo le scommesse ognuno pesca una carta a caso: si gioca una presa in più.' };
      case 'reveal': return { name: 'Carte in tavola', desc: 'Dopo le scommesse si gioca a carte scoperte: tutti vedono tutte le mani.' };
      case 'blindBid': return { name: 'Scommessa al buio', desc: 'Si scommette senza guardare le carte: le vedi a scommesse finite.' };
      case 'simul': return { name: 'Tutti insieme', desc: 'A ogni presa tutti scelgono la carta nello stesso momento.' };
      case 'reward': return { name: 'Premio', desc: 'Chi indovina si toglie tanti peperoncini quante le prese che aveva scommesso.' };
      case 'invert': return { name: 'Mondo alla rovescia', desc: 'Vince la carta più bassa: l\'1 batte tutte, il 55 perde sempre.' };
      case 'peek3': return { name: 'Tre secondi', desc: 'Prima di scommettere guardi le carte per 3 secondi; le rivedi a scommesse finite.' };
      case 'firstLast': return { name: 'Prima e ultima', desc: 'Chi vince la prima o l\'ultima presa prende un peperoncino in più per ciascuna.' };
      case 'forehead': return { name: 'Carte in fronte', desc: 'Durante le scommesse vedi le carte degli altri ma non le tue.' };
      case 'noCopy': return { name: 'Niente copie', desc: 'Non puoi scommettere lo stesso numero di chi ha scommesso subito prima di te.' };
      case 'swap': return { name: 'Scambio', desc: 'Chi vince una presa scambia una carta con un giocatore a scelta: ognuno sceglie la carta che dà.' };
      case 'extreme': return { name: 'Tutto o niente', desc: 'Si gioca sempre la propria carta più alta o la più bassa.' };
      case 'blindPlay': return { name: 'A memoria', desc: 'Guardi le carte per 3 secondi, poi scommesse e prese si fanno a carte coperte.' };
      case 'hot': return { name: 'Numeri piccanti', desc: 'Chi vince una presa con dentro ' + orList(m.nums) + ' prende un peperoncino in più per quella presa.' };
      case 'shared': return { name: 'In coppia', desc: 'Dopo le scommesse ognuno sceglie un altro giocatore: a fine round prende anche i suoi peperoncini.' };
    }
    return { name: 'Missione', desc: '' };
  }

  /* ---------- carte ---------- */
  function heat(c) { return Math.min(5, Math.ceil(c / 11)); }
  function cardLabel(c, jv) { return c === J ? (jv != null ? 'Jolly, vale ' + jv : 'Jolly') : String(c); }
  function chilis(n) { var o = ''; for (var i = 0; i < n; i++) o += '<svg aria-hidden="true" viewBox="0 0 20 20"><use href="#chili1"/></svg>'; return o; }
  // Una carta scoperta. opts: {mini, tag, attrs, cls, jv, style}
  function cardHTML(c, opts) {
    opts = opts || {};
    var cls = 'pc', inner;
    if (c === J) {
      cls += ' joker';
      if (opts.jv != null) inner = '<span class="num">' + opts.jv + '</span><span class="lb">jolly</span>';
      else if (opts.mini) inner = '<span class="num">J</span>';
      else inner = '<span class="rg">0–56</span><svg class="fl" aria-hidden="true" viewBox="0 0 40 40"><use href="#flame"/></svg><span class="lb">jolly</span>';
    } else {
      cls += ' h' + heat(c);
      inner = '<span class="hl">' + chilis(heat(c)) + '</span><span class="num">' + c + '</span>';
    }
    if (opts.mini) cls += ' mini';
    if (opts.cls) cls += ' ' + opts.cls;
    var tag = opts.tag || 'span';
    var a11y = /aria-label=/.test(opts.attrs || '') ? '' : ' aria-label="' + esc(cardLabel(c, opts.jv)) + '"';
    if (tag !== 'button') a11y += ' role="img"';
    return '<' + tag + ' class="' + cls + '"' + (opts.style ? ' style="' + opts.style + '"' : '') + ' ' + (opts.attrs || '') + a11y + '>' + inner + '</' + tag + '>';
  }
  function backHTML(opts) {
    opts = opts || {};
    var tag = opts.tag || 'span';
    var a11y = /aria-label=/.test(opts.attrs || '') ? '' : ' aria-label="Carta coperta"' + (tag !== 'button' ? ' role="img"' : '');
    return '<' + tag + ' class="pc back' + (opts.mini ? ' mini' : '') + (opts.cls ? ' ' + opts.cls : '') + '" ' + (opts.attrs || '') + a11y + '></' + tag + '>';
  }
  function minis(list) { return list.map(function (c) { return cardHTML(c, { mini: true }); }).join(''); }
  function piliHTML(n) {
    return '<span class="pili' + (n >= 5 ? ' hot' : '') + '" title="Peperoncini"><svg aria-hidden="true" viewBox="0 0 20 20"><use href="#chili"/></svg><b>' + n + '</b><span class="sr"> ' + plural(n, 'peperoncino', 'peperoncini') + '</span></span>';
  }
  function dealerBadge() { return '<span class="dl" title="Mazziere">M<span class="sr">azziere</span></span>'; }

  /* ---------- prospettiva ---------- */
  function cur() { return ui.route === 'local' ? ui.local : ui.game; }
  function persp(s) {
    if (s.mode === 'local') {
      var a = K.nextActor(s);
      var open = a >= 0 && (ui.viewer === a || (!!s.revealed && s.phase === 'play'));
      return { me: a >= 0 ? a : (ui.viewer >= 0 ? ui.viewer : s.dealer), seated: true, local: true, actor: a, open: open };
    }
    var seat = K.seatOf(s, ui.myKey);
    return { me: seat >= 0 ? seat : 0, seated: seat >= 0, local: false, actor: -1, open: seat >= 0 };
  }
  function isMe(P, p) { return !P.local && P.seated && p === P.me; }
  function who(s, P, p) { return isMe(P, p) ? 'te' : hn(s, p); }
  function opens(s, P, p) { return isMe(P, p) ? 'apri tu' : 'apre ' + hn(s, p); }
  function Who(s, P, p) { return (!P.local && P.seated && p === P.me) ? 'Tu' : hn(s, p); }
  function isMine(s, P) {
    if (!P.seated || s.status !== 'playing') return false;
    if (P.local) return P.open && P.actor >= 0;
    return K.waitingFor(s).indexOf(P.me) >= 0;
  }
  function phaseKey(s) { return s.round + '/' + s.phase + '/' + s.trickNo + '/' + (s.swap ? s.swap.winner + '>' + s.swap.target : ''); }

  /* ---------- chi vede cosa ---------- */
  function gameKey(s) { return s.mode === 'local' ? 'L' + s.createdAt : ui.gameId; }
  function peekKey(s, seat) { return gameKey(s) + ':' + s.round + ':' + seat; }
  function peekLeft(s, seat) { var t = ui.peeks[peekKey(s, seat)]; return t ? Math.max(0, 3000 - (Date.now() - t)) : -1; } // -1: non ancora guardate
  function peekMission(s) { var t = K.mtype(s); return s.status === 'playing' && ((t === 'peek3' && s.phase === 'bid') || t === 'blindPlay'); }
  function ownVisible(s, seat) {
    if (s.status !== 'playing') return true;
    var t = K.mtype(s);
    if (s.phase === 'bid' && (t === 'blindBid' || t === 'forehead')) return false;
    if (peekMission(s)) return peekLeft(s, seat) > 0;
    return true;
  }
  function othersVisible(s) {
    if (s.status !== 'playing') return false;
    return (K.mtype(s) === 'forehead' && s.phase === 'bid') || !!s.revealed;
  }
  // Cosa fa la mia mano adesso: 'play', 'pass', 'swap' o niente.
  function handMode(s, P) {
    if (!isMine(s, P)) return null;
    if (!P.local && ui.online !== 'up') return null;
    var me = P.me;
    if (s.phase === 'play') return K.mtype(s) === 'simul' && s.sim[me] != null ? null : 'play';
    if (s.phase === 'pass') return s.passSel[me] == null ? 'pass' : null;
    if (s.phase === 'swapPick' || s.phase === 'swapGive') return 'swap';
    return null;
  }
  function playable(s, me, c) { return c === J || K.validate(s, me, { type: 'play', card: c }) === null; }
  function defaultJv(s) { return K.mtype(s) === 'invert' ? 0 : 56; }
  function syncSel(s, P) {
    var key = gameKey(s) + '/' + phaseKey(s) + '/' + P.me;
    if (ui.selKey !== key) { ui.selKey = key; ui.sel = []; ui.target = -1; ui.jvLock = false; }
    var hand = s.hands[P.me] || [];
    ui.sel = ui.sel.filter(function (c) { return hand.indexOf(c) >= 0; });
  }
  function bestSoFar(s) {
    var t = s.trick;
    if (!t || !t.plays.length) return null;
    var inv = K.mtype(s) === 'invert', b = t.plays[0];
    t.plays.forEach(function (p) { if (inv ? p.v < b.v : p.v > b.v) b = p; });
    return b;
  }
  function playName(s, P, p) {
    var mine = !P.local && P.seated && p.s === P.me;
    if (p.c === J) return (mine ? 'il tuo jolly' : 'il jolly di ' + hn(s, p.s)) + ' (' + p.v + ')';
    return mine ? 'il tuo ' + p.c : art(p.c) + ' di ' + hn(s, p.s);
  }

  function describe(e, s, P) {
    switch (e.t) {
      case 'round': {
        var mi = e.m ? missionInfo(K.BY_ID[e.m]) : null;
        return 'Round ' + e.r + ' · ' + (isMe(P, e.d) ? 'sei tu il mazziere' : 'mazziere ' + hn(s, e.d)) + (mi ? ' · «' + mi.name + '»' : '');
      }
      case 'bid': return (!P.local && P.seated && e.s === P.me ? 'Hai scommesso ' : hn(s, e.s) + ' scommette ') + e.n;
      case 'passed': return 'Carte passate a ' + dirName(e.dir);
      case 'designated': return 'Tutti hanno scelto il compagno';
      case 'trick': return 'Presa ' + e.no + ' a ' + who(s, P, e.w) + ' ' + e.c.map(function (c) { return cardHTML(c, { mini: true, jv: c === J ? e.j : null }); }).join('');
      case 'swap': return Who(s, P, e.w) + (!P.local && P.seated && e.w === P.me ? ' hai' : ' ha') + ' scambiato una carta con ' + who(s, P, e.to);
      case 'end': return 'Fine del round ' + e.r;
    }
    return '';
  }

  /* ---------- HTML del tavolo ---------- */
  function topbarHTML(s, P) {
    return '<header class="topbar"><button class="linkbtn" data-act="lobby">‹ ' + (P.local ? 'Esci' : 'Partite') + '</button>' +
      '<span class="round">Round ' + s.round + (P.local ? '' : netDot()) + '</span>' +
      '<span class="right"><button class="linkbtn" data-act="scores">Punti</button><button class="linkbtn" data-act="log">Storico</button><button class="linkbtn" data-act="rules">Regole</button></span></header>';
  }
  function bannersHTML(s, P) {
    var h = '';
    if (!P.local && !P.seated && s.status !== 'waiting') {
      h += '<div class="banner"><span>Stai guardando. Sei uno dei giocatori? Riprendi il tuo posto:</span><span class="btnrow">' +
        s.seats.map(function (x, i) { return '<button class="btn sm" data-act="claim" data-seat="' + i + '">' + hn(s, i) + '</button>'; }).join('') + '</span></div>';
    }
    if (!P.local && (ui.online === 'down' || ui.online === 'off')) h += '<div class="banner">Connessione persa: riprovo da solo. Le mosse ripartono appena torna la rete.</div>';
    return h;
  }
  function missionHTML(s) {
    var m = K.mission(s), N = s.N;
    var cards = N + ' ' + plural(N, 'carta', 'carte') + ' a testa' + (m && m.type === 'draw' ? ' + 1' : '');
    if (!m) return '<section class="mission"><div class="mhd"><b class="mname">Senza missione</b><span class="mcards">' + cards + '</span></div></section>';
    var i = missionInfo(m);
    return '<section class="mission' + (m.expert ? ' expert' : '') + '" aria-label="Missione del round"><div class="mhd"><span class="mtag">' + (m.expert ? 'Esperti' : 'Missione') +
      '</span><b class="mname">' + i.name + '</b><span class="mcards">' + cards + '</span></div><p>' + i.desc + '</p></section>';
  }
  function bidTxt(s, p) { return s.bids && s.bids[p] != null ? String(s.bids[p]) : '–'; }
  function oppNote(s, p) {
    if (s.status !== 'playing') return '';
    var mt = K.mtype(s), t = '', ok = false;
    if (s.phase === 'pass') { ok = s.passSel[p] != null; t = ok ? 'carte scelte' : 'sceglie le carte…'; }
    else if (s.phase === 'designate') { ok = s.designated[p] != null; t = ok ? 'ha scelto' : 'sceglie il compagno…'; }
    else if (s.phase === 'play' && mt === 'simul') { ok = s.sim[p] != null; t = ok ? 'carta pronta' : 'sceglie la carta…'; }
    else if (mt === 'shared' && s.designated[p] != null) t = 'in coppia con ' + hn(s, s.designated[p]);
    return t ? '<p class="nt' + (ok ? ' ok' : '') + '">' + (ok ? '✓ ' : '') + t + '</p>' : '';
  }
  function oppHTML(s, p, P) {
    var playing = s.status === 'playing';
    var acting = playing && K.waitingFor(s).indexOf(p) >= 0;
    var show = playing && othersVisible(s) && (!P.local || P.open);
    var hand = s.hands[p] || [];
    return '<section class="opp' + (acting ? ' turn' : '') + '" aria-label="' + hn(s, p) + '">' +
      '<div class="hd"><span class="nm">' + hn(s, p) + '</span>' + (s.dealer === p ? dealerBadge() : '') + piliHTML(s.pilis[p] || 0) + '</div>' +
      '<div class="bt"><span>scommessa <b>' + bidTxt(s, p) + '</b></span><span>prese <b>' + ((s.won && s.won[p]) || 0) + '</b></span></div>' +
      (show && hand.length ? '<div class="mg">' + minis(hand) + '</div>' : '') + oppNote(s, p) + '</section>';
  }
  function statusText(s, P) {
    if (s.status === 'gameOver') return { t: 'Partita finita' };
    if (s.status === 'roundEnd') return { t: 'Round ' + s.round + ' finito' };
    if (P.local && !P.open) return { t: 'Tocca a ' + hn(s, P.actor), hot: true };
    var mine = isMine(s, P), mt = K.mtype(s);
    switch (s.phase) {
      case 'bid': return mine ? { t: 'Quante prese farai?', hot: true } : { t: 'Scommette ' + hn(s, s.turn) };
      case 'pass': return mine && s.passSel[P.me] == null ? { t: 'Scegli le carte da passare', hot: true } : { t: 'Si passano le carte' };
      case 'designate': return mine && s.designated[P.me] == null ? { t: 'Scegli il tuo compagno', hot: true } : { t: 'Si scelgono i compagni' };
      case 'play':
        if (mt === 'simul') return mine ? { t: 'Scegli la tua carta', hot: true } : { t: 'Tutti scelgono una carta' };
        return mine ? { t: P.local ? 'Tocca a ' + hn(s, P.me) : 'Tocca a te', hot: true } : { t: 'Tocca a ' + hn(s, s.turn) };
      case 'swapPick': return mine ? { t: 'Scegli lo scambio', hot: true } : { t: hn(s, s.swap.winner) + ' sceglie uno scambio' };
      case 'swapGive': return mine ? { t: 'Scegli cosa dare', hot: true } : { t: hn(s, s.swap.target) + ' sceglie cosa dare' };
    }
    return { t: '' };
  }
  function statusHTML(s, P) {
    var st = statusText(s, P);
    var last = (s.log || [])[(s.log || []).length - 1];
    return '<div class="status' + (st.hot ? ' is-turn' : '') + '" id="status" aria-live="polite">' + st.t + '</div><p class="lastmove">' + (last ? describe(last, s, P) : '') + '</p>';
  }
  function shortName(s, P, q) { return (!P.local && P.seated && q === P.me) ? 'Tu' : hn(s, q); }
  function tableHTML(s, P, anim) {
    var mt = K.mtype(s), t = s.trick, L = s.lastTrick, slots = '', cap = '';
    var anySim = mt === 'simul' && s.sim && Object.keys(s.sim).some(function (k) { return s.sim[k] != null; });

    var P = persp(s), seat = P.me;
    if (P.local) {
      var r = K.act(s, seat, move);
      if (!r.ok) { ui.error = r.error; render(); return; }
      ui.local = r.state; ui.error = ''; ui.sel = []; ui.target = -1; ui.jvLock = false;
      saveLocal(); render();
      return;
    }
    var together = move.type === 'pass' || move.type === 'designate' || (move.type === 'play' && K.mtype(s) === 'simul');
    var key = phaseKey(s);
    var ok = writeGame(function (c) { return K.act(c, seat, move); }, together ? {} : { expectV: s.v });
    if (ok && together) ui.pending = { id: ui.gameId, key: key, seat: seat, move: move };
  }
  function transition(fnName) {
    if (ui.route === 'local') {
      var r = K[fnName](ui.local); if (!r.ok) return;
      ui.local = r.state; ui.hideResultKey = null; ui.viewer = -1; saveLocal(); render(); return;
    }
    var s = ui.game; if (!s) return;
    writeGame(function (c) { return K[fnName](c); }, { expectV: s.v });
  }
  function readNames() {
    ui.localNames = ui.localNames.map(function (n, i) { var el = document.getElementById('ln-' + i); return el ? el.value : n; });
    LS.set('pc-lnames', JSON.stringify(ui.localNames));
  }
  function savePeeks() {
    var ks = Object.keys(ui.peeks);
    while (ks.length > 40) delete ui.peeks[ks.shift()];
    LS.set('pc-peeks', JSON.stringify(ui.peeks));
  }
  function setJv(v) { ui.jv = Math.max(0, Math.min(56, v)); }
  function updateJolly() {
    var s = cur(); if (!s) return;
    var e = K.validate(s, persp(s).me, { type: 'play', card: J, jv: ui.jv });
    var o = document.getElementById('jv-out'); if (o) o.textContent = ui.jv;
    var b = document.getElementById('jv-go'); if (b) { b.textContent = 'Gioca il jolly come ' + ui.jv; b.disabled = !!e; }
    var m = document.getElementById('jv-err'); if (m) m.textContent = e || '';
  }

  var actions = {
    lobby: function () { go(''); },
    'go-local': function () { go('#locale'); },
    open: function (el) { go('#partita-' + el.dataset.id); },
    'new': createGame,
    missions: function (el) { if (ui.route === 'local') readNames(); ui.missions = el.dataset.m; LS.set('pc-missions', ui.missions); render(); },
    'ask-del': function (el) { ui.sheet = 'del'; ui.sheetId = el.dataset.id; render(); },
    del: function () { var id = ui.sheetId; ui.sheet = null; if (net && id) net.togli(id); render(); },
    close: function () { ui.sheet = null; render(); },
    rules: function () { ui.sheet = 'rules'; render(); },
    log: function () { ui.sheet = 'log'; render(); },
    scores: function () { ui.sheet = 'scores'; render(); },
    'hide-result': function () { ui.hideResultKey = resultKey(cur()); ui.error = ''; render(); },
    'show-result': function () { ui.hideResultKey = null; render(); },
    share: function () {
      var s = ui.game, text = (s ? nameOf(s, s.host) : 'Un amico') + ' ti invita a Piccante: apri il link e siediti al tavolo.';
      if (navigator.share) navigator.share({ title: 'Piccante', text: text, url: shareUrl(ui.gameId) }).catch(function () { /* annullato */ });
      else actions.copy();
    },
    copy: function () {
      var done = function () { ui.copied = true; render(); setTimeout(function () { ui.copied = false; render(); }, 2200); };
      var fallback = function () { var el = document.getElementById('share-url'); if (el) { el.focus(); el.select(); } };
      try { navigator.clipboard.writeText(shareUrl(ui.gameId)).then(done, fallback); } catch (e) { fallback(); }
    },
    join: function () {
      var name = (ui.name || '').trim() || 'Giocatore';
      LS.set('pc-name', name);
      var key = ui.myKey;
      if (writeGame(function (c) { return K.join(c, key, name); })) ui.pendingJoin = { id: ui.gameId, name: name };
    },
    start: function () { var s = ui.game; if (s) writeGame(function (c) { return K.startGame(c); }, { expectV: s.v }); },
    claim: function (el) { var seat = +el.dataset.seat, key = ui.myKey; writeGame(function (c) { return K.addSeatKey(c, seat, key); }); },
    unlock: function () { var s = ui.local; if (!s) return; ui.viewer = K.nextActor(s); ui.sel = []; ui.error = ''; render(); window.scrollTo(0, 0); },
    peek: function () { var s = cur(); if (!s) return; ui.peeks[peekKey(s, persp(s).me)] = Date.now(); savePeeks(); render(); },
    bid: function (el) { play({ type: 'bid', n: +el.dataset.n }); },
    card: function (el) {
      var s = cur(); if (!s) return;
      var P = persp(s), mode = handMode(s, P);
      if (!mode || ui.jvLock) return;
      var c = el.dataset.card === J ? J : +el.dataset.card;
      var k = ui.sel.indexOf(c);
      if (mode === 'pass') {
        var need = K.mission(s).n;
        if (k >= 0) ui.sel.splice(k, 1); else { ui.sel.push(c); if (ui.sel.length > need) ui.sel.shift(); }
      } else {
        ui.sel = k >= 0 ? [] : [c];
        if (c === J) setJv(defaultJv(s));
      }
      ui.error = '';
      render();
    },
    unselect: function () { ui.sel = []; render(); },
    'pass-go': function () { play({ type: 'pass', cards: ui.sel.slice() }); },
    designate: function (el) { play({ type: 'designate', target: +el.dataset.seat }); },
    target: function (el) { ui.target = +el.dataset.seat; render(); },
    'play-go': function () {
      var s = cur(); if (!s) return;
      var P = persp(s), c = ui.sel[0];
      if (c == null) return;
      if (c === J) {
        if (!ownVisible(s, P.me) && !ui.jvLock) { ui.jvLock = true; setJv(defaultJv(s)); render(); return; } // carta coperta: si scopre solo ora che è il jolly
        play({ type: 'play', card: J, jv: ui.jv });
        return;
      }
      play({ type: 'play', card: c });
    },
    'swap-go': function () {
      var s = cur(); if (!s || ui.sel[0] == null) return;
      if (s.phase === 'swapPick') play({ type: 'swapPick', target: ui.target, card: ui.sel[0] });
      else play({ type: 'swapGive', card: ui.sel[0] });
    },
    jv: function (el) { setJv(ui.jv + (+el.dataset.d)); render(); },
    'jv-set': function (el) { setJv(+el.dataset.v); render(); },
    'next-round': function () { transition('nextRound'); },
    rematch: function () { transition('rematch'); },
    'ln-add': function () { readNames(); if (ui.localNames.length < 8) ui.localNames.push(''); LS.set('pc-lnames', JSON.stringify(ui.localNames)); render(); },
    'ln-del': function (el) { readNames(); ui.localNames.splice(+el.dataset.i, 1); LS.set('pc-lnames', JSON.stringify(ui.localNames)); render(); },
    'local-start': function () {
      readNames();
      var names = ui.localNames.map(function (n, i) { return (n || '').trim() || 'Giocatore ' + (i + 1); });
      ui.local = K.startLocal(names, ui.missions); ui.viewer = -1; ui.hideResultKey = null; saveLocal(); render();
    },
    'local-reset': function () { ui.local = null; ui.viewer = -1; saveLocal(); ui.hideResultKey = null; if (ui.route === 'local') render(); else go('#locale'); }
  };

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    if (el.dataset.self && ev.target !== el) return;
    var fn = actions[el.dataset.act];
    if (fn) { ev.preventDefault(); fn(el, ev); }
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'nm') { ui.name = t.value; LS.set('pc-name', t.value); }
    else if (t.id === 'jv') { setJv(+t.value); updateJolly(); }
    else if (/^ln-\d+$/.test(t.id)) { ui.localNames[+t.id.slice(3)] = t.value; LS.set('pc-lnames', JSON.stringify(ui.localNames)); }
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && ui.sheet) { ui.sheet = null; render(); } });
  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var s = ui.route === 'lobby' ? null : cur();
      if (s && s.status !== 'waiting' && document.activeElement && document.activeElement.tagName !== 'INPUT') render();
    }, 150);
  });

  /* ---------- avvio ---------- */
  ui.local = loadLocal();
  route();
  if (net) net.avvia(); else { ui.online = 'off'; render(); }
})();
</script>
</body>
</html>
