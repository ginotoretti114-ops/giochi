    <radialGradient id="glow" cx="55%" cy="58%" r="60%">
      <stop offset="0" stop-color="#8a4fc4" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#3b2a6e" stop-opacity=".3"/>
      <stop offset="1" stop-color="#131833" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lilla" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#f3ecff"/><stop offset="1" stop-color="#c7b1fb"/></linearGradient>
    <linearGradient id="verde" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#eafcef"/><stop offset="1" stop-color="#a6e2b6"/></linearGradient>
    <linearGradient id="arancio" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#fff2df"/><stop offset="1" stop-color="#fbc57c"/></linearGradient>
    <linearGradient id="giallo" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#fffbe2"/><stop offset="1" stop-color="#eed96c"/></linearGradient>
    <linearGradient id="rosso" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#ffeaea"/><stop offset="1" stop-color="#f4a0a0"/></linearGradient>
    <linearGradient id="corno" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#c47a12"/><stop offset=".5" stop-color="#f5c542"/><stop offset="1" stop-color="#fff0b8"/></linearGradient>
    <linearGradient id="pelo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#ecdcf7"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
