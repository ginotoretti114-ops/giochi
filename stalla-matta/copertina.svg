<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Stalla Matta: un unicorno con la criniera arcobaleno davanti a un ventaglio di carte, accanto a una stalla di notte">
  <defs>
