      <rect x="-55" y="-80" width="110" height="160" rx="11" fill="none" stroke="#3a2700" stroke-opacity=".3"/>
      <text x="0" y="34" text-anchor="middle" font-size="96" fill="#3a2700">6</text>
      <use href="#m-S" x="-50" y="-75" width="22" height="22" color="#3a2700"/>
      <use href="#m-S" x="28" y="53" width="22" height="22" color="#3a2700" transform="rotate(180 39 64)"/>
      <use href="#frame"/>
    </g>
    <g transform="rotate(16 468 330) translate(468 200)">
      <rect x="-62" y="-87" width="124" height="174" rx="16" fill="url(#g-B)"/>
      <rect x="-55" y="-80" width="110" height="160" rx="11" fill="none" stroke="#fffaf0" stroke-opacity=".3"/>
