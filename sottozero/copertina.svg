      <use href="#m-B" x="-50" y="-75" width="22" height="22" color="#fffaf0"/>
      <use href="#m-B" x="28" y="53" width="22" height="22" color="#fffaf0" transform="rotate(180 39 64)"/>
      <use href="#frame"/>
    </g>
    <g transform="rotate(-8 216 330) translate(216 186)">
      <rect x="-62" y="-87" width="124" height="174" rx="16" fill="url(#g-R)"/>
      <rect x="-55" y="-80" width="110" height="160" rx="11" fill="none" stroke="#fffaf0" stroke-opacity=".3"/>
      <use href="#a-x" x="-34" y="-44" width="68" height="68" color="#fffaf0"/>
      <text x="0" y="62" text-anchor="middle" font-family="'Atkinson Hyperlegible', Arial, sans-serif" font-weight="700" font-size="17" letter-spacing="1" fill="#fffaf0">SALTA</text>
      <use href="#m-R" x="-50" y="-75" width="22" height="22" color="#fffaf0"/>
      <use href="#frame"/>
    </g>
    <g transform="rotate(8 384 330) translate(384 186)">
      <rect x="-62" y="-87" width="124" height="174" rx="16" fill="url(#g-MS)"/>
      <rect x="-55" y="-80" width="110" height="160" rx="11" fill="none" stroke="#fffaf0" stroke-opacity=".3"/>
      <text x="0" y="-2" text-anchor="middle" font-size="50" fill="#fffaf0">+2</text>
      <text x="0" y="48" text-anchor="middle" font-size="50" fill="#fffaf0">+2</text>
      <use href="#m-M" x="-50" y="-75" width="22" height="22" color="#fffaf0"/>
      <use href="#m-S" x="28" y="53" width="22" height="22" color="#fffaf0" transform="rotate(180 39 64)"/>
      <use href="#frame"/>
    </g>
    <g transform="translate(300 180)">
      <rect x="-62" y="-87" width="124" height="174" rx="16" fill="url(#g-M)"/>
      <rect x="-55" y="-80" width="110" height="160" rx="11" fill="none" stroke="#fffaf0" stroke-opacity=".3"/>
      <text x="0" y="36" text-anchor="middle" font-size="104" fill="#fffaf0">0</text>
      <use href="#m-M" x="-50" y="-75" width="22" height="22" color="#fffaf0"/>
      <use href="#m-M" x="28" y="53" width="22" height="22" color="#fffaf0" transform="rotate(180 39 64)"/>
