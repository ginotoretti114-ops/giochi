<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sottozero</title>
<meta name="description" content="Gioco di carte da 2 a 8 giocatori: scambia le carte della tua griglia e chiudi il round con meno punti possibile.">
<meta name="theme-color" content="#131833">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='12' y='4' width='40' height='56' rx='7' fill='%231f8fb0'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' font-family='Georgia' fill='%23fffaf0'%3E0%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Rozha+One&display=swap">
<style>
:root {
  /* Sottozero: la notte indaco della sala giochi, carte a tinta piena con un simbolo per colore, zafferano per il turno. */
  /* Layout: una colonna (max 560px): avversari in alto, banco al centro, la tua griglia e le mosse in basso. */
  --table: #131833;
  --panel: #1b2246;
  --raise: #283161;
  --line: #3b4784;
  --text: #f6eedd;
  --muted: #b3b5d4;
  --saffron: #f5aa3e;
  --on-saffron: #2a1903;
  --bad: #ff9f8a;
  --good: #7ad7a2;
  --font-display: "Rozha One", Georgia, "Times New Roman", serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --cM: #1f8fb0; --cS: #e3b23c; --cR: #c23f79; --cB: #3e9a5b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--table);
  background-image:
    radial-gradient(circle, rgba(245, 170, 62, .09) 1.6px, transparent 2.2px),
    radial-gradient(circle, rgba(255, 255, 255, .045) 1px, transparent 1.6px);
  background-size: 24px 24px, 24px 24px;
  background-position: 0 0, 12px 12px;
  color: var(--text);
  font: 16px/1.4 var(--font-body);
  -webkit-text-size-adjust: 100%;
}
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }
#app { max-width: 560px; margin: 0 auto; padding: 0 16px; min-height: 100%; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.err { color: var(--bad); }

/* ---------- carte ---------- */
.zc {
  --w: 64px; --k: #555; --ink: #fffaf0;
  position: relative; flex: none; width: var(--w); aspect-ratio: 5 / 7; margin: 0; padding: 0; border: 0;
  border-radius: calc(var(--w) * .13); display: grid; place-items: center;
  background: var(--k);
  background: linear-gradient(160deg, color-mix(in srgb, var(--k) 78%, #fff) 0%, var(--k) 48%, color-mix(in srgb, var(--k) 72%, #000) 100%);
  color: var(--ink);
  box-shadow: inset 0 0 0 1.5px rgba(255, 224, 160, .55), 0 2px 0 rgba(0, 0, 0, .35), 0 5px 12px rgba(0, 0, 0, .25);
  font-family: var(--font-display); user-select: none; -webkit-user-select: none;
  transition: transform .15s ease, box-shadow .15s ease;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.zc::before {
  content: ""; position: absolute; inset: calc(var(--w) * .06); border-radius: calc(var(--w) * .09); pointer-events: none;
  border: 1px solid rgba(255, 255, 255, .28);
  border: 1px solid color-mix(in srgb, var(--ink) 30%, transparent);
}
.k-M { --k: var(--cM); }
.k-S { --k: var(--cS); --ink: #3a2700; }
.k-R { --k: var(--cR); }
.k-B { --k: var(--cB); }
.zc.dbl { background: linear-gradient(135deg, var(--k1) 0 49.5%, var(--k2) 50.5% 100%); --ink: #fffaf0; }
.zc .num { font-size: calc(var(--w) * .6); line-height: 1; margin-top: calc(var(--w) * .06); }
.zc .num.sm { font-size: calc(var(--w) * .42); }
.zc .num.dd { font-size: calc(var(--w) * .3); line-height: 1.02; text-align: center; }
.zc .mk { position: absolute; width: calc(var(--w) * .2); height: calc(var(--w) * .2); }
.zc .mk.a { top: calc(var(--w) * .11); left: calc(var(--w) * .11); }
.zc .mk.b { bottom: calc(var(--w) * .11); right: calc(var(--w) * .11); transform: rotate(180deg); }
.zc .ico { width: 54%; height: auto; margin-top: calc(var(--w) * -.06); }
.zc .lb { position: absolute; left: 0; right: 0; bottom: calc(var(--w) * .12); text-align: center; font: 700 calc(var(--w) * .13)/1 var(--font-body); text-transform: uppercase; letter-spacing: .03em; }
.zc .pt { position: absolute; top: calc(var(--w) * .1); right: calc(var(--w) * .12); font: 700 calc(var(--w) * .15)/1 var(--font-body); opacity: .9; }
.zc.back {
  --ink: var(--saffron);
  background:
    radial-gradient(circle at 50% 50%, transparent 0 22%, rgba(245, 170, 62, .85) 23% 28%, transparent 29%),
    repeating-linear-gradient(45deg, #262f5e 0 5px, #1d2550 5px 10px);
  box-shadow: inset 0 0 0 1.5px rgba(245, 170, 62, .45), 0 2px 0 rgba(0, 0, 0, .35), 0 5px 12px rgba(0, 0, 0, .25);
}
.zc.mini { --w: 26px; box-shadow: inset 0 0 0 1px rgba(255, 224, 160, .45); }
.zc.mini::before { display: none; }
.zc.mini .mk, .zc.mini .lb, .zc.mini .pt { display: none; }
.zc.mini .num { margin: 0; }
.zc.mini .ico { margin: 0; width: 66%; }
.zc.empty { background: none; box-shadow: none; border: 1.5px dashed var(--line); }
.zc.empty::before { display: none; }
button.zc { cursor: pointer; }
button.zc:disabled { cursor: default; }
button.zc.pick { box-shadow: inset 0 0 0 1.5px rgba(255, 224, 160, .55), 0 0 0 3px var(--saffron), 0 8px 16px rgba(0, 0, 0, .35); }
button.zc.pick:active { transform: scale(.96); }
button.zc:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
@keyframes land { 0% { transform: perspective(500px) rotateY(85deg); filter: brightness(1.6); } 100% { transform: none; filter: none; } }
.zc.land { animation: land .42s cubic-bezier(.2, .8, .2, 1) both; }

/* ---------- lobby ---------- */
.hubnav { padding-top: 6px; display: flex; justify-content: space-between; align-items: center; }
.hubnav a { text-decoration: none; display: inline-block; }
.brand { text-align: center; padding: 18px 0 8px; }
.fan { display: flex; justify-content: center; align-items: flex-start; height: 112px; margin-bottom: 6px; }
.fan .zc { --w: 62px; margin: 0 -8px; transform: translateY(var(--y)) rotate(var(--r)); transform-origin: 50% 130%; }
.brand h1 { font: 52px/1 var(--font-display); margin: 4px 0 0; }
.brand h1 span { color: var(--saffron); }
.brand .tag { color: var(--muted); margin: 8px auto 0; max-width: 34ch; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 14px 0 0; display: grid; gap: 10px; }
.h2 { font: 22px/1.15 var(--font-display); margin: 0; }
.lab { font-size: 14px; color: var(--muted); }
.field { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--table); color: var(--text); font: 17px/1.2 var(--font-body); }
.field:focus-visible { outline: 3px solid var(--saffron); outline-offset: 1px; }
.field.share { font-size: 14px; color: var(--muted); }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 9px 14px; font-weight: 700; font-size: 15px; color: var(--muted); cursor: pointer; min-width: 48px; }
.seg button[aria-pressed="true"] { background: var(--saffron); color: var(--on-saffron); }
.seg button:focus-visible { outline: 3px solid #fff; outline-offset: -3px; }
.net { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.net i, .netdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.net.up i, .netdot.up { background: var(--good); box-shadow: 0 0 0 3px rgba(122, 215, 162, .18); }
.net.down i, .netdot.down, .net.off i, .netdot.off { background: var(--bad); }
.netdot { margin-left: 8px; vertical-align: 3px; }
.games { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.gitem { display: flex; align-items: stretch; gap: 6px; }
.gopen { flex: 1; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; text-align: left; padding: 11px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--raise); cursor: pointer; }
.gnames { font-weight: 700; }
.gstate { grid-column: 1; font-size: 14px; color: var(--muted); }
.gcta { grid-column: 2; grid-row: 1 / span 2; font-weight: 700; font-size: 14px; padding: 7px 11px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
.gitem.hot .gopen { border-color: var(--saffron); }
.gitem.hot .gstate { color: var(--saffron); }
.gitem.hot .gcta { background: var(--saffron); color: var(--on-saffron); border-color: var(--saffron); }
.icon-btn { width: 44px; flex: none; display: grid; place-items: center; border-radius: 12px; border: 1.5px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.icon-btn svg { width: 20px; height: 20px; }
.howto ol { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.howto li::marker { color: var(--saffron); font-weight: 700; }
.note { text-align: center; font-size: 13px; color: var(--muted); max-width: 44ch; margin: 18px auto 0; line-height: 1.45; }
.foot { text-align: center; margin: 14px 0 28px; }
.seated { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.seated li { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; background: var(--raise); }
.seated .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--table); font-weight: 700; font-size: 13px; }
.seated .tag { margin-left: auto; font-size: 13px; color: var(--muted); }
.names { display: grid; gap: 8px; }
.names .row { display: flex; gap: 6px; }
.names .row .field { flex: 1; }

/* ---------- pulsanti ---------- */
.btn { appearance: none; border: 1.5px solid var(--line); background: var(--raise); color: var(--text); border-radius: 12px; padding: 12px 14px; font: 700 15px/1.15 var(--font-body); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; touch-action: manipulation; }
.btn.primary { background: var(--saffron); border-color: var(--saffron); color: var(--on-saffron); }
.btn.call { background: var(--bad); border-color: var(--bad); color: #2b0d06; }
.btn.wide { width: 100%; }
.btn.sm { min-height: 36px; padding: 7px 12px; font-size: 14px; }
.btn:disabled { opacity: .42; cursor: default; }
.btn:focus-visible, .linkbtn:focus-visible, .gopen:focus-visible, .icon-btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.linkbtn { background: none; border: 0; padding: 8px 4px; color: var(--muted); font-weight: 700; font-size: 14px; cursor: pointer; text-decoration: none; }
.linkbtn.accent { color: var(--saffron); }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btnrow .btn { flex: 1; }

/* ---------- tavolo ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0 2px; }
.topbar .round { font: 17px/1 var(--font-display); }
.topbar .right { display: flex; gap: 2px; }
.banner { margin: 8px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--raise); border: 1px solid var(--line); font-size: 14px; display: grid; gap: 8px; }
.opps { display: grid; gap: 8px; margin-top: 8px; grid-template-columns: 1fr 1fr; }
.opps.one { grid-template-columns: 1fr; }
.opp { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; min-width: 0; }
.opp.turn { border-color: var(--saffron); box-shadow: 0 0 0 1px var(--saffron); }
.opp .hd { display: flex; align-items: baseline; gap: 6px; margin-bottom: 6px; min-width: 0; }
.opp .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opp .sc { margin-left: auto; font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.opp .sc b { color: var(--text); }
.mg { display: grid; grid-auto-flow: column; grid-template-rows: auto auto; gap: 3px; justify-content: start; overflow-x: auto; padding-bottom: 2px; }
.opps.one .mg .zc.mini { --w: 34px; }
.uno-flag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: var(--saffron); color: var(--on-saffron); }
.status { font: 26px/1.1 var(--font-display); text-align: center; margin: 12px 0 2px; }
.status.is-turn { color: var(--saffron); }
.lastmove { text-align: center; font-size: 14px; color: var(--muted); margin: 0; min-height: 1.5em; }
.lastmove .zc.mini { --w: 18px; display: inline-grid; vertical-align: -6px; margin: 0 1px; }
.lastmove .zc.mini .num { font-size: 12px; }
.bank { display: flex; justify-content: center; align-items: flex-end; gap: 18px; margin: 14px 0 4px; }
.pile { display: grid; justify-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.pile .zc { --w: 70px; }
.pile b { color: var(--text); font-variant-numeric: tabular-nums; }
.held .zc { --w: 78px; }
.held .cap { color: var(--saffron); font-weight: 700; }
.dirchip { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); }
.mine { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px 12px; margin-top: 12px; }
.mine.turn { border-color: var(--saffron); }
.mine .hd { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.mine .nm { font-weight: 700; font-size: 17px; }
.mine .sc { margin-left: auto; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mine .sc b { color: var(--text); }
.grid { display: grid; grid-auto-flow: column; grid-template-rows: auto auto auto; gap: 8px; justify-content: center; overflow-x: auto; padding: 4px 2px 2px; }
.grid > .zc { --w: inherit; } /* la larghezza calcolata sta sulla griglia: ogni .zc altrimenti la ridefinisce a 64px */
.clr { font-size: 12px; font-weight: 700; padding: 5px 4px; min-height: 30px; border-radius: 9px; background: var(--saffron); color: var(--on-saffron); border: 0; cursor: pointer; width: var(--w); }
.clr-gap { height: 30px; }
.actions { position: sticky; bottom: 0; z-index: 2; margin: 14px -16px 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); background: rgba(19, 24, 51, .95); border-top: 1px solid var(--line); display: grid; gap: 8px; margin-top: auto; }
.spacer { flex: 1; min-height: 14px; }
.hint { margin: 0; font-size: 15px; color: var(--muted); min-height: 2.8em; }
.hint.err { color: var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn { border: 1.5px solid var(--line); background: var(--raise); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px; cursor: pointer; }
.chip-btn[aria-pressed="true"] { background: var(--saffron); color: var(--on-saffron); border-color: var(--saffron); }

/* ---------- fogli ---------- */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(8, 10, 24, .7); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 88%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 20px 20px 0 0; padding: 20px 18px calc(22px + env(safe-area-inset-bottom)); display: grid; gap: 12px; }
.sheet h2 { font: 28px/1.1 var(--font-display); margin: 0; }
.sheet h3 { font-size: 15px; margin: 6px 0 0; color: var(--saffron); text-transform: uppercase; letter-spacing: .07em; }
.sheet p, .sheet ul { margin: 0; }
.sheet ul { padding-left: 20px; display: grid; gap: 6px; }
.eyebrow { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.tbl-wrap { overflow-x: auto; }
table.score { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.score th, table.score td { padding: 7px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.score th:first-child, table.score td:first-child { text-align: left; }
table.score thead th { color: var(--muted); font-size: 13px; font-weight: 700; }
table.score tr.win td { color: var(--saffron); font-weight: 700; }
table.score td.big { font: 22px/1 var(--font-display); }
.log { list-style: none; padding: 0; margin: 0; }
.log li { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.log li.sep { color: var(--saffron); font-weight: 700; }
.log .zc.mini { --w: 18px; display: inline-grid; vertical-align: -6px; margin: 0 1px; }
.log .zc.mini .num { font-size: 12px; }
table.score td.left { text-align: left; white-space: normal; min-width: 96px; }
.mrow { display: inline-flex; flex-wrap: wrap; gap: 3px; vertical-align: middle; }
.mrow .zc.mini { --w: 20px; }
.mrow .zc.mini .num { font-size: 13px; }
.cardrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.cardrow .zc { --w: 44px; }

@media (prefers-reduced-motion: reduce) { .zc, .zc.land { animation: none; transition: none; } }
@media (max-width: 380px) { .opps { grid-template-columns: 1fr; } }
@media (max-width: 400px) { .topbar .bk { display: none; } }
</style>
</head>
<body>
<svg class="defs" aria-hidden="true" focusable="false">
  <symbol id="m-M" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5" fill="currentColor"/></symbol>
  <symbol id="m-S" viewBox="0 0 20 20"><path d="M10 2.5L18 16.5H2Z" fill="currentColor"/></symbol>
  <symbol id="m-R" viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" rx="2.5" fill="currentColor"/></symbol>
  <symbol id="m-B" viewBox="0 0 20 20"><path d="M10 1.5L18.5 10L10 18.5L1.5 10Z" fill="currentColor"/></symbol>
  <symbol id="a-x" viewBox="0 0 48 48"><circle cx="24" cy="24" r="15" fill="none" stroke="currentColor" stroke-width="5"/><path d="M13.5 34.5L34.5 13.5" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></symbol>
  <symbol id="a-i" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 22A15 15 0 0 1 36 14"/><path d="M37 5V14H28"/><path d="M39 26A15 15 0 0 1 12 34"/><path d="M11 43V34H20"/></g></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 11v5.5M14 11v5.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>
<div id="app"></div>
<div id="layer"></div>
<script src="motore.js"></script>
<script src="../lib/mqtt.min.js"></script>
<script src="../lib/stanze.js"></script>
<script src="../lib/suoni.js"></script>
<script>
(function () {
  'use strict';
  var Z = window.Sottozero;
  var $app = document.getElementById('app');
  var $layer = document.getElementById('layer');
  var LS = {
    get: function (k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* niente memoria */ } },
    del: function (k) { try { window.localStorage.removeItem(k); } catch (e) { /* idem */ } }
  };
  function rnd36(n) { var o = '', a = 'abcdefghijklmnopqrstuvwxyz0123456789'; for (var i = 0; i < n; i++) o += a[Z.randInt(36)]; return o; }

  var ui = {
    route: 'lobby', gameId: null, online: 'connecting',
    game: null, gameMissing: false, missTimer: null,
    local: null, sheet: null, sheetId: null, hideResultKey: null,
    name: LS.get('sz-name') || '', rounds: +(LS.get('sz-rounds') || 9) || 9,
    localNames: (function () { try { var a = JSON.parse(LS.get('sz-lnames') || 'null'); return Array.isArray(a) && a.length >= 2 ? a : ['', '']; } catch (e) { return ['', '']; } })(),
    pair: [], error: '', copied: false, animKey: null, pendingAnim: null
  };
  ui.device = LS.get('sz-device');
  if (!ui.device) { ui.device = 'd' + rnd36(14); LS.set('sz-device', ui.device); }
  ui.myKey = 'd:' + ui.device;

  function validState(s) {
    return !!(s && s.app === 'sottozero' && typeof s.v === 'number' && Array.isArray(s.seats) && s.seats.length >= 1 &&
      s.seats.length <= 8 && s.grids && Array.isArray(s.deck) && Array.isArray(s.discard) && Array.isArray(s.totals));
  }
  var net = window.Stanze ? window.Stanze({
    topic: 'sottozero/v1', memoria: 'sz-', valida: validState,
    quandoArriva: function (id, prev, data) { onRoom(id, prev, data); },
    quandoCambiaRete: function (x) { ui.online = x; render(); }
  }) : null;

  /* ---------- testo ---------- */
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function nameOf(s, p) { return (s.seats[p] && s.seats[p].name) || ('Giocatore ' + (p + 1)); }

  function plural(n, a, b) { return n === 1 ? a : b; }
  function cardName(c) {
    var k = Z.kind(c);
    if (k === 'n') return Z.COLOR_NAME[c[0]] + ' ' + c[1];
    if (k === 'd') return 'Doppio pesca 2 ' + Z.COLOR_NAME[c[1]] + '/' + Z.COLOR_NAME[c[2]];
    return Z.ACTION_NAME[k] + ' ' + Z.COLOR_NAME[c[0]];

  function mark(col, cls) { return '<svg class="mk ' + cls + '" aria-hidden="true" viewBox="0 0 20 20"><use href="#m-' + col + '"/></svg>'; }

  // Una carta scoperta. opts: {mini, tag, attrs, cls}
  function cardHTML(c, opts) {
    opts = opts || {};
    var k = Z.kind(c), inner, cls = 'zc', style = '';
    if (k === 'd') {
      cls += ' dbl';
      style = '--k1:var(--c' + c[1] + ');--k2:var(--c' + c[2] + ');';
      inner = '<span class="num dd">+2<br>+2</span>' + mark(c[1], 'a') + mark(c[2], 'b') + '<span class="pt">' + Z.valueOf(c) + '</span>';
    } else {
      cls += ' k-' + c[0];
      if (k === 'n') inner = '<span class="num">' + c[1] + '</span>' + mark(c[0], 'a') + mark(c[0], 'b');
      else if (k === 'p') inner = '<span class="num sm">+2</span><span class="lb">Pesca</span>' + mark(c[0], 'a') + '<span class="pt">' + Z.valueOf(c) + '</span>';
      else inner = '<svg class="ico" aria-hidden="true" viewBox="0 0 48 48"><use href="#a-' + k + '"/></svg><span class="lb">' + Z.ACTION_NAME[k] + '</span>' + mark(c[0], 'a') + '<span class="pt">' + Z.valueOf(c) + '</span>';
    }

    if (tag !== 'button') a11y += ' role="img"';
    return '<' + tag + ' class="' + cls + '" style="' + style + (opts.style || '') + '" ' + (opts.attrs || '') + a11y + '>' + inner + '</' + tag + '>';
  }
  function backHTML(opts) {
    opts = opts || {};
    var tag = opts.tag || 'span';
    var a11y = /aria-label=/.test(opts.attrs || '') ? '' : ' aria-label="Carta coperta"' + (tag !== 'button' ? ' role="img"' : '');
    return '<' + tag + ' class="zc back' + (opts.mini ? ' mini' : '') + (opts.cls ? ' ' + opts.cls : '') + '" ' + (opts.attrs || '') + a11y + '></' + tag + '>';

  function minis(list) { return list.map(function (c) { return cardHTML(c, { mini: true }); }).join(''); }

  /* ---------- prospettiva ---------- */
  function cur() { return ui.route === 'local' ? ui.local : ui.game; }
  function persp(s) {
    if (s.mode === 'local') return { me: s.status === 'playing' ? s.turn : (s.result ? s.result.next : 0), seated: true, local: true };
    var seat = Z.seatOf(s, ui.myKey);

  function who(s, P, p) { return (!P.local && P.seated && p === P.me) ? 'tu' : hn(s, p); }
  function Who(s, P, p) { var w = who(s, P, p); return w === 'tu' ? 'Tu' : w; }

  function describe(e, s, P) {
    var me = !P.local && P.seated && e.s === P.me;
    var subj = me ? 'Hai' : hn(s, e.s) + ' ha';
    var out = '';
    switch (e.t) {
      case 'round': return 'Round ' + e.r + ': comincia ' + who(s, P, e.s);
      case 'shuffle': return 'Il mazzo è finito: rimescolati gli scarti';
      case 'clear': return subj + ' eliminato una colonna ' + minis(e.c);
      case 'uno': return Who(s, P, e.s) + ': «Ultima!»' + (e.late ? ' (appena in tempo)' : '');
      case 'caught': return (P.seated && !P.local && e.s === P.me ? 'Non hai' : hn(s, e.s) + ' non ha') + ' detto «Ultima!»: ' + e.n + ' carte di penalità';
      case 'dd': return subj + ' giocato Doppio pesca 2: ' + (e.four ? who(s, P, e.who[0]) + ' pesca 4 carte' : who(s, P, e.who[0]) + ' e ' + who(s, P, e.who[1]) + ' pescano 2 carte');
      case 'end': return 'Round ' + e.r + ' chiuso da ' + who(s, P, e.s);

        out = subj + (e.from === 'discard' ? ' preso dagli scarti ' : ' pescato ') + minis([e.c]) + ' al posto di ' + (e.wasUp ? '' : 'una coperta: ') + minis([e.out]);

      case 'toss':

    if (e.skipped != null) out += '. ' + Who(s, P, e.skipped) + ' salta il turno';
    if (e.victim != null) out += '. ' + Who(s, P, e.victim) + ' pesca ' + (e.got || 2) + ' carte e salta il turno';
    if (e.top && Z.kind(e.top) === 'i') out += '. Si gira nell\'altro senso';

  }

  /* ---------- mossa proposta ---------- */
  function phaseInfo(s, P) {
    if (s.status === 'roundEnd' || s.status === 'gameOver') return { ended: true, hint: s.status === 'gameOver' ? 'Partita finita.' : 'Round finito.' };
    if (!P.seated) return { hint: 'Stai guardando la partita.' };
    var me = P.me, mine = s.turn === me;
    if (!mine) return { wait: true, hint: 'Tocca a ' + hn(s, s.turn) + ': il tavolo si aggiorna da solo.' };
    if (!P.local && ui.online !== 'up') return { wait: true, hint: 'Senza connessione: aspetto di ricollegarmi per mandare la mossa.' };
    var top = s.discard[s.discard.length - 1];
    switch (s.phase) {
      case 'draw': return { hint: 'Pesca dal mazzo oppure prendi lo scarto' + (top && Z.isAction(top) ? ' (le carte azione negli scarti non si prendono)' : '') + '.' };
      case 'place': return { hint: s.heldFrom === 'deck' ? 'Tocca una carta della tua griglia per sostituirla, oppure scarta quella pescata.' : 'Tocca la carta della tua griglia da sostituire: quella presa dagli scarti va usata.' };
      case 'flip': return { hint: 'Scopri una delle tue carte coperte.' };
      case 'end': {
        var parts = [];
        if (Z.clearable(s, me).length) parts.push('Puoi eliminare la colonna con le due carte abbinate.');
        if (Z.faceDown(s, me) === 1 && !s.unoSaid) parts.push('Ti resta una sola carta coperta: di\' «Ultima!» prima di passare.');
        return { hint: parts.join(' ') || 'Fine del turno.' };
      }
      case 'choose': return { hint: 'Doppio pesca 2: scegli chi pesca le carte.' };
    }
    return { hint: '' };
  }

  /* ---------- HTML del tavolo ---------- */
  function topbarHTML(s, P) {
    return '<header class="topbar"><button class="linkbtn" data-act="lobby" aria-label="' + (P.local ? 'Esci' : 'Torna alle partite') + '">‹<span class="bk"> ' + (P.local ? 'Esci' : 'Partite') + '</span></button>' +
      '<span class="round">Round ' + s.round + ' di ' + s.rounds + (P.local ? '' : netDot()) + '</span>' +
      '<span class="right">' + snd() + '<button class="linkbtn" data-act="scores">Punti</button><button class="linkbtn" data-act="log">Storico</button><button class="linkbtn" data-act="rules">Regole</button></span></header>';
  }
  function bannersHTML(s, P) {

    }

  function oppHTML(s, p, P) {

    var flag = (s.status === 'playing' && fd === 1) ? ' <span class="uno-flag">1 coperta</span>' : '';
    return '<section class="opp' + (s.status === 'playing' && s.turn === p ? ' turn' : '') + '" aria-label="' + hn(s, p) + '">' +
      '<div class="hd"><span class="nm">' + hn(s, p) + '</span>' + flag + '<span class="sc">tot. <b>' + (s.totals[p] || 0) + '</b></span></div>' +
      '<div class="mg">' + (cards || '<span class="muted small">griglia vuota</span>') + '</div></section>';
  }
  function statusHTML(s, P) {
    var text, cls = '';

      if (P.local) { text = 'Tocca a ' + hn(s, s.turn); cls = ' is-turn'; }
      else if (P.seated && s.turn === P.me) { text = 'Tocca a te'; cls = ' is-turn'; }
      else text = 'Tocca a ' + hn(s, s.turn);
    } else text = s.status === 'gameOver' ? 'Partita finita' : 'Round ' + s.round + ' finito';

  function bankHTML(s, P, anim) {

    var top = s.discard[s.discard.length - 1];

    var canTake = mine && s.phase === 'draw' && top && !Z.isAction(top);
    var deck = backHTML({ tag: 'button', cls: canDraw ? 'pick' : '', attrs: 'type="button" data-act="draw"' + (canDraw ? '' : ' disabled') + ' aria-label="Pesca dal mazzo"' });
    var disc = top ? cardHTML(top, { tag: 'button', cls: (canTake ? 'pick' : '') + (anim ? ' land' : ''), attrs: 'type="button" data-act="take"' + (canTake ? '' : ' disabled') }) : '<span class="zc empty"></span>';

      }).join('');

      '<div class="grid" style="--w:' + w + 'px">' + (cells || '<span class="muted">Griglia vuota: punteggio zero!</span>') + '</div></section>';
  }
  function actionsHTML(s, P) {
    var a = phaseInfo(s, P), me = P.me, h = '';

      if (P.local) {
        h += '<div class="btnrow"><button class="btn call" data-act="catch" data-by="other">Richiama ' + hn(s, m) + '</button><button class="btn" data-act="catch" data-by="self">' + hn(s, m) + ' dice «Ultima!»</button></div>';

        h += '<div class="btnrow"><button class="btn primary" data-act="draw"' + (s.deck.length || s.discard.length > 1 ? '' : ' disabled') + '>Pesca dal mazzo</button>' +

  function animKeyOf(s) { return s.v + '/' + s.round + '/' + (s.nonce || ''); }

  /* ---------- lobby ---------- */

  function roomsListHTML() {

  }
  function lobbyHTML() {
    var saved = ui.local && ui.local.status !== 'gameOver';
    var label = ui.online === 'up' ? 'Nuova partita online' : (ui.online === 'connecting' ? 'Mi collego…' : 'Senza connessione');
    return '<nav class="hubnav"><a class="linkbtn" href="../">‹ Tutti i giochi</a>' + snd() + '</nav>' +
      '<header class="brand">' + fanHTML() + '<h1>Sotto<span>zero</span></h1>' +
      '<p class="tag">Scambia le carte della tua griglia e chiudi ogni round con meno punti possibile. Da 2 a 8 giocatori.</p></header>' +
      '<section class="panel"><div class="row-between"><label class="lab" for="nm">Il tuo nome al tavolo</label>' + netChipHTML() + '</div>' +
      '<input id="nm" class="field" maxlength="20" autocomplete="nickname" placeholder="Come ti chiamano?" value="' + esc(ui.name) + '">' +
      '<div class="row-between"><span class="lab">Round della partita</span>' + roundsSeg(ui.rounds, 'rounds') + '</div>' +
      '<button type="button" class="btn primary wide" data-act="new"' + (ui.online === 'up' ? '' : ' disabled') + '>' + label + '</button>' +

  function captureFocus() {

  /* ---------- suoni (lib/suoni.js): musica del gioco ed effetti quando cambia il tavolo ---------- */
  function snd() { return window.Suoni ? Suoni.bottone() : ''; }
  if (window.Suoni) Suoni.tema('sottozero');
  var sfxSeen = { key: null, snap: null };
  function sfxSnap(s, P) { return { v: s.v, nonce: s.nonce || '', round: s.round, status: s.status, turn: s.turn, last: JSON.stringify(s.last || null), tail: JSON.stringify((s.log || [])[(s.log || []).length - 1] || null), mine: s.status === 'playing' && !P.local && P.seated && s.turn === P.me }; }
  function sfxNames(a, s, P) {
    var out = [];
    if (s.round !== a.round) out.push('mescola');
    else {
      var e = (s.log || [])[(s.log || []).length - 1];
      if (s.last && JSON.stringify(s.last) !== a.last) out.push(s.last.t === 'toss' ? 'scarta' : 'carta');
      if (e && JSON.stringify(e) !== a.tail) { if (e.t === 'clear') out.push('fuoco'); else if (e.t === 'caught') out.push('ruba'); else if (e.t === 'uno') out.push('punti'); }
    }
    if (s.status !== a.status && s.status !== 'playing') out.push(s.status === 'gameOver' ? 'vittoria' : 'punti');
    if (s.status === 'playing' && b(a.mine) !== b(sfxSnap(s, P).mine) && sfxSnap(s, P).mine) out.push('turno');

  }
  function b(x) { return !!x; }

    var key = (ui.route === 'local' ? 'L' : ui.gameId) + '/' + s.createdAt, P = persp(s);
    var prev = sfxSeen.key === key ? sfxSeen.snap : null;
    if (prev && prev.v === s.v && prev.nonce === (s.nonce || '')) return;

  /* ---------- rotte ---------- */
  function route() {

  /* ---------- online ---------- */
  function openGame(id) {
    ui.gameId = id;

  function onRoom(id, prev, data) {
    var seat = Z.seatOf(data, ui.myKey);
    var mineNow = seat >= 0 && data.status === 'playing' && data.turn === seat;
    var minePrev = !!prev && seat >= 0 && prev.status === 'playing' && prev.turn === seat;
    if (mineNow && !minePrev && prev) { try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) { /* ok */ } }
    if (ui.route === 'game' && ui.gameId === id) {

  function writeGame(make, opts) {

    if (!curS) return;
    if (opts.expectV != null && curS.v !== opts.expectV) {
      ui.error = 'Il tavolo era cambiato: ecco la situazione aggiornata.';
      ui.game = curS; render(); return;

    var r = make(Z.clone(curS));

    var next = r.state;

    s.nonce = net.nonce();
    net.aggiungi(id); net.salva(id, s); net.guarda(id); net.pubblica(id, s);
    go('#partita-' + id);
  }

  /* ---------- sullo stesso telefono ---------- */

  }

  var actions = {
    lobby: function () { go(''); },
    'go-local': function () { go('#locale'); },
    open: function (el) { go('#partita-' + el.dataset.id); },
    'new': createGame,
    rounds: function (el) { ui.rounds = +el.dataset.n; LS.set('sz-rounds', String(ui.rounds)); if (ui.route === 'local') readNames(); render(); },
    'ask-del': function (el) { ui.sheet = 'del'; ui.sheetId = el.dataset.id; render(); },
    del: function () { var id = ui.sheetId; ui.sheet = null; if (net && id) net.togli(id); render(); },
    close: function () { ui.sheet = null; render(); },
    rules: function () { ui.sheet = 'rules'; render(); },
    log: function () { ui.sheet = 'log'; render(); },
    scores: function () { ui.sheet = 'scores'; render(); },
    'hide-result': function () { ui.hideResultKey = resultKey(cur()); ui.error = ''; render(); },
    'show-result': function () { ui.hideResultKey = null; render(); },
    share: function () {
      var s = ui.game, text = (s ? nameOf(s, s.host) : 'Un amico') + ' ti invita a Sottozero: apri il link e siediti al tavolo.';
      if (navigator.share) navigator.share({ title: 'Sottozero', text: text, url: shareUrl(ui.gameId) }).catch(function () { /* annullato */ });
      else actions.copy();
    },
    copy: function () {
      var done = function () { ui.copied = true; render(); setTimeout(function () { ui.copied = false; render(); }, 2200); };
      var fallback = function () { var el = document.getElementById('share-url'); if (el) { el.focus(); el.select(); } };
      try { navigator.clipboard.writeText(shareUrl(ui.gameId)).then(done, fallback); } catch (e) { fallback(); }
    },
    join: function () {
      var name = (ui.name || '').trim() || 'Giocatore';
      LS.set('sz-name', name);
      var key = ui.myKey;
      writeGame(function (c) { return Z.join(c, key, name); });
    },
    start: function () { var s = ui.game; if (s) writeGame(function (c) { return Z.startGame(c); }, { expectV: s.v }); },
    claim: function (el) { var seat = +el.dataset.seat, key = ui.myKey; writeGame(function (c) { return Z.addSeatKey(c, seat, key); }); },
    draw: function () { play({ type: 'draw' }); },
    take: function () { play({ type: 'take' }); },
    toss: function () { play({ type: 'toss' }); },
    uno: function () { play({ type: 'uno' }); },
    end: function () { play({ type: 'end' }); },
    clear: function (el) { play({ type: 'clear', col: +el.dataset.col }); },
    cell: function (el) {
      var s = cur(); if (!s) return;
      var m = { col: +el.dataset.col, row: +el.dataset.row };
      play({ type: s.phase === 'flip' ? 'flip' : 'place', col: m.col, row: m.row });
    },
    four: function (el) { play({ type: 'target', who: [+el.dataset.seat], four: true }); },
    pair: function (el) {
      var i = +el.dataset.seat, k = ui.pair.indexOf(i);
      if (k >= 0) ui.pair.splice(k, 1); else { ui.pair.push(i); if (ui.pair.length > 2) ui.pair.shift(); }
      render();
    },
    'pair-go': function () { if (ui.pair.length === 2) play({ type: 'target', who: ui.pair.slice(), four: false }); },
    'catch': function (el) {
      var s = cur(); if (!s || s.unoMiss < 0) return;
      if (persp(s).local) {
        var by = el.dataset.by === 'self' ? s.unoMiss : (s.unoMiss + 1) % s.seats.length;
        play({ type: 'catch' }, { seat: by });
      } else play({ type: 'catch' });
    },
    'next-round': function () { transition('nextRound'); },
    rematch: function () { transition('rematch'); },
    'ln-add': function () { readNames(); if (ui.localNames.length < 8) ui.localNames.push(''); LS.set('sz-lnames', JSON.stringify(ui.localNames)); render(); },
    'ln-del': function (el) { readNames(); ui.localNames.splice(+el.dataset.i, 1); LS.set('sz-lnames', JSON.stringify(ui.localNames)); render(); },
    'local-start': function () {
      readNames();
      var names = ui.localNames.map(function (n, i) { return (n || '').trim() || 'Giocatore ' + (i + 1); });
      ui.local = Z.startLocal(names, ui.rounds); ui.hideResultKey = null; saveLocal(); render();
    },
    'local-reset': function () { ui.local = null; saveLocal(); ui.hideResultKey = null; if (ui.route === 'local') render(); else go('#locale'); }
  };

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    if (el.dataset.self && ev.target !== el) return;
    var fn = actions[el.dataset.act];
    if (fn) { ev.preventDefault(); fn(el, ev); }
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'nm') { ui.name = t.value; LS.set('sz-name', t.value); }
    else if (/^ln-\d+$/.test(t.id)) { ui.localNames[+t.id.slice(3)] = t.value; LS.set('sz-lnames', JSON.stringify(ui.localNames)); }
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && ui.sheet) { ui.sheet = null; render(); } });
  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var s = ui.route === 'lobby' ? null : cur();
      if (s && s.status !== 'waiting' && document.activeElement && document.activeElement.tagName !== 'INPUT') render();
    }, 150);
  });

  /* ---------- avvio ---------- */
  ui.local = loadLocal();
  route();
  if (net) net.avvia(); else { ui.online = 'off'; render(); }
})();
</script>
</body>
</html>
